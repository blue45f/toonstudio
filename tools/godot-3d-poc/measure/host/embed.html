<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Godot 3D PoC 임베드 호스트</title>
<style>html,body{margin:0;background:#fff}iframe{border:0;width:960px;height:540px;display:block}</style>
</head>
<body>
<!--
  운영 임베드(StudioGodotSpaceEmbed.tsx)와 같은 모양의 호스트 페이지: 호스트 브리지를 먼저 등록하고 iframe 을 띄운다.
  쿼리: stage=<iframe 주소>, img=<교차 출처 이미지 주소(선택)>
-->
<iframe id="stage" allow="autoplay; fullscreen"></iframe>
<img id="xorigin" alt="" style="display:none">
<script type="module">
import { createTs3dHost } from "./ts3d-host.js";
const params = new URLSearchParams(location.search);
const frame = document.getElementById("stage");
window.__host = createTs3dHost(frame);
window.__hostInfo = { crossOriginIsolated: self.crossOriginIsolated, sab: typeof SharedArrayBuffer };
// 이 호스트 페이지는 로컬 측정 하니스 전용이다. 쿼리 값은 하니스가 만든 형태만 받아들인다:
//  - stage: 같은 출처의 /g/<이름>/index.html
//  - img: 로컬 보조 서버의 /x.png (교차 출처 이미지 시험용)
const STAGE_PATH = /^\/g\/[a-z0-9_-]+\/index\.html$/;
const LOCAL_IMAGE = /^http:\/\/(?:127\.0\.0\.1|localhost):\d{2,5}\/x\.png$/;
const img = params.get("img");
if (img && LOCAL_IMAGE.test(img)) {
  const el = document.getElementById("xorigin");
  window.__imgResult = new Promise((resolve) => {
    el.onload = () => resolve({ loaded: true, w: el.naturalWidth });
    el.onerror = () => resolve({ loaded: false });
  });
  el.src = img;
}
window.__stageLoadStart = performance.now();
const stage = params.get("stage");
if (stage && STAGE_PATH.test(stage)) frame.src = stage;
</script>
</body>
</html>
