<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #10131a; }
    #unity-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #tsvs-loading {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #dfe6f5; font-family: system-ui, sans-serif; font-size: 14px;
    }
    #tsvs-progress { width: 220px; height: 6px; background: #2a3040; border-radius: 3px; margin-top: 10px; }
    #tsvs-progress-bar { height: 100%; width: 0%; background: #7a99e6; border-radius: 3px; }
  </style>
</head>
<body>
  <canvas id="unity-canvas"></canvas>
  <div id="tsvs-loading">
    <div>
      <div>공간 엔진을 불러오는 중이에요…</div>
      <div id="tsvs-progress"><div id="tsvs-progress-bar"></div></div>
    </div>
  </div>

  <script>
    // ── TSVS page glue (DESIGN §4.2) ─────────────────────────────────────
    // The shell talks to this page through the __tsvs_* globals below; each
    // forwards into Unity as SendMessage("TsvsBridge", "On*", arg). Calls
    // that arrive before the stage scene is ready are QUEUED and flushed in
    // order — the flush is triggered from C# (TsvsBridge.Start ->
    // TsvsBridge_FlushQueue) because scene readiness, not instance
    // readiness, is the real gate.
    //
    // Deliberately absent: __tsvs_requestReconnect. The shell declares it
    // but never calls it (DESIGN §2.2 #4); it is not implemented.
    window.__tsvsBootQuery = window.location.search || "";
    window.__godotBgState = "idle";   // polled by the current shell
    window.__tsvsBgState = "idle";    // polled by the renamed shell

    window.__tsvsQueue = [];
    window.__tsvsStageReady = false;

    function tsvsSend(method, arg) {
      if (window.__tsvsStageReady && window.__tsvsUnityInstance) {
        window.__tsvsUnityInstance.SendMessage("TsvsBridge", method, arg);
      } else {
        window.__tsvsQueue.push([method, arg]);
      }
    }

    window.__tsvsFlushQueue = function () {
      window.__tsvsStageReady = true;
      var queued = window.__tsvsQueue;
      window.__tsvsQueue = [];
      for (var i = 0; i < queued.length; i++) {
        window.__tsvsUnityInstance.SendMessage("TsvsBridge", queued[i][0], queued[i][1]);
      }
    };

    window.__tsvs_setSession = function (json) { tsvsSend("OnSetSession", String(json || "")); };
    window.__tsvs_setVisibility = function (hidden) { tsvsSend("OnSetVisibility", hidden ? "1" : "0"); };
    window.__tsvs_bridgePing = function () { tsvsSend("OnBridgePing", ""); };
    window.__tsvs_sendSignal = function (json) { tsvsSend("OnSendSignal", String(json || "")); };
    window.__tsvs_showBubble = function (json) { tsvsSend("OnShowBubble", String(json || "")); };
    window.__tsvs_showEmote = function (json) { tsvsSend("OnShowEmote", String(json || "")); };
    window.__tsvs_setEditMode = function (enabled) { tsvsSend("OnSetEditMode", enabled ? "1" : "0"); };
    window.__tsvs_applyLayout = function (json) { tsvsSend("OnApplyLayout", String(json || "")); };
    window.__tsvs_layoutCommand = function (json) { tsvsSend("OnLayoutCommand", String(json || "")); };
    window.__tsvs_notifyLayout = function (json) { tsvsSend("OnNotifyLayout", String(json || "")); };
  </script>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#tsvs-loading");
    var progressBar = document.querySelector("#tsvs-progress-bar");

    createUnityInstance(canvas, {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}"
    }, function (progress) {
      progressBar.style.width = (progress * 100).toFixed(0) + "%";
    }).then(function (unityInstance) {
      window.__tsvsUnityInstance = unityInstance;
      loading.style.display = "none";
    }).catch(function (message) {
      loading.firstElementChild.textContent = "공간 엔진을 불러오지 못했어요.";
      console.error(message);
    });

    // Page unload (space switch = iframe reload): release the instance so
    // memory is returned promptly (DESIGN §4.2).
    window.addEventListener("beforeunload", function () {
      if (window.__tsvsUnityInstance) {
        window.__tsvsUnityInstance.Quit();
      }
    });
  </script>
</body>
</html>
