[package]
name = "studio-wasm64-drawing-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ToonStudio 순수 Rust WebAssembly 64비트(memory64) 호환 코어 드로잉 엔진 커널 (외부 크레이트 의존성 0개)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# 확장 3D VRM 스키닝·Morton BVH·LT 선화 C-ABI 익스포트 (기본 < 48 KiB 바이너리 계약 보존)
extended-3d = []
# 가상 물리·손가락 IK·Foley CPU 커널과 추가 C-ABI (기존 3D 옵션과 별도 활성화)
virtual-3d-physics = ["extended-3d"]

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
