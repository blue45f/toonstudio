[package]
name = "studio-engine-vello"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ToonStudio V11 deterministic CPU reference renderer: SceneIR JSON -> RGBA8 via vello_cpu (Linebender sparse-strip CPU renderer)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vello_cpu = "0.3.0"
# V12 WebGPU wasm PoC lane — optional, excluded from default wasm-pack builds.
vello = { version = "0.11", optional = true }
# Real sparse-strip hybrid renderer; product use is gated by explicit preflight.
vello_hybrid = { version = "0.2", optional = true, default-features = false, features = ["wgpu"] }
# V12 Velato lane — Lottie(bodymovin) -> vello Scene lowering; velato 0.12.0
# depends on vello ^0.10 (crates.io index 실측), so the vello 0.11 port rides
# on the vendored copy in crates/vendor/velato with the pin moved to 0.11.
velato = { version = "0.12", optional = true }
# V12 native SVG lane. vello_svg 0.11.0 pins vello 0.10.0, so the vello 0.11
# port rides on the vendored copy in crates/vendor/vello-svg with the pin
# moved to 0.11. Raster image codecs
# stay disabled: the bounded lane rejects image/pattern/filter/mask/text before
# lowering instead of accepting vello_svg's red-box/bbox approximations.
vello_svg = { version = "=0.11.0", optional = true, default-features = false }
# Raw XML capability audit before usvg normalizes or drops unsupported syntax.
# usvg 0.48 already uses this exact parser line, so it adds no second XML stack.
roxmltree = { version = "=0.21.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
parley = { version = "0.11", default-features = false, features = ["std", "system"] }
# Parley 0.11 intentionally exposes horizontal paragraph layout only. The
# vertical single-style lane therefore calls the same pinned HarfRust shaper
# directly with Direction::TopToBottom so GSUB vert/vrt2 are real substitutions,
# not feature-presence claims or Unicode presentation-form rewrites.
harfrust = { version = "0.12", default-features = false, features = ["std"] }
skrifa = "0.43"

[features]
default = []
gpu = ["dep:vello", "dep:wasm-bindgen-futures", "dep:js-sys"]
# V12 §5 toon-vello fork track — StudioGpuFabric device adoption.
# Track A (`upstream`, default): `toon-fabric` off, so crates/vendor/wgpu-toon
# compiles byte-equivalent to crates.io wgpu 30.0.1 and this module is absent.
# Track B (`toon`): this feature on, enabling the vendored patch and the
# `adopt_gpu_device` / `render_scene_gpu_texture_json` entry points.
# See docs/engines/vello-baseline.md §3.
fabric = ["gpu", "dep:wgpu"]
# Real upstream Vello Hybrid on the adopted StudioGpuFabric device.
hybrid = ["fabric", "dep:vello_hybrid"]
# Velato Lottie lane (ADR-0011): rides on the gpu render path, so it is a
# strict superset feature — `pkg-gpu` is built with `--features hybrid,lottie,svg`.
lottie = ["gpu", "dep:velato"]
# SVG parsing/lowering is usable by the vello_cpu reference without WebGPU;
# the browser pkg-gpu combines this with `gpu`/`lottie` at build time.
svg = ["dep:vello_svg", "vello_svg/vello", "dep:roxmltree"]

# V12 lane 2 (ADR-0011): browser WebGPU async entry needs the JS futures
# bridge; both stay optional so the default CPU wasm artifact is unchanged.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
# V12 §5 fork track: only the `fabric` feature needs wgpu by name (to turn on
# `wgpu/toon-fabric`); vello pulls the same crate transitively otherwise.
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["toon-fabric"] }

# ---------------------------------------------------------------------------
# V12 §5.1 toon-vello fork track — the fork is a first-class product asset, not
# a hidden temporary patch. `crates/vendor/wgpu-toon` is crates.io wgpu 30.0.1
# (sha256 527ccdf43dd5b2e8676eed9984ce00e2bbb0a1b85b70c1969dcb6cd2eb55ab9e,
# verified against the crates.io index) plus TOON-PATCH 0001, rebased onto
# wgpu 30 in the vello 0.11 port: wgpu 30 already ships the patch's export
# half upstream, so the remaining hunks are only the `toon-fabric`-gated
# adoption half (`Device::from_webgpu_handle`). With the feature off — the
# default, i.e. build track A — every hunk compiles out and the crate is
# API-identical to upstream, which is what makes track A a real
# upstream-regression detector. `crates/vendor/wgpu-toon/UPSTREAM.sha256`
# pins every vendored file and `tests/vendor_patch_parity.rs` fails on any
# undeclared drift.
#
# The same port vendors three more crates whose latest releases still pin
# the old majors, each with its pin moved and the API drift absorbed in the
# vendored copy (see TOON-VENDOR.md in each directory):
# - `crates/vendor/vello-hybrid` (vello_hybrid 0.2.0): wgpu 29.0.3 -> 30.0.1.
# - `crates/vendor/velato` (velato 0.12.0): vello 0.10.0 -> 0.11.0.
# - `crates/vendor/vello-svg` (vello_svg 0.11.0): vello 0.10.0 -> 0.11.0.
# Remove each when upstream releases a version on the new major.
# ---------------------------------------------------------------------------
[patch.crates-io]
wgpu = { path = "../vendor/wgpu-toon" }
vello_hybrid = { path = "../vendor/vello-hybrid" }
velato = { path = "../vendor/velato" }
vello_svg = { path = "../vendor/vello-svg" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
# wasm-pack 0.15.0이 받는 Binaryen은 Rust 1.97이 내는 bulk-memory/비포획
# (nontrapping) 명령을 거부한다(studio-hokusai-wasm과 같은 사유). LLVM 릴리스
# 최적화와 LTO는 그대로 두고 호환되지 않는 선택 후처리만 건너뛴다.
wasm-opt = false

# ADR-0010: Vello GPU(Classic) 네이티브 검증 전용 — wasm 산출물에 포함되지 않는다.
# velato: tests/lottie_parity.rs가 src/lottie.rs를 #[path]로 포함해 기본
# 피처에서도 Lottie 레인을 네이티브 검증한다(gpu_scene.rs와 같은 패턴).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
vello = "0.11"
velato = "0.12"
pollster = "0.4"
# V12 lane 5 재개 게이트 2단계: tests/wgsl_variant_validation.rs가 커밋 WGSL
# variant 코퍼스(tests/corpus/wgsl-variants/)를 naga로 전수 파싱+검증한다.
# 코퍼스가 wgpu 29 세대 naga로 캡처된 기준이라 핀을 유지한다 — wgpu 30의
# naga 30으로 다시 캡처할 때 함께 올린다 (wasm 아티팩트에는 닿지 않는다).
naga = { version = "29.0", features = ["wgsl-in"] }
