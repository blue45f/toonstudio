name: Bundle visualizer

# Bundle composition report (library scout REPORT §3.2): the numeric bundle
# ratchet (scripts/check-studio-bundle.mjs) says how much shipped; this
# treemap says what shipped. Report-only — it never gates a merge, and the
# plugin is added to the Vite config only when BUNDLE_VISUALIZER=1, so a
# normal production build and its emitted chunks are unchanged.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/bundle-visualizer.yml'
      - 'scripts/__tests__/bundle-visualizer-contract.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/web/vite.config.ts'
  workflow_dispatch:
  schedule:
    - cron: "11 16 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  bundle-visualizer:
    name: Bundle composition treemap (report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Visualizer wiring contract (opt-in stays opt-in)
        run: pnpm exec vitest run scripts/__tests__/bundle-visualizer-contract.test.mjs
      - name: Build with the visualizer enabled (report lands in .qa/)
        run: pnpm run bundle:visualize
      - name: Keep the bundle composition report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundle-visualizer-report
          path: .qa/bundle-visualizer.html
          retention-days: 5
          if-no-files-found: warn
