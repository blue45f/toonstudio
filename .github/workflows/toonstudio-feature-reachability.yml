name: ToonStudio feature reachability

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/src/app/routes/groups/**"
      - "apps/web/src/domains/creator/**"
      - "scripts/verify-toonstudio-feature-reachability.mjs"
      - "scripts/feature-reachability-checkout.test.mjs"
      - ".github/workflows/toonstudio-feature-reachability.yml"

permissions:
  contents: read

concurrency:
  group: toonstudio-feature-reachability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/web/src/
            /scripts/verify-toonstudio-feature-reachability.mjs
            /.github/workflows/toonstudio-feature-reachability.yml
            /scripts/feature-reachability-checkout.test.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - run: node scripts/verify-toonstudio-feature-reachability.mjs
      - run: node --test scripts/feature-reachability-checkout.test.mjs
