name: Studio finishing quality regression

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, release/salvage-integration-20260908]
    paths:
      - 'vitest.setup.ts'
      - 'scripts/check-studio-bundle.mjs'
      - 'scripts/lib/studio-crdt-bundle-boundary*'
      - 'scripts/lib/repo-paths.mjs'
      - 'scripts/integration-test-runner-ci-policy.test.mjs'
      - 'apps/web/vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/studio-quality-*.ts'
      - 'apps/web/src/domains/creator/studio-finish-quality*.ts'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/studio-finish-quality*.ts'
      - 'apps/web/src/domains/creator/StudioContinuityPanel*.tsx'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/StudioFinishQualityView*.tsx'
      - 'apps/web/src/domains/creator/StudioLazyPanelStack*.tsx'
      - 'apps/web/src/domains/creator/StudioMenubarContent*.tsx'
      - 'apps/web/src/domains/creator/StudioMenubarContent.test-fixture.tsx'
      - 'apps/web/src/domains/creator/studio-main-menu-items-production.ts'
      - 'apps/web/src/domains/creator/hybrid-dcc/StudioHybridDccCameraRig*.tsx'
      - 'scripts/verify-studio-menus.mts'
      - 'scripts/verify-studio-menus-ci.mjs'
      - 'scripts/verify-studio-menus.test.ts'
      - 'scripts/lib/studio-verify-render-settle*'
      - 'apps/web/src/domains/creator/offline-branch/**'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/studio-deferred-stroke-commit*'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/runtime/createStudioCrdtTransitionPublisher.ts'
      - 'scripts/ci-executed-gates.test.mjs'
      - 'scripts/studio-quality-bundle-leaves.test.mjs'
      - 'scripts/ci-enospc-followup-policy.test.mjs'
      - '.github/workflows/studio-finishing-quality.yml'
  push:
    branches: ["main", "release/salvage-integration-20260908"]
    paths:
      - 'vitest.setup.ts'
      - 'scripts/check-studio-bundle.mjs'
      - 'scripts/lib/studio-crdt-bundle-boundary*'
      - 'scripts/lib/repo-paths.mjs'
      - 'scripts/integration-test-runner-ci-policy.test.mjs'
      - 'apps/web/vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/studio-quality-*.ts'
      - 'apps/web/src/domains/creator/studio-finish-quality*.ts'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/studio-finish-quality*.ts'
      - 'apps/web/src/domains/creator/StudioContinuityPanel*.tsx'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/StudioFinishQualityView*.tsx'
      - 'apps/web/src/domains/creator/StudioLazyPanelStack*.tsx'
      - 'apps/web/src/domains/creator/StudioMenubarContent*.tsx'
      - 'apps/web/src/domains/creator/StudioMenubarContent.test-fixture.tsx'
      - 'apps/web/src/domains/creator/studio-main-menu-items-production.ts'
      - 'apps/web/src/domains/creator/hybrid-dcc/StudioHybridDccCameraRig*.tsx'
      - 'scripts/verify-studio-menus.mts'
      - 'scripts/verify-studio-menus-ci.mjs'
      - 'scripts/verify-studio-menus.test.ts'
      - 'scripts/lib/studio-verify-render-settle*'
      - 'apps/web/src/domains/creator/offline-branch/**'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/studio-deferred-stroke-commit*'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/runtime/createStudioCrdtTransitionPublisher.ts'
      - 'scripts/ci-executed-gates.test.mjs'
      - 'scripts/studio-quality-bundle-leaves.test.mjs'
      - 'scripts/ci-enospc-followup-policy.test.mjs'
      - '.github/workflows/studio-finishing-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

# main 푸시도 최신 커밋만 남긴다. 그룹을 SHA 로 묶으면 main 실행이 저마다 다른 그룹이 되어
# cancel-in-progress 가 취소할 대상을 갖지 못한다 (ref 로 묶어야 같은 그룹이 된다). 이 게이트는
# 브랜치 보호의 필수 체크가 아니므로 최신 main 상태만 검증하면 되고, 커밋별 신호가 필요한
# ci.yml 은 그대로 SHA 로 묶어 둔다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: 체크아웃 전 미사용 SDK 정리와 디스크 여유 확인
        shell: bash
        env:
          TOONSTUDIO_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOONSTUDIO_CI_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux || "${ImageOS:-}" != ubuntu24 || "${TOONSTUDIO_CI_RUNNER_ENVIRONMENT:-}" != github-hosted || "${TOONSTUDIO_CI_RUNNER_OS:-}" != Linux ]] || [[ "$(uname -s)" != Linux ]]; then
            printf 'SDK 정리는 GitHub 호스팅 Ubuntu 24.04에서만 허용합니다.\n' >&2
            exit 1
          fi
          if [[ "${GITHUB_WORKSPACE:-}" != /* ]]; then
            printf '절대 작업공간 경로가 필요합니다.\n' >&2
            exit 1
          fi
          workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          for target in "$GITHUB_WORKSPACE" "$workspace" /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            component=$target
            while [[ "$component" != / ]]; do
              if test -L "$component"; then
                printf '심볼릭 링크 경로는 정리할 수 없습니다: %s\n' "$component" >&2
                exit 1
              fi
              component=${component%/*}
              component=${component:-/}
            done
          done
          for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            if [[ "$workspace" == / || "$workspace" == "$target" || "$workspace" == "$target/"* || "$target" == "$workspace/"* ]]; then
              printf '작업공간과 SDK 경로가 겹칩니다: %s\n' "$target" >&2
              exit 1
            fi
          done
          report_disk() {
            local disk_usage disk_row
            disk_usage=$(df -P -B1 "$workspace")
            printf '%s\n' "$disk_usage"
            df -Pi "$workspace"
            disk_row=${disk_usage#*$'\n'}
            if [[ "$disk_row" == "$disk_usage" ]]; then
              printf '디스크 여유 측정 행이 없습니다.\n' >&2
              exit 1
            fi
            read -r _ _ _ available_bytes _ <<< "$disk_row"
            if [[ ! "$available_bytes" =~ ^[0-9]{1,18}$ ]]; then
              printf '디스크 여유 바이트가 정수가 아닙니다.\n' >&2
              exit 1
            fi
            available_bytes=$((10#$available_bytes))
            for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
              if test -e "$target"; then
                du -s -B1 -- "$target"
              else
                printf 'SDK 경로 없음: %s\n' "$target"
              fi
            done
          }
          printf 'SDK 정리 전 디스크 상태\n'
          report_disk
          sudo rm -rf -- /usr/local/lib/android/sdk /usr/share/dotnet/sdk
          printf 'SDK 정리 후 디스크 상태\n'
          report_disk
          if (( available_bytes < 21474836480 )); then
            printf '전체 체크아웃과 빌드에 필요한 최소 20 GiB 여유가 없습니다: %s 바이트\n' "$available_bytes" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record exact checked revision
        run: |
          mkdir -p "$RUNNER_TEMP/quality-static"
          git rev-parse HEAD > "$RUNNER_TEMP/quality-static/revision.txt"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: 미사용 SDK 정리와 기존 검사 범위 계약 확인
        run: node --test scripts/ci-enospc-followup-policy.test.mjs
      - name: Architecture and full zero-warning lint
        run: |
          set -euo pipefail
          pnpm run validate:architecture 2>&1 | tee "$RUNNER_TEMP/quality-static/architecture.log"
          pnpm run lint:strict 2>&1 | tee "$RUNNER_TEMP/quality-static/lint.log"
      - name: Frontend and API type contracts
        run: |
          set -euo pipefail
          pnpm run typecheck 2>&1 | tee "$RUNNER_TEMP/quality-static/typecheck.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-static
          if-no-files-found: error
          retention-days: 7

  finishing-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: 체크아웃 전 미사용 SDK 정리와 디스크 여유 확인
        shell: bash
        env:
          TOONSTUDIO_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOONSTUDIO_CI_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux || "${ImageOS:-}" != ubuntu24 || "${TOONSTUDIO_CI_RUNNER_ENVIRONMENT:-}" != github-hosted || "${TOONSTUDIO_CI_RUNNER_OS:-}" != Linux ]] || [[ "$(uname -s)" != Linux ]]; then
            printf 'SDK 정리는 GitHub 호스팅 Ubuntu 24.04에서만 허용합니다.\n' >&2
            exit 1
          fi
          if [[ "${GITHUB_WORKSPACE:-}" != /* ]]; then
            printf '절대 작업공간 경로가 필요합니다.\n' >&2
            exit 1
          fi
          workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          for target in "$GITHUB_WORKSPACE" "$workspace" /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            component=$target
            while [[ "$component" != / ]]; do
              if test -L "$component"; then
                printf '심볼릭 링크 경로는 정리할 수 없습니다: %s\n' "$component" >&2
                exit 1
              fi
              component=${component%/*}
              component=${component:-/}
            done
          done
          for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            if [[ "$workspace" == / || "$workspace" == "$target" || "$workspace" == "$target/"* || "$target" == "$workspace/"* ]]; then
              printf '작업공간과 SDK 경로가 겹칩니다: %s\n' "$target" >&2
              exit 1
            fi
          done
          report_disk() {
            local disk_usage disk_row
            disk_usage=$(df -P -B1 "$workspace")
            printf '%s\n' "$disk_usage"
            df -Pi "$workspace"
            disk_row=${disk_usage#*$'\n'}
            if [[ "$disk_row" == "$disk_usage" ]]; then
              printf '디스크 여유 측정 행이 없습니다.\n' >&2
              exit 1
            fi
            read -r _ _ _ available_bytes _ <<< "$disk_row"
            if [[ ! "$available_bytes" =~ ^[0-9]{1,18}$ ]]; then
              printf '디스크 여유 바이트가 정수가 아닙니다.\n' >&2
              exit 1
            fi
            available_bytes=$((10#$available_bytes))
            for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
              if test -e "$target"; then
                du -s -B1 -- "$target"
              else
                printf 'SDK 경로 없음: %s\n' "$target"
              fi
            done
          }
          printf 'SDK 정리 전 디스크 상태\n'
          report_disk
          sudo rm -rf -- /usr/local/lib/android/sdk /usr/share/dotnet/sdk
          printf 'SDK 정리 후 디스크 상태\n'
          report_disk
          if (( available_bytes < 21474836480 )); then
            printf '전체 체크아웃과 빌드에 필요한 최소 20 GiB 여유가 없습니다: %s 바이트\n' "$available_bytes" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record exact checked revision
        run: |
          mkdir -p "$RUNNER_TEMP/finishing-quality"
          git rev-parse HEAD > "$RUNNER_TEMP/finishing-quality/revision.txt"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: 미사용 SDK 정리와 기존 검사 범위 계약 확인
        run: node --test scripts/ci-enospc-followup-policy.test.mjs
      - name: Run finishing, review ownership, camera and navigation contracts
        run: |
          set -euo pipefail
          node --test scripts/studio-quality-bundle-leaves.test.mjs 2>&1 | tee "$RUNNER_TEMP/finishing-quality/bundle-models.log"
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-quality-inspection.test.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-quality-inspection-hardening.test.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-quality-raster-inspection.test.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-quality-finish-bridge.test.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-finish-quality.test.ts \
            apps/web/src/domains/creator/studio-finish-quality-integration.test.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/StudioFinishQualityView.test.tsx \
            apps/web/src/domains/creator/StudioContinuityPanel.test.tsx \
            apps/web/src/domains/creator/StudioContinuityPanel.hardening.test.tsx \
            apps/web/src/domains/creator/StudioLazyPanelStack.test.tsx \
            apps/web/src/domains/creator/StudioMenubarContent.test.tsx \
            apps/web/src/domains/creator/studio-review-entry-point-viewports.test.tsx \
            apps/web/src/domains/creator/StudioToolBeltContent.hints.test.ts \
            apps/web/src/domains/creator/studio-router/StudioRouteCollaborationGateway.test.tsx \
            apps/web/src/domains/creator/studio-router/studio-production-command-center-boundary.test.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-adjustment-stack.test.ts \
            apps/web/src/domains/creator/studio-ux-convergence-boundary.test.ts \
            apps/web/src/domains/creator/hybrid-dcc/StudioHybridDccCameraRig.test.tsx \
            --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/finishing-quality/tests.log"
      - name: Verify canonical resize and offline rejection contracts
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/offline-branch/studio-offline-branch-runtime.test.ts \
            apps/web/src/domains/creator/offline-branch/studio-offline-host-integration.test.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-deferred-stroke-commit.test.ts \
            scripts/verify-studio-menus.test.ts
      - name: Build the production browser surface with types and CSP checks
        run: |
          set -euo pipefail
          pnpm run build 2>&1 | tee "$RUNNER_TEMP/finishing-quality/build.log"
          pnpm run check:studio-bundle 2>&1 | tee "$RUNNER_TEMP/finishing-quality/bundle.log"
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production menus, rail and export entry points
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/verify-studio-menus-ci.mjs 2>&1 | tee "$RUNNER_TEMP/finishing-quality/menus.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: finishing-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/finishing-quality
          if-no-files-found: error
          retention-days: 7

# This workflow executes its checks independently of the inherited CI bypass flag.
# It cannot write product files, commit statuses, approvals, or merge a pull request.
