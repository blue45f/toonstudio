name: Public site experience

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-site-experience.yml'
      - 'scripts/*public-site-experience.mjs'
      - 'scripts/public-site-observation-policy*'
      - 'apps/web/src/shared/components/public-site-*'
      - 'apps/web/src/shared/components/site-public-routes.ts'
      - 'apps/web/src/app/PublicSite*'
      - 'apps/web/src/app/public-site-*'
      - 'apps/web/src/app/App.tsx'
      - 'apps/web/src/app/AppShell.tsx'
      - 'apps/web/src/domains/catalog/SearchPage*'
      - 'apps/web/src/shared/components/feedback/NotFoundPage.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-experience-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  production-observation:
    name: Read-only production browser observation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: public-site-production-observation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            apps/web/src/app/routes/groups
            .github/ci-tools/playwright
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Select this PR, SHA and hourly observation window
        id: observation-window
        env:
          OBSERVATION_SHA: ${{ github.sha }}
          OBSERVATION_PR: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { buildObservationKey } from './scripts/public-site-observation-policy.mjs';
          const key = buildObservationKey({ sha: process.env.OBSERVATION_SHA, pullRequest: process.env.OBSERVATION_PR });
          appendFileSync(process.env.GITHUB_OUTPUT, `key=${key}\n`);
          NODE
      - name: Reuse only a completed observation from the same window
        id: observation-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/public-site-observation-receipt
          key: ${{ steps.observation-window.outputs.key }}
      - name: Record reused observation evidence
        if: steps.observation-cache.outputs.cache-hit == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const receipt = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'public-site-observation-receipt/receipt.json'), 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `같은 PR·SHA·1시간 관측 구간의 완료 기록을 재사용했습니다. 후보 회귀 게이트는 별도로 실행합니다.\n\n이전 관측: ${receipt.runUrl}\n\n관측 완료: ${receipt.completedAt}\n`);
          NODE
      - name: Install isolated, pinned browser tooling
        if: steps.observation-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/public-site-browser"
          cp .github/ci-tools/playwright/package.json .github/ci-tools/playwright/package-lock.json "$RUNNER_TEMP/public-site-browser/"
          npm ci --prefix "$RUNNER_TEMP/public-site-browser" --ignore-scripts --no-audit --no-fund
          node "$RUNNER_TEMP/public-site-browser/node_modules/playwright/cli.js" install --with-deps chromium
          cp scripts/audit-public-site-experience.mjs "$RUNNER_TEMP/public-site-browser/audit.mjs"
          cp scripts/public-site-observation-policy.mjs "$RUNNER_TEMP/public-site-browser/public-site-observation-policy.mjs"
      - name: Observe public routes without submitting forms or entering Studio
        if: steps.observation-cache.outputs.cache-hit != 'true'
        env:
          AUDIT_REPOSITORY: ${{ github.workspace }}
          AUDIT_OUTPUT: ${{ github.workspace }}/public-site-audit
          AUDIT_BASE_URL: https://www.toonstudio.cloud
        run: node "$RUNNER_TEMP/public-site-browser/audit.mjs"
      - name: Record completed observation receipt
        if: steps.observation-cache.outputs.cache-hit != 'true'
        env:
          OBSERVATION_KEY: ${{ steps.observation-window.outputs.key }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const directory = path.join(process.env.RUNNER_TEMP, 'public-site-observation-receipt');
          mkdirSync(directory, { recursive: true });
          writeFileSync(path.join(directory, 'receipt.json'), JSON.stringify({
            key: process.env.OBSERVATION_KEY,
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            completedAt: new Date().toISOString(),
          }));
          NODE
      - name: Keep screenshots and complete coverage inventory
        if: always() && steps.observation-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-site-production-observation
          path: public-site-audit
          retention-days: 7
      - name: Save completed observation for this window only
        if: success() && steps.observation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/public-site-observation-receipt
          key: ${{ steps.observation-window.outputs.key }}

  candidate-regression:
    name: Public site candidate regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Production observation budget and freshness contracts
        run: node --test scripts/public-site-observation-policy.test.mjs
      - name: Navigation, search, storage and public boundary regressions
        run: |
          pnpm exec vitest run \
            apps/web/src/app/public-site-scroll.test.ts \
            apps/web/src/app/RouteScrollRestoration.fragment.test.tsx \
            apps/web/src/app/public-site-storage.test.ts \
            apps/web/src/app/public-site-wiring.test.ts \
            apps/web/src/shared/components/public-site-pathways.test.ts \
            apps/web/src/shared/components/public-site-experience.test.tsx \
            apps/web/src/domains/catalog/SearchPage.navigation.test.tsx \
            apps/web/src/domains/catalog/SearchPage.fragment-navigation.test.tsx
      - name: Build the exact candidate production bundle
        run: pnpm run build:bundle
      - run: pnpm exec playwright install --with-deps chromium
      - name: Real browser layout, keyboard, history and recovery checks
        run: |
          set -euo pipefail
          pnpm exec vite preview --config apps/web/vite.config.ts --host 127.0.0.1 --port 5281 > /tmp/public-site-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5281/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-public-webtoon-experience.mjs
          node scripts/verify-public-site-experience.mjs
          AUDIT_BASE_URL=http://127.0.0.1:5281 AUDIT_OUTPUT=artifacts/public-site-candidate-inventory node scripts/audit-public-site-experience.mjs
      - name: Keep candidate screenshots and check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-site-candidate-evidence
          path: |
            artifacts/public-webtoon-experience
            artifacts/public-site-experience
            artifacts/public-site-candidate-inventory
          retention-days: 7
