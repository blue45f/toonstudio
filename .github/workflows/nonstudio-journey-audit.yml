name: Non-studio journey audit
on:
  push:
    branches: [feat/nonstudio-luminous-journeys-20260913]
  pull_request:
    paths:
      - apps/web/src/shared/components/site-experience/**
      - apps/web/src/shared/lib/library-backup.ts
      - apps/web/src/shared/lib/browser-preferences.ts
      - apps/web/src/shared/lib/navigation-memory.ts
      - apps/web/src/app/RouteScrollRestoration.tsx
      - apps/web/src/domains/community/CommunityPage.tsx
      - apps/web/src/domains/community/components/community-scope-directory*
      - scripts/*nonstudio*
      - .github/workflows/nonstudio-journey-audit.yml
permissions:
  contents: read
concurrency:
  group: nonstudio-journey-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 체크아웃 전 미사용 SDK 정리와 디스크 여유 확인
        shell: bash
        env:
          TOONSTUDIO_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOONSTUDIO_CI_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux || "${ImageOS:-}" != ubuntu24 || "${TOONSTUDIO_CI_RUNNER_ENVIRONMENT:-}" != github-hosted || "${TOONSTUDIO_CI_RUNNER_OS:-}" != Linux ]] || [[ "$(uname -s)" != Linux ]]; then
            printf 'SDK 정리는 GitHub 호스팅 Ubuntu 24.04에서만 허용합니다.\n' >&2
            exit 1
          fi
          if [[ "${GITHUB_WORKSPACE:-}" != /* ]]; then
            printf '절대 작업공간 경로가 필요합니다.\n' >&2
            exit 1
          fi
          workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          for target in "$GITHUB_WORKSPACE" "$workspace" /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            component=$target
            while [[ "$component" != / ]]; do
              if test -L "$component"; then
                printf '심볼릭 링크 경로는 정리할 수 없습니다: %s\n' "$component" >&2
                exit 1
              fi
              component=${component%/*}
              component=${component:-/}
            done
          done
          for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            if [[ "$workspace" == / || "$workspace" == "$target" || "$workspace" == "$target/"* || "$target" == "$workspace/"* ]]; then
              printf '작업공간과 SDK 경로가 겹칩니다: %s\n' "$target" >&2
              exit 1
            fi
          done
          report_disk() {
            local disk_usage disk_row
            disk_usage=$(df -P -B1 "$workspace")
            printf '%s\n' "$disk_usage"
            df -Pi "$workspace"
            disk_row=${disk_usage#*$'\n'}
            if [[ "$disk_row" == "$disk_usage" ]]; then
              printf '디스크 여유 측정 행이 없습니다.\n' >&2
              exit 1
            fi
            read -r _ _ _ available_bytes _ <<< "$disk_row"
            if [[ ! "$available_bytes" =~ ^[0-9]{1,18}$ ]]; then
              printf '디스크 여유 바이트가 정수가 아닙니다.\n' >&2
              exit 1
            fi
            available_bytes=$((10#$available_bytes))
            for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
              if test -e "$target"; then
                du -s -B1 -- "$target"
              else
                printf 'SDK 경로 없음: %s\n' "$target"
              fi
            done
          }
          printf 'SDK 정리 전 디스크 상태\n'
          report_disk
          sudo rm -rf -- /usr/local/lib/android/sdk /usr/share/dotnet/sdk
          printf 'SDK 정리 후 디스크 상태\n'
          report_disk
          if (( available_bytes < 21474836480 )); then
            printf '전체 체크아웃과 빌드에 필요한 최소 20 GiB 여유가 없습니다: %s 바이트\n' "$available_bytes" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Storage, backup and destination contracts
        run: node --test scripts/nonstudio-journey-contract.test.mjs
      - name: Component and existing policy regressions
        run: pnpm exec vitest run apps/web/src/shared/components/site-experience/site-experience.test.tsx apps/web/src/domains/community/components/community-scope-directory.test.tsx apps/web/src/domains/legal/policy-page.test.tsx apps/web/src/shared/components/site-public-routes.test.ts apps/web/src/app/app-shell-no-splash.test.ts apps/web/src/app/StudioRouterDocumentNavigationBoundary.test.tsx
      - name: Strict lint of modified public surfaces
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/web/src/shared/components/site-experience
          apps/web/src/shared/lib/library-backup.ts
          apps/web/src/shared/lib/browser-preferences.ts
          apps/web/src/shared/lib/navigation-memory.ts
          apps/web/src/shared/lib/safe-route-text.ts
          apps/web/src/app/App.tsx
          apps/web/src/app/AppShell.tsx
          apps/web/src/app/RouteScrollRestoration.tsx
          apps/web/src/app/routes/route-titles.ts
          apps/web/src/domains/account/SettingsPage.tsx
          apps/web/src/domains/legal/PolicyPage.tsx
          apps/web/src/domains/community/CommunityPage.tsx
          apps/web/src/domains/community/components/community-scope-directory.tsx
          apps/web/src/domains/community/components/community-scope-directory.test.tsx
      - name: Install component browser
        if: github.event_name == 'push'
        run: pnpm exec playwright install --with-deps chromium
      - name: Actual branch component browser checks with synthetic fixtures
        if: github.event_name == 'push'
        run: node scripts/verify-nonstudio-components.mjs
      - name: Upload branch component evidence
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: nonstudio-component-evidence-${{ github.run_id }}
          path: artifacts/nonstudio-components
          retention-days: 7
  public-browser-audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/web/src
            scripts
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install isolated browser audit dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/nonstudio-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/nonstudio-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Public production navigation and CSS preview audit
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/nonstudio-browser/node_modules/playwright/index.mjs
          NONSTUDIO_BASE_URL: https://www.toonstudio.cloud
        run: node scripts/verify-nonstudio-live.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nonstudio-browser-evidence-${{ github.run_id }}
          path: artifacts/nonstudio-audit
          retention-days: 7
