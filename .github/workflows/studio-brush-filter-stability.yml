name: Studio brush and filter stability

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, release/salvage-integration-20260908]
    paths:
      - 'apps/web/src/domains/creator/brush/**'
      - 'apps/web/src/domains/creator/brush-lab/**'
      - 'apps/web/src/domains/creator/filter/**'
      - 'apps/web/src/domains/creator/live/studio-live-retained-media-overlay.ts'
      - 'apps/web/src/domains/creator/export/studio-svg-export-freehand-media.ts'
      - 'apps/web/src/domains/creator/StudioBrushHubPanel*'
      - 'apps/web/src/domains/creator/studio-brush-*'
      - 'apps/web/src/domains/creator/studio-image-filter*'
      - 'apps/web/src/domains/creator/studio-detail*'
      - 'scripts/verify-studio-brushes.mts'
      - 'scripts/verify-studio-filter-dialog.mts'
      - 'scripts/lib/studio-filter-*'
      - 'scripts/lib/studio-drawing-readiness*'
      - 'scripts/studio-review-host-qa-runtime*'
      - 'scripts/studio-review-host-steps.ts'
      - 'scripts/isolated-market-api*'
      - 'scripts/prepare-studio-review-test-db.mjs'
      - 'apps/api/**'
      - 'apps/web/src/app/styles/studio-overlay-stacking.css'
      - 'apps/web/src/domains/creator/studio-shell/MobileFullEditNotice*'
      - 'apps/web/src/domains/creator/studio-status-overlay-stacking.test.ts'
      - 'apps/web/src/domains/creator/live/studio-live-socket-endpoint*'
      - 'apps/web/vite.config.ts'
      - 'scripts/verify-studio-source-hydration.mts'
      - 'apps/web/src/platform/creator-work-read-options*'
      - 'apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx'
      - 'apps/web/src/domains/creator/studio-shared-document-client*'
      - 'apps/web/src/domains/creator/studio-release-schedule-loader*'
      - '.github/workflows/studio-brush-filter-stability.yml'
  push:
    branches: [main, release/salvage-integration-20260908]
    paths:
      - 'apps/web/src/domains/creator/brush/**'
      - 'apps/web/src/domains/creator/brush-lab/**'
      - 'apps/web/src/domains/creator/filter/**'
      - 'apps/web/src/domains/creator/live/studio-live-retained-media-overlay.ts'
      - 'apps/web/src/domains/creator/export/studio-svg-export-freehand-media.ts'
      - 'apps/web/src/domains/creator/StudioBrushHubPanel*'
      - 'apps/web/src/domains/creator/studio-brush-*'
      - 'apps/web/src/domains/creator/studio-image-filter*'
      - 'apps/web/src/domains/creator/studio-detail*'
      - 'scripts/verify-studio-brushes.mts'
      - 'scripts/verify-studio-filter-dialog.mts'
      - 'scripts/lib/studio-filter-*'
      - 'scripts/lib/studio-drawing-readiness*'
      - 'scripts/studio-review-host-qa-runtime*'
      - 'scripts/studio-review-host-steps.ts'
      - 'scripts/isolated-market-api*'
      - 'scripts/prepare-studio-review-test-db.mjs'
      - 'apps/api/**'
      - 'apps/web/src/app/styles/studio-overlay-stacking.css'
      - 'apps/web/src/domains/creator/studio-shell/MobileFullEditNotice*'
      - 'apps/web/src/domains/creator/studio-status-overlay-stacking.test.ts'
      - 'apps/web/src/domains/creator/live/studio-live-socket-endpoint*'
      - 'apps/web/vite.config.ts'
      - 'scripts/verify-studio-source-hydration.mts'
      - 'apps/web/src/platform/creator-work-read-options*'
      - 'apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx'
      - 'apps/web/src/domains/creator/studio-shared-document-client*'
      - 'apps/web/src/domains/creator/studio-release-schedule-loader*'
      - '.github/workflows/studio-brush-filter-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

# This non-required evidence suite keeps the latest PR/ref run; ci.yml independently
# runs the required core validation for each active pull request or main push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: 체크아웃 전 미사용 SDK 정리와 디스크 여유 확인
        shell: bash
        env:
          TOONSTUDIO_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOONSTUDIO_CI_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux || "${ImageOS:-}" != ubuntu24 || "${TOONSTUDIO_CI_RUNNER_ENVIRONMENT:-}" != github-hosted || "${TOONSTUDIO_CI_RUNNER_OS:-}" != Linux ]] || [[ "$(uname -s)" != Linux ]]; then
            printf 'SDK 정리는 GitHub 호스팅 Ubuntu 24.04에서만 허용합니다.\n' >&2
            exit 1
          fi
          if [[ "${GITHUB_WORKSPACE:-}" != /* ]]; then
            printf '절대 작업공간 경로가 필요합니다.\n' >&2
            exit 1
          fi
          workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          for target in "$GITHUB_WORKSPACE" "$workspace" /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            component=$target
            while [[ "$component" != / ]]; do
              if test -L "$component"; then
                printf '심볼릭 링크 경로는 정리할 수 없습니다: %s\n' "$component" >&2
                exit 1
              fi
              component=${component%/*}
              component=${component:-/}
            done
          done
          for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            if [[ "$workspace" == / || "$workspace" == "$target" || "$workspace" == "$target/"* || "$target" == "$workspace/"* ]]; then
              printf '작업공간과 SDK 경로가 겹칩니다: %s\n' "$target" >&2
              exit 1
            fi
          done
          report_disk() {
            local disk_usage disk_row
            disk_usage=$(df -P -B1 "$workspace")
            printf '%s\n' "$disk_usage"
            df -Pi "$workspace"
            disk_row=${disk_usage#*$'\n'}
            if [[ "$disk_row" == "$disk_usage" ]]; then
              printf '디스크 여유 측정 행이 없습니다.\n' >&2
              exit 1
            fi
            read -r _ _ _ available_bytes _ <<< "$disk_row"
            if [[ ! "$available_bytes" =~ ^[0-9]{1,18}$ ]]; then
              printf '디스크 여유 바이트가 정수가 아닙니다.\n' >&2
              exit 1
            fi
            available_bytes=$((10#$available_bytes))
            for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
              if test -e "$target"; then
                du -s -B1 -- "$target"
              else
                printf 'SDK 경로 없음: %s\n' "$target"
              fi
            done
          }
          printf 'SDK 정리 전 디스크 상태\n'
          report_disk
          sudo rm -rf -- /usr/local/lib/android/sdk /usr/share/dotnet/sdk
          printf 'SDK 정리 후 디스크 상태\n'
          report_disk
          if (( available_bytes < 21474836480 )); then
            printf '전체 체크아웃과 빌드에 필요한 최소 20 GiB 여유가 없습니다: %s 바이트\n' "$available_bytes" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Consolidated product catalogue and render boundary contracts
        run: |
          set -o pipefail
          mkdir -p /tmp/studio-stability-unit-evidence
          git rev-parse HEAD > /tmp/studio-stability-unit-evidence/commit.txt
          pnpm exec vitest run \
            apps/web/src/domains/creator/brush/studio-brush-quality-portfolio.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-listed-uniqueness.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-browser-evidence.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-composition-runtime.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-composition-runtime-boundary.test.ts \
            apps/web/src/domains/creator/brush/StudioBrushEngineProgramControls.test.tsx \
            apps/web/src/domains/creator/brush-lab/brush-studio-v5-quality.test.ts \
            apps/web/src/domains/creator/brush-lab/brush-studio-version-integration.test.ts \
            2>&1 | tee /tmp/studio-stability-unit-evidence/brush-product-contracts.log
          pnpm exec tsx scripts/audit-studio-brush-quality-portfolio.mts \
            2>&1 | tee /tmp/studio-stability-unit-evidence/brush-product-audit.log
      - name: Worker recovery, exact median pixels, texture loading and verifier regressions
        run: |
          set -o pipefail
          mkdir -p /tmp/studio-stability-unit-evidence
          git rev-parse HEAD > /tmp/studio-stability-unit-evidence/commit.txt
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-image-filter-worker-client.test.ts \
            apps/web/src/domains/creator/studio-image-filter-worker-stability.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-r8-grain-hydrator.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-r8-png-decoder.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-browser-harness-boundary.test.ts \
            apps/web/src/domains/creator/studio-detail.test.ts \
            apps/web/src/domains/creator/studio-detail-median-stability.test.ts \
            scripts/studio-review-host-qa-runtime.test.mjs \
            scripts/isolated-market-api.test.ts \
            scripts/lib/studio-filter-canonical-evidence.test.ts \
            scripts/lib/studio-filter-connection-fault.test.ts \
            scripts/lib/studio-filter-comparison-region.test.ts \
            scripts/lib/studio-drawing-readiness.test.ts \
            scripts/lib/studio-filter-comparison-clip.test.ts \
            scripts/lib/studio-filter-verification-mode.test.ts \
            apps/web/src/domains/creator/filter/StudioFilterDialog.test.tsx \
            apps/web/src/domains/creator/offline-branch/studio-offline-branch-scene-bridge.test.ts \
            2>&1 | tee /tmp/studio-stability-unit-evidence/tests.log
      - name: Preserve focused regression results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-stability-unit-results
          path: /tmp/studio-stability-unit-evidence
          retention-days: 7
          if-no-files-found: warn
      - run: pnpm run build:bundle
        env:
          VITE_STUDIO_AUTOMERGE_OFFLINE_BRANCH: "true"
      - name: Require the production manifest used by SQLite durability checks
        run: test -s dist/.vite/manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: studio-stability-dist
          path: dist
          include-hidden-files: true
          retention-days: 3
      - name: Preserve the tested filter Worker separately for reproducible CPU soak tests
        uses: actions/upload-artifact@v7
        with:
          name: studio-stability-filter-worker
          path: |
            dist/assets/studio-image-filter.worker-*.js
            dist/.vite/manifest.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        suite: [filters, desktop, long, shapes, mobile, durability, source]
    services:
      postgres:
        # 필터 정본 검증만 새 DB를 소유한다. 다른 matrix 실행은 서비스를 시작하지 않는다.
        image: ${{ matrix.suite == 'filters' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: studio_filter_test
          POSTGRES_DB: studio_filter_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio_filter_test -d studio_filter_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      TOONSPECTRUM_VERIFY_DIR: /tmp/studio-stability-evidence
    steps:
      - name: 체크아웃 전 미사용 SDK 정리와 디스크 여유 확인
        shell: bash
        env:
          TOONSTUDIO_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOONSTUDIO_CI_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux || "${ImageOS:-}" != ubuntu24 || "${TOONSTUDIO_CI_RUNNER_ENVIRONMENT:-}" != github-hosted || "${TOONSTUDIO_CI_RUNNER_OS:-}" != Linux ]] || [[ "$(uname -s)" != Linux ]]; then
            printf 'SDK 정리는 GitHub 호스팅 Ubuntu 24.04에서만 허용합니다.\n' >&2
            exit 1
          fi
          if [[ "${GITHUB_WORKSPACE:-}" != /* ]]; then
            printf '절대 작업공간 경로가 필요합니다.\n' >&2
            exit 1
          fi
          workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          for target in "$GITHUB_WORKSPACE" "$workspace" /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            component=$target
            while [[ "$component" != / ]]; do
              if test -L "$component"; then
                printf '심볼릭 링크 경로는 정리할 수 없습니다: %s\n' "$component" >&2
                exit 1
              fi
              component=${component%/*}
              component=${component:-/}
            done
          done
          for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            if [[ "$workspace" == / || "$workspace" == "$target" || "$workspace" == "$target/"* || "$target" == "$workspace/"* ]]; then
              printf '작업공간과 SDK 경로가 겹칩니다: %s\n' "$target" >&2
              exit 1
            fi
          done
          report_disk() {
            local disk_usage disk_row
            disk_usage=$(df -P -B1 "$workspace")
            printf '%s\n' "$disk_usage"
            df -Pi "$workspace"
            disk_row=${disk_usage#*$'\n'}
            if [[ "$disk_row" == "$disk_usage" ]]; then
              printf '디스크 여유 측정 행이 없습니다.\n' >&2
              exit 1
            fi
            read -r _ _ _ available_bytes _ <<< "$disk_row"
            if [[ ! "$available_bytes" =~ ^[0-9]{1,18}$ ]]; then
              printf '디스크 여유 바이트가 정수가 아닙니다.\n' >&2
              exit 1
            fi
            available_bytes=$((10#$available_bytes))
            for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
              if test -e "$target"; then
                du -s -B1 -- "$target"
              else
                printf 'SDK 경로 없음: %s\n' "$target"
              fi
            done
          }
          printf 'SDK 정리 전 디스크 상태\n'
          report_disk
          sudo rm -rf -- /usr/local/lib/android/sdk /usr/share/dotnet/sdk
          printf 'SDK 정리 후 디스크 상태\n'
          report_disk
          if (( available_bytes < 21474836480 )); then
            printf '전체 체크아웃과 빌드에 필요한 최소 20 GiB 여유가 없습니다: %s 바이트\n' "$available_bytes" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec playwright install --with-deps chromium
      - name: 전체 빌드 산출물 수신 전 디스크·inode 사용량 기록
        shell: bash
        run: |
          set -euo pipefail
          df -P -B1 "$GITHUB_WORKSPACE"
          df -Pi "$GITHUB_WORKSPACE"
          for target in .git apps/web/public node_modules dist "$RUNNER_TEMP" "${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"; do
            if test -e "$target"; then du -s -B1 -- "$target"; fi
          done
      - uses: actions/download-artifact@v8
        with:
          name: studio-stability-dist
          path: dist
      - name: 전체 빌드 산출물 수신 후 디스크·inode 사용량 기록
        shell: bash
        run: |
          set -euo pipefail
          df -P -B1 "$GITHUB_WORKSPACE"
          df -Pi "$GITHUB_WORKSPACE"
          for target in .git apps/web/public node_modules dist "$RUNNER_TEMP" "${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"; do
            if test -e "$target"; then du -s -B1 -- "$target"; fi
          done
      - name: Verify hidden manifest survived artifact transport
        run: test -s dist/.vite/manifest.json
      - name: 로컬 단독 원고의 필터 적용·실행취소와 원본 보존
        if: matrix.suite == 'filters'
        env:
          TOONSPECTRUM_FILTER_DIALOG_LOCAL_ONLY: '1'
          TOONSPECTRUM_FILTER_DIALOG_VERIFY_DIR: /tmp/studio-stability-evidence/filters-local
        run: pnpm run verify:studio-filter-dialog
      - name: 임시 정본 API와 전용 production QA 빌드 준비
        if: matrix.suite == 'filters'
        env:
          TEST_DATABASE_URL: postgresql://studio_filter_test@127.0.0.1:5432/studio_filter_test
          VITE_STUDIO_LIVE_ORIGIN: http://127.0.0.1:5173
          VITE_STUDIO_AUTOMERGE_OFFLINE_BRANCH: "true"
          # 임시 API는 DO 입장권 발급을 비활성화한다. 이 빌드는 실제 Nest 정본 경계만 사용한다.
          VITE_STUDIO_REALTIME_ORIGIN: ''
        run: |
          set -euo pipefail
          pnpm --filter @webtoon-nest/api build
          node scripts/prepare-studio-review-test-db.mjs
          pnpm run prebuild
          pnpm exec vite build --config apps/web/vite.config.ts --outDir "$PWD/.qa/studio-filter-canonical/dist"
          node scripts/generate-third-party-notices.mjs --output "$PWD/.qa/studio-filter-canonical/dist/legal/THIRD_PARTY_NOTICES.generated.md"
          node scripts/verify-static-csp.mjs "$PWD/.qa/studio-filter-canonical/dist/index.html"
          test -s "$PWD/.qa/studio-filter-canonical/dist/.vite/manifest.json"
      - name: 실제 인증 원고의 연결 단절·필터 거절·로컬과 서버 원본 보존
        if: matrix.suite == 'filters'
        env:
          TEST_DATABASE_URL: postgresql://studio_filter_test@127.0.0.1:5432/studio_filter_test
          STUDIO_QA_BASE_URL: http://127.0.0.1:5173
          STUDIO_QA_API_BASE_URL: http://127.0.0.1:4355
          STUDIO_QA_WEB_OUT_DIR: .qa/studio-filter-canonical/dist
          TOONSPECTRUM_FILTER_DIALOG_AUTHENTICATED: '1'
          TOONSPECTRUM_FILTER_DIALOG_EXPECT_DENIAL: '1'
          TOONSPECTRUM_FILTER_DIALOG_VERIFY_DIR: /tmp/studio-stability-evidence/filters-denial
        run: pnpm run verify:studio-filter-dialog
      - name: 실제 인증·정본 ACK에서 모든 필터 적용·픽셀·실행취소 3회 확인
        if: matrix.suite == 'filters'
        env:
          TEST_DATABASE_URL: postgresql://studio_filter_test@127.0.0.1:5432/studio_filter_test
          STUDIO_QA_BASE_URL: http://127.0.0.1:5173
          STUDIO_QA_API_BASE_URL: http://127.0.0.1:4355
          STUDIO_QA_WEB_OUT_DIR: .qa/studio-filter-canonical/dist
          TOONSPECTRUM_FILTER_DIALOG_AUTHENTICATED: '1'
          TOONSPECTRUM_FILTER_DIALOG_VERIFY_DIR: /tmp/studio-stability-evidence/filters-canonical
          TOONSPECTRUM_FILTER_DIALOG_SURVEY: '1'
          TOONSPECTRUM_FILTER_DIALOG_ROUNDS: '3'
        run: pnpm run verify:studio-filter-dialog
      - name: Brush catalogue, long strokes, geometry, touch targets and save recovery
        if: matrix.suite != 'filters' && matrix.suite != 'source'
        env:
          TOONSPECTRUM_BRUSH_VERIFY_STAGE: ${{ matrix.suite }}
          TOONSPECTRUM_BRUSH_STABILITY_ROUNDS: '2'
          TOONSPECTRUM_BRUSH_SURVEY: '1'
          TOONSPECTRUM_ALL_BRUSH_LONG_MATRIX: '1'
        run: pnpm run verify:studio-brushes
      - name: Manuscript source retries, authentication ordering and fail-closed UI
        if: matrix.suite == 'source'
        run: pnpm exec tsx scripts/verify-studio-source-hydration.mts
      - name: Preserve evidence even when a product check fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-stability-${{ matrix.suite }}
          path: /tmp/studio-stability-evidence
          retention-days: 7
          if-no-files-found: warn
