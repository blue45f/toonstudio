name: Studio wearable quality audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/domains/creator/vrm/studio-vrm-head-fit.ts'
      - 'apps/web/src/domains/creator/vrm/studio-vrm-head-measure.ts'
      - 'apps/web/src/domains/creator/vrm/studio-vrm-head-skin-vertices.ts'
      - 'apps/web/src/domains/creator/vrm/studio-vrm-head-surface.ts'
      - 'apps/web/src/domains/creator/vrm/studio-vrm-prop-rig.ts'
      - 'apps/web/src/domains/creator/vrm/studio-vrm-microphone-grip.ts'
      - 'apps/web/src/domains/creator/vrm/studio-vrm-microphone-thumb-contact*'
      - 'apps/web/src/domains/creator/vrm/studio-vrm-prop-anchors.ts'
      - 'apps/web/src/domains/creator/vrm/studio-vrm-props.ts'
      - 'apps/web/src/domains/creator/vrm/StudioVrmGripContactRefine.tsx'
      - 'apps/web/src/domains/creator/vrm/StudioVrmWardrobePropsProjection.tsx'
      - 'apps/web/src/domains/creator/vrm/StudioVrmAvatarForge.tsx'
      - 'apps/web/src/domains/creator/vrm/studio-vrm-avatar-forge.ts'
      - 'apps/web/src/domains/creator/vrm/**/*hair*'
      - 'apps/web/src/domains/creator/vrm/**/*Hair*'
      - 'scripts/verify-studio-hair-stack.mts'
      - 'scripts/studio-hair-stack/**'
      - 'scripts/studio-wearable-motion-*.mjs'
      - 'scripts/studio-wearable-review-preview.mjs'
      - 'scripts/studio-wearable-review-page.mjs'
      - 'scripts/verify-studio-wearable-v5.mts'
      - '.github/workflows/studio-wearable-quality-audit.yml'
  push:
    branches: [fix/studio-wearable-quality-audit-20260906]
    paths: ['.github/workflows/studio-wearable-quality-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wearable-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: ${{ matrix.job }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: review
            mode: catalog
          - job: Wearable motion
            mode: motion
          - job: Hair and headwear fit
            mode: hair
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.mode == 'hair' && 2 || 1 }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate committed GLB bytes and catalogue sources
        if: matrix.mode == 'catalog'
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import validator from 'gltf-validator';
          const assets=JSON.parse(fs.readFileSync('apps/web/public/assets/3d/wearable-v5-manifest.json','utf8')).assets;
          const reports=[];
          for(const asset of assets){
            const bytes=fs.readFileSync('apps/web/public/assets/3d/'+asset.file);
            if(createHash('sha256').update(bytes).digest('hex')!==asset.sha256)throw new Error('Committed asset hash mismatch: '+asset.id);
            const result=await validator.validateBytes(new Uint8Array(bytes),{uri:asset.file,maxIssues:30});
            reports.push({id:asset.id,issues:result.issues,info:result.info});
          }
          fs.mkdirSync('.artifacts',{recursive:true});
          fs.writeFileSync('.artifacts/wearable-glb-validation.json',JSON.stringify(reports,null,2));
          if(reports.some(report=>report.issues.numErrors))throw new Error('GLB validation errors');
          EOF
          pnpm exec vitest run apps/web/src/domains/creator/vrm/studio-vrm-wearable-v5.test.ts apps/web/src/domains/creator/vrm/studio-vrm-props.test.ts apps/web/src/domains/creator/studio-everyday-props-pack-v4.test.ts
      - name: Inspect standalone and worn production renderers
        if: matrix.mode == 'catalog'
        run: pnpm exec tsx scripts/verify-studio-wearable-v5.mts ${{ github.event_name == 'pull_request' && '--headwear-only' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && matrix.mode == 'catalog'
        with:
          name: wearable-v5-review-${{ github.sha }}
          path: |
            .artifacts/studio-wearable-v5/contact-sheet-*.jpg
            .artifacts/studio-wearable-v5/review.json
            .artifacts/wearable-glb-validation.json
          retention-days: 7
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && matrix.mode == 'catalog'
        with:
          name: wearable-v5-closeups-${{ github.sha }}
          path: .artifacts/studio-wearable-v5/screenshots/*.png
          retention-days: 7
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && matrix.mode == 'catalog'
        with:
          name: wearable-v5-runtime-${{ github.sha }}
          path: |
            .artifacts/studio-wearable-v5/runtime/
            .artifacts/studio-wearable-v5/page.mjs
            .artifacts/studio-wearable-v5/index.html
          retention-days: 7
          include-hidden-files: true
      - name: Check microphone contact and authored thumb controls
        if: matrix.mode == 'motion'
        run: pnpm exec vitest run apps/web/src/domains/creator/vrm/studio-vrm-microphone-thumb-contact.test.ts
      - name: Measure worn prop motion on both VRM rigs
        if: matrix.mode == 'motion'
        run: pnpm exec tsx scripts/verify-studio-wearable-v5.mts --motion-only
      - name: Verify ponytail root contact across measured head profiles
        if: matrix.mode == 'hair'
        run: pnpm exec vitest run apps/web/src/domains/creator/vrm/studio-vrm-ponytail-fit.test.ts
      - name: Measure hairstyle and simultaneous headwear fit
        if: matrix.mode == 'hair'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [[ -n "$BASE_SHA" ]]; then
            git cat-file -e "$BASE_SHA^{commit}"
            args+=(--baseline-ref "$BASE_SHA")
          fi
          pnpm exec tsx scripts/verify-studio-hair-stack.mts "${args[@]}"
      - name: Make review previews from bundled fixtures
        if: matrix.mode != 'catalog' && !cancelled()
        env:
          MODE: ${{ matrix.mode }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [[ "$MODE" == "hair" && -n "$BASE_SHA" ]]; then args+=(--baseline); fi
          node scripts/studio-wearable-review-preview.mjs "$MODE" "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && matrix.mode == 'motion'
        with:
          name: wearable-motion-${{ github.sha }}
          path: |
            .artifacts/studio-wearable-v5/review.json
            .artifacts/studio-wearable-v5/contact-sheet-*.jpg
            .artifacts/studio-wearable-v5/screenshots/*.png
            .artifacts/studio-wearable-v5/preview-*.webp
          retention-days: 7
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && matrix.mode == 'hair'
        with:
          name: hair-stack-${{ github.sha }}
          path: |
            .artifacts/studio-hair-stack/review.json
            .artifacts/studio-hair-stack/contact-sheet-*.jpg
            .artifacts/studio-hair-stack/screenshots/*.png
            .artifacts/studio-hair-stack/preview-*.webp
            .artifacts/studio-hair-stack-baseline/review.json
            .artifacts/studio-hair-stack-baseline/contact-sheet-*.jpg
            .artifacts/studio-hair-stack-baseline/screenshots/*.png
          retention-days: 7
          include-hidden-files: true
