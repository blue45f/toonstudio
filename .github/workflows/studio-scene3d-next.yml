name: Studio Scene3D next platform

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "apps/web/src/domains/creator/scene3d/**"
      - "apps/web/src/domains/creator/bg3d/*inplace*"
      - "apps/web/src/domains/creator/bg3d/useStudioBg3dInplaceTools.ts"
      - "apps/web/src/domains/creator/bg3d/useStudioBg3dEditor.ts"
      - "apps/web/src/domains/creator/bg3d/StudioBg3dViewPanel*.tsx"
      - "apps/web/src/domains/creator/bg3d/StudioBg3dEditorSidebarExtras.tsx"
      - "apps/web/src/domains/creator/bg3d/studio-bg3d-pro-suite-runtime-context.tsx"
      - "apps/web/tools/browser-harnesses/studio-scene3d-inplace.tsx"
      - "scripts/verify-studio-scene3d-inplace.mjs"
      - "apps/web/src/domains/creator/bg3d/StudioBg3dProSuitePanelContent.tsx"
      - "apps/web/tools/browser-harnesses/studio-scene3d-specialists.tsx"
      - "apps/web/tools/browser-harnesses/studio-scene3d-recipe-reuse.tsx"
      - "scripts/verify-studio-scene3d-recipe-reuse.mjs"
      - "scripts/verify-studio-scene3d-specialists.mjs"
      - "scripts/lib/scene3d-review-browser-proof.mjs"
      - "scripts/verify-scene3d-specialist-bundle*.mjs"
      - "apps/web/src/domains/creator/bg3d/*capture*"
      - "apps/web/src/domains/creator/bg3d/*readback*"
      - "apps/web/src/domains/creator/bg3d/*lt-*"
      - "apps/web/src/domains/creator/bg3d/*shot-*"
      - "scripts/scene3d-output-ci-policy.test.mjs"
      - ".github/workflows/ci.yml"
      - "apps/web/src/domains/creator/bg3d/StudioBg3dCaptureBridge.tsx"
      - "apps/web/src/domains/creator/bg3d/studio-bg3d-three-webgpu-renderer*"
      - "apps/web/tools/browser-harnesses/studio-scene3d-capture-resources.ts"
      - "scripts/verify-studio-scene3d-capture-resources.mjs"
      - "apps/web/src/domains/creator/StudioSceneToolPopoverBody.tsx"
      - "docs/studio/studio-3d-next-platform-architecture-2026-09-10.md"
      - "docs/studio/studio-3d-platform-evolution-2026-09-19.md"
      - ".github/workflows/studio-scene3d-next.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scene3d-contracts:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Scene3D contract and UX tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/scene3d/studio-scene3d-document.test.ts
          apps/web/src/domains/creator/scene3d/studio-scene3d-document-contract-hardening.test.ts
          apps/web/src/domains/creator/scene3d/studio-scene3d-asset-admission.test.ts
          apps/web/src/domains/creator/scene3d/studio-scene3d-bg3d-projection.test.ts
          apps/web/src/domains/creator/scene3d/studio-scene3d-platform-evolution.test.ts
          apps/web/src/domains/creator/scene3d/studio-scene3d-residency-policy.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-model-cache-residency.test.ts
          apps/web/src/domains/creator/scene3d/studio-scene3d-npr-render-graph.test.ts
          apps/web/src/domains/creator/scene3d/studio-scene3d-professional-plan.test.ts
          apps/web/src/domains/creator/scene3d/studio-scene3d-professional-integration-boundary.test.ts
          apps/web/src/domains/creator/scene3d/studio-scene3d-template-transaction.test.ts
          apps/web/src/domains/creator/scene3d/studio-scene3d-resource-pool.test.ts
          apps/web/src/domains/creator/scene3d/studio-scene3d-resource-owner.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-capture-budget.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-three-webgpu-capture.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-three-webgl-capture.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-three-webgpu-renderer.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-lt-three-depth.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-lt-normal-edges.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-capture-adapter.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-lt-render-worker-client.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-lt-insert-worker-boundary.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-shot-artifact-pipeline.test.ts
          scripts/scene3d-output-ci-policy.test.mjs
          scripts/verify-scene3d-specialist-bundle.test.mjs
      - name: Verify bounded tiled output contracts
        run: pnpm run verify:studio-3d-tiled
      - name: Verify functional specialist runtimes and UI
        run: pnpm run verify:studio-3d-specialists
      - name: Verify selected-object transactions, storage and history
        run: pnpm run verify:studio-3d-inplace
      - name: 웹·API 전체 타입 검사
        run: pnpm run typecheck


  scene3d-specialists-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      SCENE3D_SPECIALISTS_GPU_LANE: swiftshader
      SCENE3D_SPECIALISTS_PRODUCTION_WORKER: "1"
      TOONSPECTRUM_VERIFY_DIR: ${{ github.workspace }}/.qa/scene3d-output-quality/specialist-ci
    steps:
      - name: 체크아웃 전 미사용 SDK 정리와 디스크 여유 확인
        shell: bash
        env:
          TOONSTUDIO_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOONSTUDIO_CI_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux || "${ImageOS:-}" != ubuntu24 || "${TOONSTUDIO_CI_RUNNER_ENVIRONMENT:-}" != github-hosted || "${TOONSTUDIO_CI_RUNNER_OS:-}" != Linux ]] || [[ "$(uname -s)" != Linux ]]; then
            printf 'SDK 정리는 GitHub 호스팅 Ubuntu 24.04에서만 허용합니다.\n' >&2
            exit 1
          fi
          if [[ "${GITHUB_WORKSPACE:-}" != /* ]]; then
            printf '절대 작업공간 경로가 필요합니다.\n' >&2
            exit 1
          fi
          workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          for target in "$GITHUB_WORKSPACE" "$workspace" /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            component=$target
            while [[ "$component" != / ]]; do
              if test -L "$component"; then
                printf '심볼릭 링크 경로는 정리할 수 없습니다: %s\n' "$component" >&2
                exit 1
              fi
              component=${component%/*}
              component=${component:-/}
            done
          done
          for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            if [[ "$workspace" == / || "$workspace" == "$target" || "$workspace" == "$target/"* || "$target" == "$workspace/"* ]]; then
              printf '작업공간과 SDK 경로가 겹칩니다: %s\n' "$target" >&2
              exit 1
            fi
          done
          report_disk() {
            local disk_usage disk_row
            disk_usage=$(df -P -B1 "$workspace")
            printf '%s\n' "$disk_usage"
            df -Pi "$workspace"
            disk_row=${disk_usage#*$'\n'}
            if [[ "$disk_row" == "$disk_usage" ]]; then
              printf '디스크 여유 측정 행이 없습니다.\n' >&2
              exit 1
            fi
            read -r _ _ _ available_bytes _ <<< "$disk_row"
            if [[ ! "$available_bytes" =~ ^[0-9]{1,18}$ ]]; then
              printf '디스크 여유 바이트가 정수가 아닙니다.\n' >&2
              exit 1
            fi
            available_bytes=$((10#$available_bytes))
            for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
              if test -e "$target"; then
                du -s -B1 -- "$target"
              else
                printf 'SDK 경로 없음: %s\n' "$target"
              fi
            done
          }
          printf 'SDK 정리 전 디스크 상태\n'
          report_disk
          sudo rm -rf -- /usr/local/lib/android/sdk /usr/share/dotnet/sdk
          printf 'SDK 정리 후 디스크 상태\n'
          report_disk
          if (( available_bytes < 21474836480 )); then
            printf '전체 체크아웃과 빌드에 필요한 최소 20 GiB 여유가 없습니다: %s 바이트\n' "$available_bytes" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/apps/web/public/**/*.glb
            !/apps/web/public/**/*.vrm
            !/apps/web/public/**/*.mp4
            !/apps/web/public/assets/3d/**/*.jpg
            !/apps/web/public/assets/3d/**/*.png
            !/apps/web/public/assets/3d/**/*.webp
            !/apps/web/public/assets/3d/**/*.hdr
            !/apps/web/public/assets/studio/**/*.jpg
            !/apps/web/public/assets/studio/**/*.png
            !/apps/web/public/assets/studio/**/*.webp
            !/apps/web/public/assets/studio/**/*.hdr
            !/apps/web/public/assets/virtual-studio/**/*.jpg
            !/apps/web/public/assets/virtual-studio/**/*.png
            !/apps/web/public/assets/virtual-studio/**/*.webp
            !/apps/web/public/assets/virtual-studio/**/*.hdr
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build actual production worker and CSP headers
        run: pnpm run build:bundle
      - name: Verify optional engine startup isolation
        run: node scripts/verify-scene3d-specialist-bundle.mjs
      - name: Verify real worker, artifact, IK and splat user paths
        run: pnpm run verify:studio-3d-specialists:browser
      - name: Verify selection to apply, Undo and native storage reopen
        env:
          TOONSPECTRUM_VERIFY_DIR: ${{ github.workspace }}/.qa/scene3d-output-quality/specialist-ci/inplace
        run: pnpm run verify:studio-3d-inplace:browser
      - name: Verify KTX2 release to selection, Undo and native storage reopen
        env:
          TOONSPECTRUM_VERIFY_DIR: ${{ github.workspace }}/.qa/scene3d-output-quality/specialist-ci/inplace-release
          SCENE3D_INPLACE_OPERATION: release
          SCENE3D_INPLACE_REUSE: "1"
        run: pnpm run verify:studio-3d-inplace:browser
      - name: Verify exact recipe reuse without rerunning the processing Worker
        env:
          TOONSPECTRUM_VERIFY_DIR: ${{ github.workspace }}/.qa/scene3d-output-quality/specialist-ci/recipe-reuse
        run: node scripts/verify-studio-scene3d-recipe-reuse.mjs
      - name: Preserve specialist verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scene3d-specialist-browser-evidence
          path: |
            .qa/scene3d-output-quality/specialist-ci/*.json
            .qa/scene3d-output-quality/specialist-ci/*.png
            .qa/scene3d-output-quality/specialist-ci/*.glb
            .qa/scene3d-output-quality/specialist-ci/inplace/*.json
            .qa/scene3d-output-quality/specialist-ci/inplace/*.png
            .qa/scene3d-output-quality/specialist-ci/inplace-release/*.json
            .qa/scene3d-output-quality/specialist-ci/inplace-release/*.png
            .qa/scene3d-output-quality/specialist-ci/recipe-reuse/*.json
            .qa/scene3d-output-quality/specialist-ci/recipe-reuse/*.png
            .qa/scene3d-output-quality/specialist-ci/recipe-reuse/*.glb
          if-no-files-found: warn
          retention-days: 7


  scene3d-tiled-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      SCENE3D_CAPTURE_GPU_LANE: swiftshader
      SCENE3D_TILED_PRODUCTION_WORKER: "1"
      TOONSPECTRUM_VERIFY_DIR: ${{ github.workspace }}/.qa/scene3d-output-quality/tiled-ci
    steps:
      - name: 체크아웃 전 미사용 SDK 정리와 디스크 여유 확인
        shell: bash
        env:
          TOONSTUDIO_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOONSTUDIO_CI_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux || "${ImageOS:-}" != ubuntu24 || "${TOONSTUDIO_CI_RUNNER_ENVIRONMENT:-}" != github-hosted || "${TOONSTUDIO_CI_RUNNER_OS:-}" != Linux ]] || [[ "$(uname -s)" != Linux ]]; then
            printf 'SDK 정리는 GitHub 호스팅 Ubuntu 24.04에서만 허용합니다.\n' >&2
            exit 1
          fi
          if [[ "${GITHUB_WORKSPACE:-}" != /* ]]; then
            printf '절대 작업공간 경로가 필요합니다.\n' >&2
            exit 1
          fi
          workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          for target in "$GITHUB_WORKSPACE" "$workspace" /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            component=$target
            while [[ "$component" != / ]]; do
              if test -L "$component"; then
                printf '심볼릭 링크 경로는 정리할 수 없습니다: %s\n' "$component" >&2
                exit 1
              fi
              component=${component%/*}
              component=${component:-/}
            done
          done
          for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            if [[ "$workspace" == / || "$workspace" == "$target" || "$workspace" == "$target/"* || "$target" == "$workspace/"* ]]; then
              printf '작업공간과 SDK 경로가 겹칩니다: %s\n' "$target" >&2
              exit 1
            fi
          done
          report_disk() {
            local disk_usage disk_row
            disk_usage=$(df -P -B1 "$workspace")
            printf '%s\n' "$disk_usage"
            df -Pi "$workspace"
            disk_row=${disk_usage#*$'\n'}
            if [[ "$disk_row" == "$disk_usage" ]]; then
              printf '디스크 여유 측정 행이 없습니다.\n' >&2
              exit 1
            fi
            read -r _ _ _ available_bytes _ <<< "$disk_row"
            if [[ ! "$available_bytes" =~ ^[0-9]{1,18}$ ]]; then
              printf '디스크 여유 바이트가 정수가 아닙니다.\n' >&2
              exit 1
            fi
            available_bytes=$((10#$available_bytes))
            for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
              if test -e "$target"; then
                du -s -B1 -- "$target"
              else
                printf 'SDK 경로 없음: %s\n' "$target"
              fi
            done
          }
          printf 'SDK 정리 전 디스크 상태\n'
          report_disk
          sudo rm -rf -- /usr/local/lib/android/sdk /usr/share/dotnet/sdk
          printf 'SDK 정리 후 디스크 상태\n'
          report_disk
          if (( available_bytes < 21474836480 )); then
            printf '전체 체크아웃과 빌드에 필요한 최소 20 GiB 여유가 없습니다: %s 바이트\n' "$available_bytes" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build actual production tile Worker and CSP headers
        run: pnpm run build:bundle
      - name: Verify 4K PNG tiles, batch cancellation, archive and completed-shot recovery
        run: pnpm run verify:studio-3d-tiled:browser
      - name: Preserve bounded tile verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scene3d-tiled-output-evidence
          path: |
            .qa/scene3d-output-quality/tiled-ci/*.json
            .qa/scene3d-output-quality/tiled-ci/*.png
            .qa/scene3d-output-quality/tiled-ci/*.zip
          if-no-files-found: warn
