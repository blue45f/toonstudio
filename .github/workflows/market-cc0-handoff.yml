name: Market CC0 handoff
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/domains/creator/studio-marketplace-*'
      - 'apps/web/src/domains/creator/studio-community-*'
      - 'apps/web/src/domains/creator/studio-creator-pack-runtime.ts'
      - 'apps/web/src/domains/creator/StudioCommunityMarketplacePanel.tsx'
      - 'apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx'
      - 'apps/web/src/domains/creator/studio-host-architecture-ratchet.test.ts'
      - 'apps/web/src/domains/market/components/**'
      - 'apps/web/tools/browser-harnesses/market-cc0-*'
      - 'scripts/verify-market-cc0*'
      - 'scripts/seed/market-cc0*'
      - '.github/workflows/market-cc0-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/domains/creator/studio-marketplace-*'
      - 'apps/web/src/domains/creator/studio-community-*'
      - 'apps/web/src/domains/creator/studio-creator-pack-runtime.ts'
      - 'apps/web/src/domains/creator/StudioCommunityMarketplacePanel.tsx'
      - 'apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx'
      - 'apps/web/src/domains/creator/studio-host-architecture-ratchet.test.ts'
      - 'apps/web/src/domains/market/components/**'
      - 'apps/web/tools/browser-harnesses/market-cc0-*'
      - 'scripts/verify-market-cc0*'
      - 'scripts/seed/market-cc0*'
      - '.github/workflows/market-cc0-handoff.yml'
permissions:
  contents: read
concurrency:
  group: market-cc0-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  handoff:
    runs-on: ubuntu-24.04
    # 3MiB 약 70묶음 추산·worker 48~75초 뒤 실제 파일·브라우저 검증까지 110분을 둔다.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify source identities, legacy behavior and real browser persistence
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          TOONSTUDIO_TYPECHECK_MAX_SOURCE_BYTES: '3145728'
        run: |
          set -euo pipefail
          mkdir -p artifacts/market-cc0
          node scripts/verify-market-cc0.mjs 2>&1 | tee artifacts/market-cc0/verification.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: market-cc0-${{ github.run_id }}
          path: artifacts/market-cc0/
          retention-days: 7
