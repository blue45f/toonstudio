name: Legal policy recovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/domains/legal/**'
      - 'apps/api/src/modules/legal/**'
      - 'packages/core/src/legal-policy.ts'
      - 'scripts/verify-legal-policy-runtime.mjs'
      - '.github/workflows/legal-policy-recovery.yml'
  schedule:
    - cron: "31 21 * * 3"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legal-policy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy-display:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec vitest run apps/web/src/domains/legal/policy-page.test.tsx apps/web/src/domains/legal/policy-recovery.test.tsx
