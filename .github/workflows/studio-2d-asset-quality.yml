name: Studio 2D asset quality
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, release/salvage-integration-20260908]
    paths:
      - 'apps/web/src/domains/creator/studio-bg*'
      - 'apps/web/src/domains/creator/studio-2d*'
      - 'apps/web/src/domains/creator/Studio2d*'
      - 'apps/web/src/domains/creator/StudioSceneToolPopoverBody.tsx'
      - 'apps/web/src/domains/creator/studio-page-lazy-ui.ts'
      - 'apps/web/src/domains/creator/studio-tool-belt-lazy-ui-boundary.test.ts'
      - 'apps/web/src/domains/creator/StudioToolBeltContent.tsx'
      - 'apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx'
      - 'apps/web/src/domains/creator/studio-pixel-selection-scene-target*'
      - 'scripts/studio-2d*'
      - 'apps/web/public/assets/studio/backgrounds/**'
      - '.github/workflows/studio-2d-asset-quality.yml'
  push:
    branches: ["main", "release/salvage-integration-20260908"]
    paths:
      - 'apps/web/src/domains/creator/studio-bg*'
      - 'apps/web/src/domains/creator/studio-2d*'
      - 'apps/web/src/domains/creator/Studio2d*'
      - 'apps/web/src/domains/creator/StudioSceneToolPopoverBody.tsx'
      - 'apps/web/src/domains/creator/studio-page-lazy-ui.ts'
      - 'apps/web/src/domains/creator/studio-tool-belt-lazy-ui-boundary.test.ts'
      - 'apps/web/src/domains/creator/StudioToolBeltContent.tsx'
      - 'apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx'
      - 'apps/web/src/domains/creator/studio-pixel-selection-scene-target*'
      - 'scripts/studio-2d*'
      - 'apps/web/public/assets/studio/backgrounds/**'
      - '.github/workflows/studio-2d-asset-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  asset-quality:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Audit native files, compatibility aliases and review metadata
        run: |
          mkdir -p artifacts/studio-2d
          node scripts/studio-2d-asset-audit.mjs | tee artifacts/studio-2d/asset-audit.json
          node --test scripts/studio-2d-asset-quality.test.mjs | tee artifacts/studio-2d/file-tests.txt
      - name: Test filtering, accessible insertion and original aspect ratio
        run: pnpm exec vitest run apps/web/src/domains/creator/studio-2d-lazy-boundary.test.ts apps/web/src/domains/creator/studio-tool-belt-lazy-ui-boundary.test.ts apps/web/src/domains/creator/studio-2d-asset-quality.test.ts apps/web/src/domains/creator/studio-2d-source-size.test.ts apps/web/src/domains/creator/studio-2d-review-content.test.ts apps/web/src/domains/creator/studio-2d-content-discovery.test.ts apps/web/src/domains/creator/Studio2dContentFilters.test.tsx apps/web/src/domains/creator/Studio2dSceneBrowser.test.tsx apps/web/src/domains/creator/Studio2dSceneResilience.test.tsx scripts/studio-2d-image-readiness.test.mjs scripts/studio-2d-asset-quality.test.mjs apps/web/src/domains/creator/studio-assets.test.ts apps/web/src/domains/creator/studio-host-architecture-ratchet.test.ts apps/web/src/domains/creator/studio-pixel-selection-scene-target.test.ts | tee artifacts/studio-2d/component-tests.txt
      - name: Lint changed modules
        run: pnpm exec eslint apps/web/src/domains/creator/studio-2d-*.ts apps/web/src/domains/creator/Studio2d*.tsx apps/web/src/domains/creator/studio-bg-scenes.ts apps/web/src/domains/creator/StudioSceneToolPopoverBody.tsx apps/web/src/domains/creator/studio-page-lazy-ui.ts scripts/studio-2d-*.mjs
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Validate actual component with original images in Chromium
        run: node scripts/studio-2d-browser-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: studio-2d-asset-evidence
          path: artifacts/studio-2d/
          retention-days: 7
          if-no-files-found: error
