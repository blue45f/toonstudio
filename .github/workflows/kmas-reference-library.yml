name: KMAS reference library
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - 'apps/web/src/shared/lib/kmas-reference.ts'
      - 'apps/web/src/shared/lib/__tests__/kmas-reference*.test.ts'
      - 'apps/api/src/server/kmas-reference.ts'
      - 'apps/api/src/modules/catalog/**'
      - 'apps/web/src/domains/catalog/references/**'
      - 'apps/web/src/app/routes/**'
      - 'apps/web/src/domains/legal/SitemapPage.tsx'
      - 'apps/web/src/shared/components/site-footer.tsx'
      - 'e2e/kmas-references.spec.ts'
      - 'playwright.references.config.ts'
      - '.github/workflows/kmas-reference-library.yml'
      - 'scripts/ci-enospc-followup-policy.test.mjs'
  push:
    branches: ["main"]
    paths:
      - 'apps/web/src/shared/lib/kmas-reference.ts'
      - 'apps/web/src/shared/lib/__tests__/kmas-reference*.test.ts'
      - 'apps/api/src/server/kmas-reference.ts'
      - 'apps/api/src/modules/catalog/**'
      - 'apps/web/src/domains/catalog/references/**'
      - 'apps/web/src/app/routes/**'
      - 'apps/web/src/domains/legal/SitemapPage.tsx'
      - 'apps/web/src/shared/components/site-footer.tsx'
      - 'e2e/kmas-references.spec.ts'
      - 'playwright.references.config.ts'
      - '.github/workflows/kmas-reference-library.yml'
      - 'scripts/ci-enospc-followup-policy.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_TRAFFIC_ANALYTICS_ENABLED: 'false'
    steps:
      - name: 체크아웃 전 미사용 SDK 정리와 디스크 여유 확인
        shell: bash
        env:
          TOONSTUDIO_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOONSTUDIO_CI_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux || ( "${ImageOS:-}" != ubuntu24 && "${ImageOS:-}" != ubuntu26 ) || "${TOONSTUDIO_CI_RUNNER_ENVIRONMENT:-}" != github-hosted || "${TOONSTUDIO_CI_RUNNER_OS:-}" != Linux ]] || [[ "$(uname -s)" != Linux ]]; then
            printf 'SDK 정리는 GitHub 호스팅 Ubuntu 24.04 또는 26.04에서만 허용합니다.\n' >&2
            exit 1
          fi
          if [[ "${GITHUB_WORKSPACE:-}" != /* ]]; then
            printf '절대 작업공간 경로가 필요합니다.\n' >&2
            exit 1
          fi
          workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          for target in "$GITHUB_WORKSPACE" "$workspace" /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            component=$target
            while [[ "$component" != / ]]; do
              if test -L "$component"; then
                printf '심볼릭 링크 경로는 정리할 수 없습니다: %s\n' "$component" >&2
                exit 1
              fi
              component=${component%/*}
              component=${component:-/}
            done
          done
          for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            if [[ "$workspace" == / || "$workspace" == "$target" || "$workspace" == "$target/"* || "$target" == "$workspace/"* ]]; then
              printf '작업공간과 SDK 경로가 겹칩니다: %s\n' "$target" >&2
              exit 1
            fi
          done
          report_disk() {
            local disk_usage disk_row
            disk_usage=$(df -P -B1 "$workspace")
            printf '%s\n' "$disk_usage"
            df -Pi "$workspace"
            disk_row=${disk_usage#*$'\n'}
            if [[ "$disk_row" == "$disk_usage" ]]; then
              printf '디스크 여유 측정 행이 없습니다.\n' >&2
              exit 1
            fi
            read -r _ _ _ available_bytes _ <<< "$disk_row"
            if [[ ! "$available_bytes" =~ ^[0-9]{1,18}$ ]]; then
              printf '디스크 여유 바이트가 정수가 아닙니다.\n' >&2
              exit 1
            fi
            available_bytes=$((10#$available_bytes))
            for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
              if test -e "$target"; then
                du -s -B1 -- "$target"
              else
                printf 'SDK 경로 없음: %s\n' "$target"
              fi
            done
          }
          printf 'SDK 정리 전 디스크 상태\n'
          report_disk
          sudo rm -rf -- /usr/local/lib/android/sdk /usr/share/dotnet/sdk
          printf 'SDK 정리 후 디스크 상태\n'
          report_disk
          if (( available_bytes < 21474836480 )); then
            printf '전체 체크아웃과 빌드에 필요한 최소 20 GiB 여유가 없습니다: %s 바이트\n' "$available_bytes" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: 체크아웃 공간과 기존 검사 범위 계약 확인
        run: node --test scripts/ci-enospc-followup-policy.test.mjs
      - name: Reference contract tests
        run: pnpm exec vitest run tests/integration/web-api/shared/lib/__tests__/kmas-reference.test.ts tests/integration/web-api/shared/lib/__tests__/kmas-reference-hardening.test.ts apps/web/src/shared/lib/__tests__/kmas-reference-recovery.test.ts apps/web/src/shared/lib/__tests__/kmas-reference-merge-readiness.test.ts
      - name: Zero-warning reference lint
        run: pnpm exec eslint apps/web/src/shared/lib/kmas-reference.ts tests/integration/web-api/shared/lib/__tests__/kmas-reference.test.ts tests/integration/web-api/shared/lib/__tests__/kmas-reference-hardening.test.ts apps/web/src/shared/lib/__tests__/kmas-reference-recovery.test.ts apps/web/src/shared/lib/__tests__/kmas-reference-merge-readiness.test.ts apps/api/src/server/kmas-reference.ts apps/api/src/modules/catalog/kmas-reference.controller.ts apps/api/src/modules/catalog/catalog.module.ts apps/web/src/domains/catalog/references apps/web/src/app/routes/reference-labels.ts apps/web/src/app/routes/groups/reference.routes.tsx apps/web/src/app/routes/groups/app-routes.tsx apps/web/src/app/routes/route-titles.ts apps/web/src/shared/components/site-footer.tsx apps/web/src/app/routes/route-manifest.ts apps/web/src/domains/legal/SitemapPage.tsx e2e/kmas-references.spec.ts --max-warnings=0
      - run: pnpm run catalog:gen && pnpm run build:bundle
      - run: pnpm exec playwright install --with-deps chromium
      - name: Chromium route and interaction verification
        run: pnpm exec playwright test --config playwright.references.config.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kmas-reference-browser-evidence
          path: test-results/references
          if-no-files-found: ignore
          retention-days: 7
