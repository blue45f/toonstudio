name: Studio interaction integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/domains/creator/studio-dialog-focus-return*.ts'
      - '.github/workflows/studio-interaction-integrity.yml'
  schedule:
    - cron: "31 16 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-interaction-integrity-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  focus-return:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check focus-return source and regression tests
        run: pnpm exec eslint --max-warnings=0 apps/web/src/domains/creator/studio-dialog-focus-return.ts apps/web/src/domains/creator/studio-dialog-focus-return-integrity.test.ts apps/web/src/domains/creator/studio-dialog-focus-return-nested.test.ts
      - name: Run existing and extended focus-return contracts
        run: pnpm exec vitest run apps/web/src/domains/creator/studio-dialog-focus-return.test.ts apps/web/src/domains/creator/studio-dialog-focus-return-integrity.test.ts apps/web/src/domains/creator/studio-dialog-focus-return-nested.test.ts
