name: Studio exhaustive regressions

# 전체 exhaustive의 PR/merge fanout은 만들지 않고, 수정한 진입점과 독립 GPU 계약만 확인한다.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - .github/workflows/studio-exhaustive-regressions.yml
      - scripts/run-studio-exhaustive-regressions.mjs
      - scripts/run-studio-exhaustive-regressions.test.mjs
      - scripts/run-studio-exhaustive-followup.mjs
      - scripts/run-studio-exhaustive-followup.test.mjs
      - playwright.studio-qa-helpers.config.ts
      - e2e/studio-qa-interactions.spec.mts
      - e2e/studio-qa-shell-interactions.spec.mts
      - scripts/lib/studio-shell-interactions.ts
      - scripts/lib/studio-primary-color-interactions.ts
      - scripts/lib/studio-brush-catalog-interactions.ts
      - scripts/lib/studio-tool-interactions.ts
      - scripts/lib/studio-bg3d-ui-interactions.ts
      - scripts/lib/studio-offline-preview-fixture.*
      - scripts/lib/studio-engine-presentation-browser-diagnostics.ts
      - scripts/lib/repo-paths.mjs
      - scripts/qa/verify-studio-cross-browser-matrix.mjs
      - scripts/verify-studio-launch.mts
      - scripts/verify-studio-lifecycle.mts
      - scripts/verify-studio-companion.mts
      - scripts/verify-studio-inspector-walkthrough.mts
      - scripts/verify-studio-icons.mts
      - scripts/verify-studio-inapp-feature-sweep.mts
      - scripts/verify-studio-mobile-top.mts
      - scripts/verify-studio-canvas-chrome.mts
      - scripts/verify-studio-inapp-browser.mts
      - scripts/verify-studio-service-worker.mts
      - scripts/verify-studio-native-raster-tools.mts
      - scripts/verify-studio-canvas-surfaces.mts
      - scripts/verify-studio-ai-image-references.mts
      - scripts/verify-studio-brush-latency.mts
      - scripts/verify-studio-brush-media.mts
      - scripts/verify-studio-long-stroke.mts
      - scripts/verify-studio-gpu-committed-parity.mts
      - scripts/studio-gpu-committed-parity-browser.ts
      - scripts/verify-studio-engine-webgpu-filter-parity.mjs
      - scripts/studio-engine-webgpu-filter-parity-browser.ts
      - scripts/verify-studio-canvaskit-quality-worker.mjs
      - scripts/studio-canvaskit-quality-worker-browser.ts
      - scripts/verify-studio-dynamic-dual-tip-webgpu.mjs
      - scripts/studio-dynamic-dual-tip-webgpu-browser.ts
      - scripts/verify-studio-dynamic-dual-tip-webgpu-v2.mjs
      - scripts/studio-dynamic-dual-tip-webgpu-v2-browser.ts
      - scripts/verify-studio-engine-webgpu-textured-brush.mjs
      - scripts/studio-engine-webgpu-textured-brush-browser.ts
      - scripts/verify-studio-engine-webgpu-tile-provider.mjs
      - scripts/studio-engine-webgpu-tile-provider-browser.ts
      - scripts/verify-studio-engine-tile-storage-opfs-v2.mjs
      - scripts/studio-engine-tile-storage-opfs-v2-browser.ts
      - scripts/verify-studio-engine-webgpu-presentation.mjs
      - scripts/studio-engine-webgpu-presentation-browser.ts
      - scripts/verify-studio-living-ink-execution.mjs
      - scripts/studio-living-ink-execution-browser.ts
      - apps/web/src/domains/creator/studio-living-ink-*
      - apps/web/src/domains/creator/studio-living-ink.worker.ts
      - apps/web/src/domains/creator/scene3d/studio-living-ink-wgsl-shaders.test.ts
      - apps/web/src/domains/creator/render/studio-engine-webgpu-presentation-*
      - apps/web/src/domains/creator/render/studio-engine-webgpu-textured-brush-runtime.ts
      - apps/web/src/domains/creator/render/studio-engine-webgpu-textured-brush-plan.ts
      - apps/web/vite.config.ts
  workflow_dispatch:
    inputs:
      suite:
        description: 기본 회귀 또는 기존 production 산출물의 제한 후속 검사
        type: choice
        default: regressions
        options:
          - regressions
          - followup
          - native-representatives
      source_mode:
        description: 기존 산출물 재사용(20분) 또는 현재 SHA production 빌드(40분)
        type: choice
        default: artifact
        options:
          - artifact
          - fresh-source
      producer_run_id:
        description: 후속 검사에 사용할 main brush stability 성공 실행 ID
        type: string
        required: false
      artifact_id:
        description: 해당 실행의 studio-stability-dist 산출물 ID
        type: string
        required: false
      source_sha:
        description: 정확한 40자리 빌드 SHA(fresh-source는 선택한 브랜치 HEAD)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Studio helper and GPU regressions
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'regressions' || inputs.suite == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Reserve the final minute for failure evidence
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");
          const { join } = require("node:path");
          appendFileSync(process.env.GITHUB_ENV,
            `STUDIO_QA_DEADLINE_MS=${Date.now() + 14 * 60_000}\n`
            + `TOONSPECTRUM_FOCUSED_VERIFY_DIR=${join(process.env.RUNNER_TEMP, "studio-exhaustive-regressions")}\n`);
          NODE
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/apps/web/public/assets/
            !/apps/web/public/vrm/
            !/artifacts/
            !/docs/
            !/tests/benchmarks/results/
      - name: Initialize every expected result before setup
        run: node scripts/run-studio-exhaustive-regressions.mjs --init
      - name: Verify runner, gate count and cost contracts without dependencies
        run: |
          node --test scripts/run-studio-exhaustive-regressions.test.mjs
          node scripts/run-studio-exhaustive-regressions.mjs --check
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install only Chromium and its Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run every original targeted gate and retain all exit statuses
        run: node scripts/run-studio-exhaustive-regressions.mjs --run
      - name: Publish structured results and failure diagnostics
        if: always()
        run: node scripts/run-studio-exhaustive-regressions.mjs --publish

  followup:
    name: 선택한 production Studio 후속 검사
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'followup' || inputs.suite == 'native-representatives')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.source_mode == 'fresh-source' && 40 || 20 }}
    permissions:
      contents: read
      actions: read
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      STUDIO_FOLLOWUP_SUITE: ${{ inputs.suite }}
      STUDIO_FOLLOWUP_SOURCE_MODE: ${{ inputs.source_mode || 'artifact' }}
      STUDIO_FOLLOWUP_RUN_ID: ${{ inputs.producer_run_id }}
      STUDIO_FOLLOWUP_ARTIFACT_ID: ${{ inputs.artifact_id }}
      STUDIO_FOLLOWUP_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: 출처별 전체 작업 제한과 마지막 결과 출력 1분 확보
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { join } = require('node:path');
          const minutes = process.env.STUDIO_FOLLOWUP_SOURCE_MODE === 'fresh-source' ? 39 : 19;
          appendFileSync(process.env.GITHUB_ENV,
            `STUDIO_QA_DEADLINE_MS=${Date.now() + minutes * 60_000}\n`
            + `TOONSPECTRUM_FOLLOWUP_VERIFY_DIR=${join(process.env.RUNNER_TEMP, 'studio-exhaustive-followup')}\n`);
          NODE
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/apps/web/public/assets/
            !/apps/web/public/vrm/
            !/artifacts/
            !/docs/
            !/tests/benchmarks/results/
      - name: 모든 선택 검사 상태를 미실행으로 기록
        run: node scripts/run-studio-exhaustive-followup.mjs --init
      - name: 의존성 없는 실행·비용·산출물 계약 확인
        run: |
          node --test scripts/run-studio-exhaustive-regressions.test.mjs scripts/run-studio-exhaustive-followup.test.mjs
          node scripts/run-studio-exhaustive-followup.mjs --check
      - name: 빌드 출처와 정확한 제품 소스 확인
        id: provenance
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/run-studio-exhaustive-followup.mjs --provenance
      - name: 기존 production dist 한 개만 복원
        if: inputs.source_mode != 'fresh-source'
        uses: actions/download-artifact@v8
        timeout-minutes: ${{ fromJSON(steps.provenance.outputs.download_minutes || '6') }}
        with:
          run-id: ${{ inputs.producer_run_id }}
          artifact-ids: ${{ inputs.artifact_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: dist
      - name: 실제 dist SHA·manifest·SW buildId 확인
        if: inputs.source_mode != 'fresh-source'
        run: node scripts/run-studio-exhaustive-followup.mjs --dist
      - name: fresh 빌드의 미사용 SDK 정리와 최소 20 GiB 확인
        if: inputs.source_mode == 'fresh-source'
        env:
          TOONSTUDIO_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOONSTUDIO_CI_RUNNER_OS: ${{ runner.os }}
        run: node scripts/run-studio-exhaustive-followup.mjs --prepare-disk
      - name: production 빌드에 필요한 전체 assets·vrm 복원
        if: inputs.source_mode == 'fresh-source'
        run: node scripts/run-studio-exhaustive-followup.mjs --hydrate
      - uses: pnpm/action-setup@v6
        timeout-minutes: 1
      - uses: actions/setup-node@v7
        timeout-minutes: 1
        with:
          node-version: 24
      - name: 전체 작업 제한 안에서 의존성 준비
        run: node scripts/run-studio-exhaustive-followup.mjs --install
      - name: 정확한 현재 SHA로 원래 production 빌드 한 번 실행
        if: inputs.source_mode == 'fresh-source'
        run: node scripts/run-studio-exhaustive-followup.mjs --build
      - name: 새 빌드 SHA·manifest·SW와 추적 파일 동일성 확인
        if: inputs.source_mode == 'fresh-source'
        run: node scripts/run-studio-exhaustive-followup.mjs --dist
      - name: 선택 검사에 필요한 브라우저만 준비
        run: node scripts/run-studio-exhaustive-followup.mjs --browsers
      - name: 원래 판정 기준으로 선택한 시나리오 실행
        run: node scripts/run-studio-exhaustive-followup.mjs --run
      - name: 실패·미실행과 원본 JSON을 제한된 로그에 보존
        if: always()
        run: |
          if test -f scripts/run-studio-exhaustive-followup.mjs; then
            node scripts/run-studio-exhaustive-followup.mjs --publish
          else
            node -e 'console.error("checkout 실패: 선택한 모든 후속 검사는 미실행입니다."); process.exitCode = 1'
          fi
