name: OpenSSF Scorecard & Solo Commercial Readiness

on:
  schedule:
    # 주 1회 일요일 20:23 UTC(월요일 05:23 KST) 오프피크 실행 — main push 트리거 홍수를 늘리지 않는다.
    - cron: "23 20 * * 0"
  workflow_dispatch:

# 최상위 권한은 비워 두고 잡별 최소 권한만 부여한다 (permissions: read-all 금지).
permissions: {}

concurrency:
  group: openssf-scorecard-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: OpenSSF Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssf-scorecard-sarif
          path: results.sarif
          retention-days: 5
          if-no-files-found: error

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: results.sarif

  solo-commercial-readiness:
    name: Solo commercial license & security readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run solo commercial readiness guard
        run: node scripts/verify-solo-commercial-readiness.mjs --out solo-commercial-readiness.json

      - name: Run solo commercial readiness contract tests
        run: node --test scripts/verify-solo-commercial-readiness.test.mjs

      - name: Upload solo commercial readiness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solo-commercial-readiness-report
          path: solo-commercial-readiness.json
          retention-days: 5
          if-no-files-found: warn
