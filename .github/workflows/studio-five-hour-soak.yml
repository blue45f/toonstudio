name: Studio 5h stability soak

# A five-hour browser session is a drift/soak proof, not a useful per-commit merge gate.
# Fast PR browser contracts cover the same interaction surfaces; this workflow keeps the
# expensive full-duration evidence on the overnight schedule and explicit manual runs.
on:
  schedule:
    # 02:30 Asia/Seoul — five-hour run finishes before the Korean workday for overnight evidence.
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "환경별 실제 실행 시간 (장시간 검증: 300분, 진단: 최대 3분)"
        required: false
        default: "300"
      sample_heap_per_stroke:
        description: "Diagnostic runs only: sample the GC heap after every stroke (1) or not (0)"
        required: false
        default: "0"
      profile:
        description: "실행 환경 — all은 기존 다섯 환경을 모두 검사"
        type: choice
        options: [all, desktop, desktop-webgpu, kakaotalk-android, instagram-ios, naver-android]
        default: all
      workload:
        description: "원고 유지 방식 — accumulate는 획과 history를 계속 누적"
        type: choice
        options: [bounded-churn, accumulate]
        default: bounded-churn
      input:
        description: "브라우저 자동화 입력 — 실제 펜 장치 인증과 구분"
        type: choice
        options: [auto, mouse, pen, touch]
        default: auto
      brush_cycles:
        description: "브러시를 바꾸기 전 그리는 획 수 (1~100)"
        type: number
        default: 5
      stop_on_failure:
        description: "첫 실패의 증거를 보존하고 장시간 실행을 중단"
        type: boolean
        default: true
      measure_pointer_latency:
        description: "같은 원고의 입력→다음 프레임 p95·p99를 시간대별 측정"
        type: boolean
        default: false
      latency_baseline:
        description: "desktop 전용: 소크 전에 대표 17종의 새 원고 mouse 지연 검사"
        type: boolean
        default: false
      diagnostic:
        description: "최대 3분 CPU·GPU 원인 조사 전용 — 수락 검사 통과로 사용 불가"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: studio-five-hour-soak-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CI: "1"
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  production-build:
    name: production Studio bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      minutes: ${{ steps.plan.outputs.minutes }}
      workload: ${{ steps.plan.outputs.workload }}
      input: ${{ steps.plan.outputs.input }}
      brush_cycles: ${{ steps.plan.outputs.brush_cycles }}
      sample_heap_per_stroke: ${{ steps.plan.outputs.sample_heap_per_stroke }}
      stop_on_failure: ${{ steps.plan.outputs.stop_on_failure }}
      measure_pointer_latency: ${{ steps.plan.outputs.measure_pointer_latency }}
      latency_profile: ${{ steps.plan.outputs.latency_profile }}
      diagnostic: ${{ steps.plan.outputs.diagnostic }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate requested soak plan
        id: plan
        env:
          SOAK_MINUTES: ${{ github.event.inputs.minutes }}
          SOAK_PROFILE: ${{ github.event.inputs.profile }}
          SOAK_WORKLOAD: ${{ github.event.inputs.workload }}
          SOAK_INPUT: ${{ github.event.inputs.input }}
          SOAK_BRUSH_CYCLES: ${{ github.event.inputs.brush_cycles }}
          SOAK_SAMPLE_HEAP_PER_STROKE: ${{ github.event.inputs.sample_heap_per_stroke }}
          SOAK_STOP_ON_FAILURE: ${{ github.event.inputs.stop_on_failure }}
          SOAK_MEASURE_POINTER_LATENCY: ${{ github.event.inputs.measure_pointer_latency }}
          SOAK_LATENCY_BASELINE: ${{ github.event.inputs.latency_baseline }}
          SOAK_DIAGNOSTIC: ${{ github.event.inputs.diagnostic }}
        run: node scripts/studio-soak-workflow-plan.mjs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:bundle
      - name: Require production manifest
        run: test -s dist/.vite/manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: studio-five-hour-dist-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  overnight-full-soak:
    name: ${{ needs.production-build.outputs.diagnostic == '1' && 'diagnostic' || 'soak' }} · ${{ matrix.id }}
    needs: production-build
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.production-build.outputs.diagnostic == '1' && 25 || 345 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.production-build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        id: restore_dist
        with:
          name: studio-five-hour-dist-${{ github.sha }}
          path: dist
      - name: Measure fresh-document representative latency
        if: needs.production-build.outputs.latency_profile == matrix.id
        env:
          TOONSPECTRUM_BRUSH_LATENCY_VERIFY_DIR: artifacts/studio-five-hour-soak/${{ matrix.id }}/latency-baseline
        run: pnpm exec tsx scripts/verify-studio-brush-latency.mts
      - name: Validate chosen workload before the long session
        id: preflight
        if: github.event_name == 'workflow_dispatch' && needs.production-build.outputs.minutes == '300'
        env:
          TOONSPECTRUM_SOAK_MINUTES: '3'
          TOONSPECTRUM_SOAK_PROFILE: ${{ matrix.profile }}
          TOONSPECTRUM_SOAK_WEBGPU: ${{ matrix.webgpu }}
          TOONSPECTRUM_SOAK_SAMPLE_HEAP_PER_STROKE: ${{ needs.production-build.outputs.sample_heap_per_stroke }}
          TOONSPECTRUM_SOAK_WORKLOAD: ${{ needs.production-build.outputs.workload }}
          TOONSPECTRUM_SOAK_INPUT: ${{ needs.production-build.outputs.input }}
          TOONSPECTRUM_SOAK_BRUSH_CYCLES: ${{ needs.production-build.outputs.brush_cycles }}
          TOONSPECTRUM_SOAK_STOP_ON_FAILURE: '1'
          TOONSPECTRUM_SOAK_MEASURE_POINTER_LATENCY: ${{ needs.production-build.outputs.measure_pointer_latency }}
          TOONSPECTRUM_SOAK_OUT: artifacts/studio-five-hour-soak/${{ matrix.id }}/preflight
        run: pnpm exec tsx scripts/verify-studio-five-hour-soak.mts
      - name: Analyze chosen-workload preflight
        if: ${{ !cancelled() && (steps.preflight.outcome == 'success' || steps.preflight.outcome == 'failure') }}
        env:
          TOONSPECTRUM_SOAK_OUT: artifacts/studio-five-hour-soak/${{ matrix.id }}/preflight
        run: pnpm exec tsx scripts/analyze-studio-five-hour-visual.mts
      - name: Long-session Studio soak
        env:
          DEBUG: ${{ needs.production-build.outputs.diagnostic == '1' && 'pw:browser' || '' }}
          TOONSTUDIO_SOAK_DIAGNOSTIC_CPU: ${{ needs.production-build.outputs.diagnostic }}
          TOONSPECTRUM_SOAK_MINUTES: ${{ needs.production-build.outputs.minutes }}
          TOONSPECTRUM_SOAK_PROFILE: ${{ matrix.profile }}
          TOONSPECTRUM_SOAK_WEBGPU: ${{ matrix.webgpu }}
          TOONSPECTRUM_SOAK_SAMPLE_HEAP_PER_STROKE: ${{ needs.production-build.outputs.sample_heap_per_stroke }}
          TOONSPECTRUM_SOAK_WORKLOAD: ${{ needs.production-build.outputs.workload }}
          TOONSPECTRUM_SOAK_INPUT: ${{ needs.production-build.outputs.input }}
          TOONSPECTRUM_SOAK_BRUSH_CYCLES: ${{ needs.production-build.outputs.brush_cycles }}
          TOONSPECTRUM_SOAK_STOP_ON_FAILURE: ${{ needs.production-build.outputs.stop_on_failure }}
          TOONSPECTRUM_SOAK_MEASURE_POINTER_LATENCY: ${{ needs.production-build.outputs.measure_pointer_latency }}
          TOONSPECTRUM_SOAK_OUT: artifacts/studio-five-hour-soak/${{ matrix.id }}
        run: pnpm exec tsx scripts/verify-studio-five-hour-soak.mts
      - name: Compare GPU backend configurations (diagnostic only)
        id: gpu_diagnostic
        if: ${{ !cancelled() && needs.production-build.outputs.diagnostic == '1' && matrix.id == 'desktop-webgpu' && steps.restore_dist.outcome == 'success' }}
        env:
          DEBUG: pw:browser
          TOONSTUDIO_SOAK_GPU_DIAGNOSTIC_OUT: artifacts/studio-five-hour-soak/${{ matrix.id }}/gpu-diagnostic
        run: pnpm exec tsx scripts/diagnose-studio-soak-webgpu.mts
      - name: Analyze every 10-minute visual checkpoint
        if: always()
        env:
          TOONSPECTRUM_SOAK_OUT: artifacts/studio-five-hour-soak/${{ matrix.id }}
        run: pnpm exec tsx scripts/analyze-studio-five-hour-visual.mts
      - name: Preserve bounded diagnostic bundle sources
        if: ${{ !cancelled() && needs.production-build.outputs.diagnostic == '1' && steps.restore_dist.outcome == 'success' }}
        env:
          TOONSPECTRUM_SOAK_OUT: artifacts/studio-five-hour-soak/${{ matrix.id }}
        run: node scripts/collect-studio-soak-diagnostic-assets.mjs
      - name: Preserve 10-minute checkpoints, screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-five-hour-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/studio-five-hour-soak/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 7
