name: Studio editor client runtime

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/studio-editor-client-runtime.yml"
      - "packages/studio-command-registry/src/**"
      - "apps/web/src/domains/creator/editor-client/**"
      - "apps/web/src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorWorkspace.tsx"
      - "apps/web/src/domains/creator/studio-left-tool-rail-boundary.test.ts"
  workflow_dispatch:
  schedule:
    - cron: "7 16 * * 0"

permissions:
  contents: read

concurrency:
  group: studio-editor-client-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: editor-client-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused unit and architecture tests
        run: >-
          pnpm exec vitest run
          packages/studio-command-registry/src/__tests__/editor-client-runtime.test.ts
          apps/web/src/domains/creator/editor-client/studio-left-tool-rail-client.test.ts
          apps/web/src/domains/creator/studio-left-tool-rail-boundary.test.ts
      - name: Strict focused lint
        run: >-
          pnpm exec eslint --max-warnings=0
          packages/studio-command-registry/src/editor-client-runtime.ts
          packages/studio-command-registry/src/__tests__/editor-client-runtime.test.ts
          packages/studio-command-registry/src/index.ts
          apps/web/src/domains/creator/editor-client/index.ts
          apps/web/src/domains/creator/editor-client/studio-left-tool-rail-client.ts
          apps/web/src/domains/creator/editor-client/studio-left-tool-rail-client.test.ts
          apps/web/src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorWorkspace.tsx
          apps/web/src/domains/creator/studio-left-tool-rail-boundary.test.ts
      - name: Command registry package typecheck
        run: pnpm exec tsc -p packages/studio-command-registry/tsconfig.json
      - name: Compute typecheck-shards cache key
        id: typecheck-shards-key
        shell: bash
        run: |
          set -euo pipefail
          printf 'key=core-typecheck-shards-v1-%s-%s-%s\n' \
            "${RUNNER_OS}" "${RUNNER_ARCH}" \
            "$(node scripts/typecheck-shards.mjs --print-cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore typecheck-shards checkpoint cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.cache/typecheck-shards/report.json
          key: ${{ steps.typecheck-shards-key.outputs.key }}
      - name: Studio app typecheck
        run: pnpm run typecheck:web
