name: API container release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact main commit SHA to package
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: api-container-release-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      IMAGE_NAME: ghcr.io/blue45f/toonspectrum-core-api
      RELEASE_SHA: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Require green core and verify checks on release SHA
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100")"
          for gate in core verify; do
            conclusion="$(jq -r --arg gate "$gate" '
              [ .check_runs[]
                | select(.name == $gate and .app.slug == "github-actions" and .status == "completed")
              ] | sort_by(.id) | last | .conclusion // "missing"
            ' <<< "$response")"
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::Required check '$gate' is not green on $RELEASE_SHA (conclusion=$conclusion)."
              exit 1
            fi
          done

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse duplicate immutable image release
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_SHA}" >/dev/null 2>&1; then
            echo "::error::Immutable image ${IMAGE_NAME}:${RELEASE_SHA} already exists on GHCR; duplicate release is forbidden."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install and build verified API runtime
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @webtoon-nest/api build
          test -s apps/api/dist/apps/api/src/main.js
          node --check apps/api/dist/apps/api/src/main.js

      - name: Assemble production-only image context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          pnpm --filter @webtoon-nest/api deploy --legacy --prod .release/api-package
          mkdir -p .release/image/apps/api
          cp .release/api-package/package.json .release/image/apps/api/package.json
          # 같은 파일시스템에서 옮겨 배포 의존성의 중복 저장을 막는다.
          mv .release/api-package/node_modules .release/image/apps/api/node_modules
          cp -a apps/api/dist .release/image/apps/api/dist
          cp -a apps/api/data .release/image/apps/api/data
          mkdir -p .release/image/deploy/trust
          cp deploy/trust/supabase-prod-ca-2021.crt .release/image/deploy/trust/supabase-prod-ca-2021.crt
          cat > .release/image/Dockerfile <<'DOCKERFILE'
          FROM node:24.16.0-bookworm-slim
          ENV NODE_ENV=production
          ENV NODE_EXTRA_CA_CERTS=/app/deploy/trust/supabase-prod-ca-2021.crt
          WORKDIR /app
          COPY --chown=node:node . /app
          USER node
          EXPOSE 3000
          CMD ["node", "apps/api/dist/apps/api/src/main.js"]
          DOCKERFILE
          printf '%s\n' "$RELEASE_SHA" > .release/image/RELEASE_SHA
          test -s .release/image/apps/api/dist/apps/api/src/main.js

      - name: Build and publish immutable API image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .release/image
          file: .release/image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/blue45f/toonstudio
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.title=ToonStudio Core API
          cache-from: type=gha,scope=toonspectrum-core-api
          cache-to: type=gha,mode=max,scope=toonspectrum-core-api

      - name: Record immutable image identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/api-container-release
          {
            echo "sha=$RELEASE_SHA"
            echo "image=${IMAGE_NAME}:${RELEASE_SHA}"
            echo "digest=${{ steps.image.outputs.digest }}"
            echo "production_deployed=false"
          } | tee artifacts/api-container-release/image.txt

      - name: Verify anonymous image pull metadata
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_SHA}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-container-release-${{ env.RELEASE_SHA }}
          path: artifacts/api-container-release/image.txt
          if-no-files-found: error
          retention-days: 7
