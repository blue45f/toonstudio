            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/3d/environments/refined-v6/passes/**/*.png' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/3d/environments/glasshouse-v1/botanical_glasshouse.glb' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/3d/environments/glasshouse-v1/botanical_glasshouse.png' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/3d/environments/coast-v1/coastal_signal_station.glb' || '' }}
