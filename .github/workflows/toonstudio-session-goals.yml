name: ToonStudio session goals

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/src/app/routes/groups/**"
      - "apps/web/src/domains/creator/**"
      - "apps/web/public/assets/virtual-studio/cinematic-v9/**"
      - "apps/web/src/shared/components/**"
      - "apps/web/src/shared/lib/site-route-visual.ts"
      - "scripts/verify-toonstudio-session-goals.mjs"
      - ".github/workflows/toonstudio-session-goals.yml"
      - "eslint.config.mjs"
      - "vitest.config.*"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: toonstudio-session-goals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-validation:
    name: focused validation
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      # Related tests validate tracked documentation evidence; retain docs.
      # 환경 팩·VRM 카탈로그·썸네일 무결성 시험도 related 로 걸리므로 그 시험이 디스크에서 읽는 자산(3D 환경 GLB, 캐릭터 썸네일, 해당 VRM 폴더)을 함께 받는다. 전체 VRM 폴더 같은 무관한 자산 트리는 받지 않는다.
      # 일러스트 팩 무결성 시험(studio-illustration-pack)은 원본 PNG·SOURCE.json·PROMPTS.json 을 디스크에서 읽는다(약 33 MB).
      # Creator Bundle 시험은 공개 JSON·권리 원장을 읽고, PR Nature 시험은 정본 hash가 결박된 JSON 원본도 읽는다.
      # PR의 세 파생 팩은 인증이 유효한 최초 체크아웃에 포함하고 수동 검사는 manifest만 유지한다.
      - name: Checkout focused ToonStudio source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/apps/web/public/assets/
            /apps/web/public/assets/3d/outfits/
            /apps/web/public/assets/3d/environments/refined-v6/manifest.json
            /apps/web/public/assets/3d/environments/refined-v6/render-passes-report.json
            /apps/web/public/assets/3d/environments/expansion-v1/manifest.json
            /apps/web/public/assets/3d/environments/webtoon-v7/manifest.json
            /apps/web/public/assets/3d/environments/authored-v1/manifest.json
            /apps/web/public/assets/3d/environments/refined-v6/hospital_reception.glb
            /apps/web/public/assets/3d/environments/expansion-v1/library_reading_room.glb
            /apps/web/public/assets/3d/environments/expansion-v1/thumbnails/library_reading_room.png
            /apps/web/public/assets/3d/environments/mcp-free-v1/
            /apps/web/public/assets/3d/environments/bundle-v1/theme-packs.json
            /apps/web/public/assets/3d/environments/bundle-v1/deploy-index.b90b58fd4c87e9fddb2e39a7f1cbeb75ce93f0bc19f4f1cc053ac696e55e377c.json
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/3d/environments/bundle-v1/theme-packs.e855c272c15db1f75a7a398c93f01c9ce6ff27342f2b10b2707e4daf9abe3ce4.json' || '' }}
            /apps/web/public/assets/virtual-studio/bundle-v1/manifest.json
            /apps/web/public/assets/3d/ENVIRONMENT_LICENSES.md
            /apps/web/public/assets/studio/cc0-20260906/manifest.json
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/studio/cc0-20260906/' || '' }}
            /apps/web/public/assets/studio/bundle-renders-v1/manifest.json
            /apps/web/public/assets/studio/bundle-scenes-v1/manifest.json
            /apps/web/public/assets/virtual-studio/bundle-decor-v1/manifest.json
            /apps/web/public/assets/virtual-studio/world/default-world.json
            /apps/web/public/assets/virtual-studio/world-v2/characters/pixel-maker/
            /apps/web/public/assets/virtual-studio/living-town-v6/imagegen25-character/
            /apps/web/public/assets/virtual-studio/characters-lpc-v1/
            /apps/web/public/assets/virtual-studio/portraits-v1/
            /apps/web/public/assets/virtual-studio/style-packs-v5/
            /apps/web/public/assets/virtual-studio/experience-v8/
            /apps/web/public/assets/virtual-studio/cinematic-v9/
            /apps/web/public/assets/create/creator-board-hero.png
            /apps/web/public/assets/studio/illustration-20260926/
            /apps/web/public/assets/studio/generated-backgrounds/gpt25-v1/drama/gpt25-bg-drama-boardroom-vertical-depth/background.png
            /apps/web/public/assets/studio/generated-backgrounds/gpt25-v1/romance/gpt25-bg-romance-cherry-path-vertical-depth/background.png
            /apps/web/public/assets/studio/generated-backgrounds/gpt25-v1/wuxia/gpt25-bg-wuxia-palace-courtyard-vertical-depth/background.png
            /apps/web/public/assets/studio/generated-backgrounds/gpt25-v1/daily/gpt25-bg-daily-convenience-store-vertical-depth/background.png
            /apps/web/public/assets/studio/generated-backgrounds/gpt25-v1/sf/gpt25-bg-sf-space-station-vertical-depth/background.png
            /apps/web/public/assets/studio/generated-backgrounds/gpt25-v1/sf/gpt25-bg-sf-cyber-alley-vertical-depth/background.png
            /apps/web/public/assets/studio/generated-backgrounds/gpt25-v1/action/gpt25-bg-action-highway-chase-vertical-depth/background.png
            /apps/web/public/assets/studio/generated-backgrounds/gpt25-v1/drama/gpt25-bg-drama-hospital-corridor-vertical-depth/background.png
            /apps/web/public/assets/studio/generated-backgrounds/gpt25-v1/romance/gpt25-bg-romance-ferris-wheel-vertical-depth/background.png
            /apps/web/public/assets/studio/generated-backgrounds/gpt25-v1/action/gpt25-bg-action-jungle-temple-vertical-depth/background.png
            /apps/web/public/assets/studio/generated-backgrounds/gpt25-v1/wuxia/gpt25-bg-wuxia-traditional-market-vertical-depth/background.png
            /apps/web/public/assets/studio/generated-backgrounds/gpt25-v1/sf/gpt25-bg-sf-research-lab-vertical-depth/background.png
            /apps/web/public/assets/studio/generated-backgrounds/gpt25-v1/daily/gpt25-bg-daily-bedroom-night-vertical-depth/background.png
            /apps/web/public/assets/studio/generated-backgrounds/gpt25-v1/fantasy/gpt25-bg-fantasy-dragon-cliff-vertical-depth/background.png
            /apps/web/public/assets/3d/characters/thumbnails/refined-v2/
            /apps/web/public/assets/3d/characters/
            /apps/web/public/assets/3d/environments/*.glb
            /apps/web/public/assets/3d/environments/thumbnails/
            /apps/web/public/assets/3d/environments/expansion-v1/
            /apps/web/public/assets/3d/environments/webtoon-v7/
            !/apps/web/public/vrm/
            !/artifacts/
            !/tests/benchmarks/results/
            /tests/benchmarks/results/v12-runtime-fault-matrix.json
            /apps/web/public/vrm/LICENSES.md
            /apps/web/public/vrm/quaternius-fantasy-v1/
            /apps/web/public/vrm/quaternius-modular-v1/
            /apps/web/public/vrm/Anna.vrm
            /apps/web/public/vrm/Sendagaya_Shibu.vrm
            /apps/web/public/vrm/Sendagaya_Shino.vrm
            /apps/web/public/vrm/sample.vrm
            /apps/web/public/vrm/AliciaSolid.vrm
            /apps/web/public/vrm/Darkness_Shibu.vrm
            /apps/web/public/vrm/Jennifer.vrm
            /apps/web/public/vrm/Jimmy.vrm
            ${{ github.event_name == 'pull_request' && '/apps/web/public/vrm/Kate.vrm' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/vrm/Erika.vrm' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/vrm/Olivia.vrm' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/vrm/Cyberpal.vrm' || '' }}
            /apps/web/public/vrm/Sakurada_Fumiriya.vrm
            /apps/web/public/vrm/Vivi.vrm
            /apps/web/public/vrm/Victoria_Rubin.vrm
            /apps/web/public/vrm/UnicornPerson.vrm
            /apps/web/public/vrm/MegaAngel.vrm
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/studio/bundle-renders-v1/' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/studio/bundle-scenes-v1/' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/virtual-studio/bundle-decor-v1/' || '' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Restore focused lint cache
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/eslint/quick
          key: toonstudio-session-eslint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            toonstudio-session-eslint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-

      - name: Verify planned feature ownership and UI reachability
        run: node scripts/verify-toonstudio-session-goals.mjs

      - name: PR 기준 커밋 존재 확인
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_NO_LAZY_FETCH: "1"
        run: git cat-file -e "$BASE_SHA^{commit}"

      - name: Collect changed ToonStudio sources
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_NO_LAZY_FETCH: "1"
        run: |
          set -euo pipefail
          git diff --no-renames --name-only -z --diff-filter=ACMR "$BASE_SHA" HEAD -- \
            'apps/web/src/**/*.js' \
            'apps/web/src/**/*.jsx' \
            'apps/web/src/**/*.ts' \
            'apps/web/src/**/*.tsx' \
            'scripts/**/*.js' \
            'scripts/**/*.mjs' \
            'scripts/**/*.mts' > "$RUNNER_TEMP/toonstudio-related-files"

      - name: Lint changed ToonStudio sources
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t files < "$RUNNER_TEMP/toonstudio-related-files"
          if ((${#files[@]} == 0)); then
            echo "No changed ToonStudio source files require lint."
            exit 0
          fi
          pnpm exec eslint --max-warnings=0 --no-warn-ignored \
            --cache --cache-strategy content \
            --cache-location node_modules/.cache/eslint/quick/ \
            -- "${files[@]}"

      - name: Run tests related to changed ToonStudio sources
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t files < "$RUNNER_TEMP/toonstudio-related-files"
          if ((${#files[@]} == 0)); then
            echo "No changed ToonStudio source files require related tests."
            exit 0
          fi
          # PR related 검사가 읽는 CC0 실물 자산도 최초 인증 checkout에 포함한다.
          # vrm-library.test.ts 는 번들된 모든 VRM 파일(약 414MB)을 읽어 크기를 확인하는 시험이라 이 부분 체크아웃에서는 뺀다. 전체 체크아웃으로 도는 Full pnpm test 가 계속 실행한다.
          pnpm exec vitest related "${files[@]}" --run --pool=forks --maxWorkers=2 \
            --exclude '**/vrm-library.test.ts'

      - name: Run manual focused smoke suite
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-quick-task-workspaces.test.ts \
            apps/web/src/domains/creator/studio-shell/StudioQuickStart.test.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.test.tsx \
            --pool=forks \
            --maxWorkers=2
