name: ToonStudio session goals

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/src/app/routes/groups/**"
      - "apps/web/src/domains/creator/**"
      - "apps/web/public/assets/virtual-studio/cinematic-v9/**"
      - "apps/web/src/shared/components/**"
      - "apps/web/src/shared/lib/site-route-visual.ts"
      - "scripts/verify-toonstudio-session-goals.mjs"
      - ".github/workflows/toonstudio-session-goals.yml"
      - "eslint.config.mjs"
      - "vitest.config.*"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: toonstudio-session-goals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-validation:
    name: focused validation
    runs-on: ubuntu-24.04
    # PR의 대규모 related 검사는 24분 제한에 도달한 실행 근거에 따라 40분으로 제한한다.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 40 || 24 }}
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      # Related tests validate tracked documentation evidence; retain docs.
      # PR related의 digest 검사는 등록 VRM 116개를 모두 읽는다. 정본 경로만 최초 checkout에 포함한다.
      # 환경 무결성 검사는 썸네일 뒤의 GLB까지 읽으므로 두 파일을 함께 받고, 무관한 자산 트리는 제외한다.
      # 일러스트 팩 무결성 시험(studio-illustration-pack)은 원본 PNG·SOURCE.json·PROMPTS.json 을 디스크에서 읽는다(약 33 MB).
      # Creator Bundle 시험은 공개 JSON·권리 원장을 읽고, PR Nature 시험은 정본 hash가 결박된 JSON 원본도 읽는다.
      # PR의 세 파생 팩은 인증이 유효한 최초 체크아웃에 포함하고 수동 검사는 manifest만 유지한다.
      - name: Checkout focused ToonStudio source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          # PR 카탈로그 실물 검증에 필요한 GLB·썸네일·Cycles 패스만 함께 받는다.
          sparse-checkout: |
            /*
            !/apps/web/public/assets/
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/3d/*.glb' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/3d/refined-v8/*.glb' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/3d/refined-v8/thumbnails/*.png' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/3d/kitbash-v9/*.glb' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/3d/kitbash-v9/thumbnails/*.png' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/3d/kitbash-v10/*.glb' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/3d/kitbash-v10/thumbnails/*.png' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/3d/environments/authored-v1/*.glb' || '' }}
            ${{ github.event_name == 'pull_request' && '/apps/web/public/assets/3d/environments/authored-v1/thumbnails/*.png' || '' }}
