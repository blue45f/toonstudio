name: Full Test Diagnostic

# Canonical root + PostgreSQL + performance suite. Do not add another PR copy.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-test-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  NODE_OPTIONS: --max-old-space-size=12288

jobs:
  full-test:
    name: Full pnpm test
    runs-on: ubuntu-24.04
    # 전체 스위트가 45분을 넘겨(2026-10-11 main 실측: 테스트 실패 없이 45분 제한으로 취소) 90분으로 늘린다. 필수 체크가 아닌 진단 워크플로우다.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio_full_test
          POSTGRES_PASSWORD: studio_full_test
          POSTGRES_DB: studio_full_integration
        ports: ['5432:5432']
        # Bootstrap requires the application database to have no other clients.
        # Keep the periodic Docker probe on the maintenance database instead.
        options: >-
          --health-cmd "pg_isready -U studio_full_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://studio_full_test:studio_full_test@127.0.0.1:5432/studio_full_integration
      TEST_RUNTIME_DATABASE_ROLE: studio_full_runtime
    steps:
      - name: 체크아웃 전 미사용 SDK 정리와 디스크 여유 확인
        shell: bash
        env:
          TOONSTUDIO_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOONSTUDIO_CI_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux || "${ImageOS:-}" != ubuntu24 || "${TOONSTUDIO_CI_RUNNER_ENVIRONMENT:-}" != github-hosted || "${TOONSTUDIO_CI_RUNNER_OS:-}" != Linux ]] || [[ "$(uname -s)" != Linux ]]; then
            printf 'SDK 정리는 GitHub 호스팅 Ubuntu 24.04에서만 허용합니다.\n' >&2
            exit 1
          fi
          if [[ "${GITHUB_WORKSPACE:-}" != /* ]]; then
            printf '절대 작업공간 경로가 필요합니다.\n' >&2
            exit 1
          fi
          workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          for target in "$GITHUB_WORKSPACE" "$workspace" /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            component=$target
            while [[ "$component" != / ]]; do
              if test -L "$component"; then
                printf '심볼릭 링크 경로는 정리할 수 없습니다: %s\n' "$component" >&2
                exit 1
              fi
              component=${component%/*}
              component=${component:-/}
            done
          done
          for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            if [[ "$workspace" == / || "$workspace" == "$target" || "$workspace" == "$target/"* || "$target" == "$workspace/"* ]]; then
              printf '작업공간과 SDK 경로가 겹칩니다: %s\n' "$target" >&2
              exit 1
            fi
          done
          report_disk() {
            local disk_usage disk_row
            disk_usage=$(df -P -B1 "$workspace")
            printf '%s\n' "$disk_usage"
            df -Pi "$workspace"
            disk_row=${disk_usage#*$'\n'}
            if [[ "$disk_row" == "$disk_usage" ]]; then
              printf '디스크 여유 측정 행이 없습니다.\n' >&2
              exit 1
            fi
            read -r _ _ _ available_bytes _ <<< "$disk_row"
            if [[ ! "$available_bytes" =~ ^[0-9]{1,18}$ ]]; then
              printf '디스크 여유 바이트가 정수가 아닙니다.\n' >&2
              exit 1
            fi
            available_bytes=$((10#$available_bytes))
            for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
              if test -e "$target"; then
                du -s -B1 -- "$target"
              else
                printf 'SDK 경로 없음: %s\n' "$target"
              fi
            done
          }
          printf 'SDK 정리 전 디스크 상태\n'
          report_disk
          sudo rm -rf -- /usr/local/lib/android/sdk /usr/share/dotnet/sdk
          printf 'SDK 정리 후 디스크 상태\n'
          report_disk
          if (( available_bytes < 21474836480 )); then
            printf '전체 체크아웃과 빌드에 필요한 최소 20 GiB 여유가 없습니다: %s 바이트\n' "$available_bytes" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: 미사용 SDK 정리와 기존 검사 범위 계약 확인
        run: node --test scripts/ci-enospc-followup-policy.test.mjs
      - name: Install actual shell and PostgreSQL test prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh postgresql-client
      # 루트 vitest는 apps/brush-lab의 wasm 커널 재현 빌드 테스트(wasm-kernel-reproducible.test.ts)도 수집한다. 그 테스트는 CI에서
      # Rust 툴체인이 없으면 skip하지 않고 실패하므로 봉인된 1.97.0과 wasm32 타깃을 설치한다(architecture-boundaries.yml과 같은 단계).
      - name: Install Rust 1.97.0 with wasm32 target (wasm kernel reproducible build test)
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.97.0
      - name: Bootstrap a fresh disposable database with the runtime role boundary
        env:
          MIGRATION_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          BOOTSTRAP_RUNTIME_DATABASE_PASSWORD="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          export BOOTSTRAP_RUNTIME_DATABASE_PASSWORD
          node scripts/bootstrap-empty-production-database.mjs --execute --allow-loopback \
            --runtime-database-role "$TEST_RUNTIME_DATABASE_ROLE" --release-sha "$GITHUB_SHA" \
            --confirmation BOOTSTRAP-EMPTY-TOONSPECTRUM-DATABASE
      - name: Run full root and performance suites
        run: node scripts/run-full-test-ci.mjs
