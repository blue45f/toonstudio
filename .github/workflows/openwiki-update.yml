name: OpenWiki update

on:
  workflow_dispatch:
  schedule:
    # Weekly rather than daily to keep documentation inference cost bounded.
    - cron: "30 18 * * 0"

concurrency:
  group: openwiki-update
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      OPENWIKI_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Check OpenWiki configuration
        id: openwiki-config
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_PR_TOKEN: ${{ secrets.OPENWIKI_PR_TOKEN }}
          OPENWIKI_PROVIDER: ${{ vars.OPENWIKI_PROVIDER }}
          OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ] && [ -n "$OPENWIKI_PR_TOKEN" ] && [ -n "$OPENWIKI_PROVIDER" ] && [ -n "$OPENWIKI_MODEL_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OpenWiki generation skipped: configure OPENROUTER_API_KEY, OPENWIKI_PR_TOKEN, OPENWIKI_PROVIDER, and OPENWIKI_MODEL_ID."
          fi
      - name: Install OpenWiki
        if: steps.openwiki-config.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/openwiki"
          cp .github/ci-tools/openwiki/package.json .github/ci-tools/openwiki/package-lock.json "$RUNNER_TEMP/openwiki/"
          cd "$RUNNER_TEMP/openwiki"
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$RUNNER_TEMP/openwiki/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=$RUNNER_TEMP/openwiki/node_modules" >> "$GITHUB_ENV"
      - name: 잠긴 OpenWiki SQLite만 소스 빌드
        if: steps.openwiki-config.outputs.enabled == 'true'
        working-directory: ${{ runner.temp }}/openwiki
        env:
          npm_config_build_from_source: "true"
        run: |
          npm rebuild better-sqlite3@12.11.1 --ignore-scripts=false --strict-allow-scripts --no-audit --no-fund
          node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); if (db.prepare('SELECT 42 AS value').get().value !== 42) throw new Error('SQLite 네이티브 실행 실패'); db.close();"
      - name: Update repository wiki
        if: steps.openwiki-config.outputs.enabled == 'true'
        id: openwiki
        continue-on-error: true
        env:
          OPENWIKI_PROVIDER: ${{ vars.OPENWIKI_PROVIDER }}
          OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: openwiki --update --print
      - name: Remove transient run state
        if: steps.openwiki-config.outputs.enabled == 'true' && !cancelled()
        run: rm -f -- openwiki/.run.json
      - name: Create documentation pull request
        if: steps.openwiki-config.outputs.enabled == 'true' && !cancelled()
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.OPENWIKI_PR_TOKEN }}
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          branch: openwiki/update
          commit-message: "docs(openwiki): OpenWiki 문서 갱신"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update. This workflow never auto-merges.

            OpenWiki result: ${{ steps.openwiki.outcome }}
      - name: Propagate OpenWiki failure
        if: steps.openwiki-config.outputs.enabled == 'true' && steps.openwiki.outcome == 'failure'
        run: exit 1
