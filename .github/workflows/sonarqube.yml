name: SonarQube

# Reuse the coverage produced by CI's four test shards. Running this workflow
# independently would scan before those reports exist and report 0% coverage.
on:
  workflow_call:
    secrets:
      SONAR_HOST_URL:
        required: false
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarqube:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    # A full apps/web relocation invalidates the entire analysis cache. The measured cold
    # TypeScript scan alone takes 15 minutes; leave time for indexing and the quality gate.
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_SCANNER_OPTS: -Xmx10240m
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - name: Check SonarQube secrets
        id: secrets
        run: |
          if [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube secrets not configured; skipping scan."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.secrets.outputs.configured == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        if: steps.secrets.outputs.configured == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download coverage from every CI shard
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sonar-coverage-*
          path: coverage

      - name: Require all four nonempty coverage reports
        if: steps.secrets.outputs.configured == 'true'
        run: |
          for shard in 1 2 3 4; do
            test -s "coverage/sonar-coverage-$shard/lcov.info"
          done

      # SonarCloud Automatic Analysis should be disabled to avoid duplicate scans.
      - name: SonarQube scan
        if: steps.secrets.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8
        env:
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
