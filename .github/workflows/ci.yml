          if command -v pnpm >/dev/null 2>&1; then
            if store=$(COREPACK_ENABLE_NETWORK=0 pnpm store path --silent); then
              printf 'pnpm 저장소: %s\n' "$store"
              if test -d "$store"; then du -s -B1 -- "$store"; fi
            fi
          fi
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: 의존성 설치 후 디스크·inode 사용량 확인
        if: always()
        run: |
          df -P -B1 "$GITHUB_WORKSPACE"
          df -Pi "$GITHUB_WORKSPACE"
          for target in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git" "$GITHUB_WORKSPACE/apps/web/public" "$GITHUB_WORKSPACE/node_modules"; do
            if test -e "$target"; then
