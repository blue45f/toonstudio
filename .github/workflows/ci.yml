name: CI

# Keep one protected aggregate while running independent quality gates in parallel.
# Broad repository QA remains diagnostic; a green core is not a full-suite claim.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: core-v3-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Only superseded PR heads are disposable; running main and merge-group checks must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  NODE_OPTIONS: --max-old-space-size=12288

jobs:
  lint:
    name: Core strict lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/apps/web/public/assets/
            /apps/web/public/assets/virtual-studio/world/
            /apps/web/public/assets/reference-rebuild/
            /apps/web/public/assets/3d/environments/refined-v6/manifest.json
            /apps/web/public/assets/3d/environments/refined-v6/render-passes-report.json
            /apps/web/public/assets/3d/environments/expansion-v1/manifest.json
            /apps/web/public/assets/3d/environments/webtoon-v7/manifest.json
            /apps/web/public/assets/3d/environments/mcp-free-v1/manifest.json
            /apps/web/public/assets/3d/environments/authored-v1/manifest.json
            /apps/web/public/assets/studio/bundle-renders-v1/manifest.json
            /apps/web/public/assets/studio/bundle-scenes-v1/manifest.json
            /apps/web/public/assets/virtual-studio/bundle-decor-v1/manifest.json
            !/apps/web/public/vrm/
            !/artifacts/
            !/docs/
            !/tests/benchmarks/results/
      - name: Collect changed pull-request files
        if: github.event_name == 'pull_request'
        id: changed
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed_file_path="$RUNNER_TEMP/core-lint-changed-files.txt"
          : > "$changed_file_path"
          page=1
          while :; do
            response="$(curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100&page=$page")"
            count="$(jq 'length' <<< "$response")"
            jq -r '.[].filename' <<< "$response" >> "$changed_file_path"
            (( count < 100 )) && break
            ((page += 1))
          done
          echo "file=$changed_file_path" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Conventional commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Restore ESLint result cache
        id: eslint-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.cache/eslint
          key: core-eslint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            core-eslint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-
      - name: Strict lint changed pull-request files
        if: github.event_name == 'pull_request'
        env:
          LINT_CACHE_LOCATION: node_modules/.cache/eslint/quick/
        run: node scripts/lint-changed.mjs --files-from="${{ steps.changed.outputs.file }}" --full-on-config
      - name: Strict lint full repository
        if: github.event_name != 'pull_request'
        run: pnpm run lint:strict
      - name: Import and dependency hygiene
        run: pnpm run quality:imports
      - name: Secret scan
        run: pnpm run quality:secrets
      - name: Studio manual root docs match the in-app source
        run: pnpm run verify:studio-manual-docs
      - name: Save ESLint result cache on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.eslint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules/.cache/eslint
          key: core-eslint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}

  typecheck:
    name: Core preflight and application typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/apps/web/public/assets/
            /apps/web/public/assets/virtual-studio/world/
            /apps/web/public/assets/3d/environments/refined-v6/manifest.json
            /apps/web/public/assets/3d/environments/refined-v6/render-passes-report.json
            /apps/web/public/assets/3d/environments/expansion-v1/manifest.json
            /apps/web/public/assets/3d/environments/webtoon-v7/manifest.json
            /apps/web/public/assets/3d/environments/mcp-free-v1/manifest.json
            /apps/web/public/assets/3d/environments/authored-v1/manifest.json
            /apps/web/public/assets/studio/bundle-renders-v1/manifest.json
            /apps/web/public/assets/studio/bundle-scenes-v1/manifest.json
            /apps/web/public/assets/virtual-studio/bundle-decor-v1/manifest.json
            !/apps/web/public/vrm/
            !/artifacts/
            !/docs/
            /docs/AGENTS.md
            /docs/operations/agent-harness.md
            !/tests/benchmarks/results/
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Verify mandatory CI wiring before installing dependencies
        run: node --test scripts/ci-core-gate.test.mjs scripts/agent-harness.test.mjs scripts/ci-core-regression-shards.test.mjs scripts/ci-executed-gates.test.mjs scripts/lint-changed-policy.test.mjs scripts/run-core-vitest.test.mjs scripts/studio-bundle-temporary-allowance.test.mjs scripts/ci-merge-reliability.test.mjs scripts/ci-throughput-policy.test.mjs scripts/type-coverage-gate-contract.test.mjs scripts/code-structure-gates-contract.test.mjs scripts/check-source-file-size.test.mjs
      - name: Verify deduplicated PR workflow policy
        run: python3 scripts/verify-pr-workflow-fanout.py
      # 의존성 설치 전에 끝나는 파일 크기 래칫: 새 파일 줄 수 상한, 기록된 초과 파일 증가 금지, 새 @ts-nocheck 금지(상한 값은 기준선 한 곳에만 둔다).
      - name: Source file size ratchet (no build, dependency-free)
        run: node scripts/check-source-file-size.mjs
      # 렌더 이미지 경로의 매니페스트·이미지가 팩별 권리 원장과 어긋나면(닫힌 팩의 완성 슬롯, 낡은 rights 블록, 서빙될 고아 파일) 설치 전에 막는다.
      - name: Creator Bundle render rights match the pack-rights ledger (no build, dependency-free)
        run: node scripts/sync-creator-bundle-render-rights.mjs --check --files git
      # 네임스페이스 정본(public/i18n/**)만 고치고 평면 팩·내장 사전 재생성을 빠뜨리면 화면이 읽는 팩이 낡는다. 설치 전에 끝나는 검사로 막는다.
      - name: i18n generated assets match the namespace sources (no build, dependency-free)
        run: |
          set -euo pipefail
          node scripts/sync-i18n-legacy-assets.mjs --check
          node scripts/generate-i18n-builtins.mjs --check
      - run: pnpm install --frozen-lockfile --prefer-offline
      # 빌드 없이 Studio 진입 그래프의 정적 성장을 원인 import 와 함께 알린다(typecheck 보다 먼저 몇 초 안에 실패).
      - name: Studio entry graph ratchet (static imports only, no build)
        run: pnpm run check:studio-eager-graph
      - name: Restore TypeScript incremental state
        id: typescript-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            **/*.tsbuildinfo
          key: core-ts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'apps/**/tsconfig*.json', 'deploy/**/tsconfig*.json', 'packages/**/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            core-ts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'apps/**/tsconfig*.json', 'deploy/**/tsconfig*.json', 'packages/**/tsconfig*.json') }}-
      - name: Typecheck application, API and realtime worker
        run: |
          set -euo pipefail
          pnpm run typecheck
          pnpm run typecheck:cloudflare-realtime
      - name: Enforce type-coverage ratchet (typed identifier floor)
        run: pnpm run check:type-coverage
      - name: Save TypeScript incremental state on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.typescript-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            **/*.tsbuildinfo
          key: core-ts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'apps/**/tsconfig*.json', 'deploy/**/tsconfig*.json', 'packages/**/tsconfig*.json') }}-${{ github.sha }}

