          corepack pnpm exec vitest run \
            apps/web/src/domains/creator/layer/studio-layer-lift-mediapipe-inference.test.ts \
            apps/web/src/domains/creator/scene-3d/studio-mannequin-hand-tracking.test.ts \
            apps/web/src/domains/creator/scene-3d/studio-mannequin-webcam-tracking.test.ts \
            apps/web/src/domains/creator/studio-bg-remove.test.ts \
            apps/web/src/domains/creator/studio-mediapipe-vision-assets.test.ts \
            apps/web/src/domains/creator/studio-mediapipe-vision-init-arbiter.test.ts \
            apps/web/src/domains/creator/vrm/studio-mediapipe-vision-init-boundary.test.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-webcam-tracking.test.ts \
            apps/web/src/domains/legal/technology/engineering-library-guide-areas-b.test.ts \
            scripts/verify-studio-mediapipe-browser.test.mjs \
            packages/studio-engine-vello/src/__tests__/vello-adapter.test.ts \
            --maxWorkers=1 --reporter=verbose
      - name: 네트워크 차단 판정과 기존 CI 실행·입력 계약
        if: ${{ !cancelled() && steps.runtime_install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/verify-studio-mediapipe-browser.test.mjs \
            scripts/ci-executed-gates.test.mjs \
            scripts/ci-checkout-inputs.test.mjs
      - name: 공식 Ubuntu 미러와 canonical Chromium·Vulkan 준비
        id: runtime_browser_prepare
        if: ${{ !cancelled() && steps.runtime_install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/ci-ubuntu-apt-mirrors.test.mjs
          sudo env \
            GITHUB_ACTIONS="${GITHUB_ACTIONS:?}" \
            RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT:?}" \
            RUNNER_OS="${RUNNER_OS:?}" \
            RUNNER_ARCH="${RUNNER_ARCH:?}" \
            ImageOS="${ImageOS:?}" \
            "$(command -v node)" scripts/ci-ubuntu-apt-mirrors.mjs
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1-mesa-dev mesa-vulkan-drivers
          install -d -m 700 "$XDG_RUNTIME_DIR"
          test -z "${THORVG_CHROMIUM_EXECUTABLE_PATH:-}"
          corepack pnpm exec playwright install --with-deps chromium
      - name: ThorVG 실제 32회 수명주기와 동시 소유자 2개 검증
        if: ${{ !cancelled() && steps.runtime_browser_prepare.outcome == 'success' }}
        shell: bash
        run: corepack pnpm run verify:studio-thorvg-browser --reporter=verbose --silent=false
      - name: MediaPipe 실제 4개 모델·추론·해제·CSP 시나리오 검증
        if: ${{ !cancelled() && steps.runtime_browser_prepare.outcome == 'success' }}
        shell: bash
        run: corepack pnpm run verify:studio-mediapipe-browser
      - name: 실제 MediaPipe 보고서를 제한된 크기로 로그에 보존
        if: always()
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import { closeSync, existsSync, openSync, readSync, statSync } from "node:fs";
          const path = "artifacts/studio-mediapipe-browser/report.json";
          if (!existsSync(path)) {
            console.log("MediaPipe 보고서가 없습니다. 이전 단계 결과를 확인해야 합니다.");
          } else {
            const bytes = statSync(path).size;
            const limit = 262144;
            const descriptor = openSync(path, "r");
            try {
              const buffer = Buffer.alloc(Math.min(bytes, limit));
              const read = readSync(descriptor, buffer, 0, buffer.length, 0);
              console.log(buffer.subarray(0, read).toString("utf8"));
              if (bytes > limit) console.log("보고서 로그는 " + limit + "/" + bytes + "바이트로 제한했습니다.");
            } finally {
              closeSync(descriptor);
            }
          }
          JS
