name: Feedback community validation
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, release/salvage-integration-20260908]
    paths:
      - 'apps/api/src/**'
      - 'packages/core/src/**'
      - 'apps/web/src/domains/legal/**'
      - 'apps/web/src/shared/components/site-header*.tsx'
      - 'e2e/feedback-community*'
      - 'e2e/community-replies*'
      - 'scripts/feedback-review-config.test.ts'
      - 'scripts/verify-feedback-community-db.mts'
      - '*feedback*.ts'
      - '.github/workflows/feedback-community-validation.yml'
      - 'scripts/ci-enospc-followup-policy.test.mjs'
  push:
    branches: ["main", "release/salvage-integration-20260908"]
    paths:
      - 'apps/api/src/**'
      - 'packages/core/src/**'
      - 'apps/web/src/domains/legal/**'
      - 'apps/web/src/shared/components/site-header*.tsx'
      - 'e2e/feedback-community*'
      - 'e2e/community-replies*'
      - 'scripts/feedback-review-config.test.ts'
      - 'scripts/verify-feedback-community-db.mts'
      - '*feedback*.ts'
      - '.github/workflows/feedback-community-validation.yml'
      - 'scripts/ci-enospc-followup-policy.test.mjs'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# A failed test piped through tee must fail its step, not just appear in a log.
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feedback-community:
    name: Feedback community regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feedback_community_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      HUSKY: '0'
      NODE_OPTIONS: --max-old-space-size=6144
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/feedback_community_test
    steps:
      - name: 체크아웃 전 미사용 SDK 정리와 디스크 여유 확인
        shell: bash
        env:
          TOONSTUDIO_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOONSTUDIO_CI_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux || ( "${ImageOS:-}" != ubuntu24 && "${ImageOS:-}" != ubuntu26 ) || "${TOONSTUDIO_CI_RUNNER_ENVIRONMENT:-}" != github-hosted || "${TOONSTUDIO_CI_RUNNER_OS:-}" != Linux ]] || [[ "$(uname -s)" != Linux ]]; then
            printf 'SDK 정리는 GitHub 호스팅 Ubuntu 24.04 또는 26.04에서만 허용합니다.\n' >&2
            exit 1
          fi
          if [[ "${GITHUB_WORKSPACE:-}" != /* ]]; then
            printf '절대 작업공간 경로가 필요합니다.\n' >&2
            exit 1
          fi
          workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          for target in "$GITHUB_WORKSPACE" "$workspace" /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            component=$target
            while [[ "$component" != / ]]; do
              if test -L "$component"; then
                printf '심볼릭 링크 경로는 정리할 수 없습니다: %s\n' "$component" >&2
                exit 1
              fi
              component=${component%/*}
              component=${component:-/}
            done
          done
          for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            if [[ "$workspace" == / || "$workspace" == "$target" || "$workspace" == "$target/"* || "$target" == "$workspace/"* ]]; then
              printf '작업공간과 SDK 경로가 겹칩니다: %s\n' "$target" >&2
              exit 1
            fi
          done
          report_disk() {
            local disk_usage disk_row
            disk_usage=$(df -P -B1 "$workspace")
            printf '%s\n' "$disk_usage"
            df -Pi "$workspace"
            disk_row=${disk_usage#*$'\n'}
            if [[ "$disk_row" == "$disk_usage" ]]; then
              printf '디스크 여유 측정 행이 없습니다.\n' >&2
              exit 1
            fi
            read -r _ _ _ available_bytes _ <<< "$disk_row"
            if [[ ! "$available_bytes" =~ ^[0-9]{1,18}$ ]]; then
              printf '디스크 여유 바이트가 정수가 아닙니다.\n' >&2
              exit 1
            fi
            available_bytes=$((10#$available_bytes))
            for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
              if test -e "$target"; then
                du -s -B1 -- "$target"
              else
                printf 'SDK 경로 없음: %s\n' "$target"
              fi
            done
          }
          printf 'SDK 정리 전 디스크 상태\n'
          report_disk
          sudo rm -rf -- /usr/local/lib/android/sdk /usr/share/dotnet/sdk
          printf 'SDK 정리 후 디스크 상태\n'
          report_disk
          if (( available_bytes < 21474836480 )); then
            printf '전체 체크아웃과 빌드에 필요한 최소 20 GiB 여유가 없습니다: %s 바이트\n' "$available_bytes" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare evidence directory
        run: |
          mkdir -p artifacts/feedback
          git rev-parse HEAD > artifacts/feedback/source-commit.txt
          cat > /tmp/feedback-lint-files <<'EOF'
          apps/api/src/platform/database/schema/community.schema.ts
          apps/api/src/modules/feedback/feedback.controller.ts
          apps/api/src/modules/feedback/feedback.service.ts
          apps/api/src/server/feedback.ts
          apps/web/src/domains/legal/SupportPage.tsx
          apps/web/src/shared/components/site-header-mobile-nav.tsx
          apps/web/src/shared/components/site-header.tsx
          e2e/feedback-community-harness.tsx
          e2e/feedback-community.spec.ts
          e2e/feedback-community-contract.spec.ts
          e2e/feedback-community-resilience.spec.ts
          e2e/community-replies-harness.tsx
          e2e/feedback-community-replies.spec.ts
          scripts/feedback-review-config.test.ts
          packages/core/src/feedback.test.ts
          packages/core/src/feedback.ts
          packages/core/src/feedback-response.ts
          packages/core/src/feedback-response.test.ts
          packages/core/src/index.ts
          packages/core/src/types.ts
          playwright.feedback.config.ts
          scripts/verify-feedback-community-db.mts
          apps/web/src/domains/legal/ContactPage.tsx
          apps/web/src/domains/legal/FeedbackPage.tsx
          apps/web/src/domains/legal/SitemapPage.tsx
          apps/web/src/domains/legal/feedback/FeedbackComposer.tsx
          apps/web/src/domains/legal/feedback/FeedbackPostCard.tsx
          apps/web/src/domains/legal/feedback/FeedbackThread.tsx
          apps/web/src/domains/legal/feedback/use-feedback-feed.ts
          vite.feedback-review.config.ts
          EOF
          tar -czf artifacts/feedback/reviewed-source.tar.gz -T /tmp/feedback-lint-files .github/workflows/feedback-community-validation.yml apps/web/src/domains/legal/feedback/feedback-community.css e2e/feedback-community.html e2e/community-replies.html docs/feedback-community.md
      - name: Upload exact source for independent review
        uses: actions/upload-artifact@v7
        with:
          name: feedback-review-source-${{ github.sha }}
          path: artifacts/feedback/reviewed-source.tar.gz
          retention-days: 3
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: 미사용 SDK 정리와 전체 집계 계약 확인
        run: node --test scripts/ci-enospc-followup-policy.test.mjs
      - name: Lint changed feature surfaces
        id: lint
        continue-on-error: true
        run: xargs pnpm exec eslint --no-warn-ignored --max-warnings=0 < /tmp/feedback-lint-files 2>&1 | tee artifacts/feedback/lint.log
      - name: Typecheck web and API
        id: types
        continue-on-error: true
        run: pnpm run typecheck 2>&1 | tee artifacts/feedback/typecheck.log
      - name: Shared input and response contract tests
        id: unit
        continue-on-error: true
        run: pnpm exec vitest run packages/core/src/feedback.test.ts packages/core/src/feedback-response.test.ts scripts/feedback-review-config.test.ts 2>&1 | tee artifacts/feedback/unit.log
      - name: Isolated PostgreSQL regression tests
        id: database
        continue-on-error: true
        env:
          TSX_TSCONFIG_PATH: apps/api/tsconfig.json
        run: pnpm exec tsx scripts/verify-feedback-community-db.mts 2>&1 | tee artifacts/feedback/database.log
      - name: Install Chromium
        id: browser_install
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser and responsive regression tests
        id: browser
        continue-on-error: true
        run: pnpm exec playwright test --config playwright.feedback.config.ts 2>&1 | tee artifacts/feedback/browser.log
      - name: Build isolated UI review bundle
        id: build
        continue-on-error: true
        run: pnpm exec vite build --config vite.feedback-review.config.ts 2>&1 | tee artifacts/feedback/build.log
      - name: Build complete production application
        id: production
        continue-on-error: true
        run: pnpm run build 2>&1 | tee artifacts/feedback/production-build.log
      - name: Collect optional lint fix suggestions without changing tested commit
        if: always() && steps.lint.outcome == 'failure'
        run: |
          xargs pnpm exec eslint --fix --no-warn-ignored < /tmp/feedback-lint-files > artifacts/feedback/lint-fix.log 2>&1 || true
          git diff -- . ':!pnpm-lock.yaml' > artifacts/feedback/eslint-suggested.patch
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: feedback-community-verification
          retention-days: 7
          path: |
            artifacts/feedback
            test-results
            dist-feedback-review
      - name: Require every check to pass
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          DATABASE: ${{ steps.database.outcome }}
          BROWSER_INSTALL: ${{ steps.browser_install.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PRODUCTION: ${{ steps.production.outcome }}
        run: |
          python3 - <<'PY'
          import os
          keys = ['LINT', 'TYPES', 'UNIT', 'DATABASE', 'BROWSER_INSTALL', 'BROWSER', 'BUILD', 'PRODUCTION']
          for key in keys:
              print(f'{key}: {os.environ.get(key, "missing")}')
          failed = [key for key in keys if os.environ.get(key) != 'success']
          if failed:
              raise SystemExit('Failed or unexecuted checks: ' + ', '.join(failed))
          PY
