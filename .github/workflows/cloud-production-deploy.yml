name: Cloud production deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "단일 배포 프리셋 (custom=개별 체크박스, smart-release=변경 영역 자동 선별, web-only=웹+R2, api-only=Core API, dry-run=운영 미변경 검증)"
        required: false
        default: "custom"
        type: choice
        options:
          - "custom"
          - "smart-release"
          - "web-only"
          - "api-only"
          - "dry-run"
      ref:
        description: "배포할 origin/main 소문자 40자리 커밋 SHA (비워두면 실행 시점 origin/main 최신 SHA 자동 고정)"
        required: false
        default: ""
        type: string
      deploy_web:
        description: "Cloudflare 정적 웹 + R2 에셋 배포 (toonspectrum-web, 상시 승인 범위)"
        required: false
        default: false
        type: boolean
      deploy_apex_redirect:
        description: "Cloudflare Apex 리다이렉트 Worker 배포 (상시 승인 범위)"
        required: false
        default: false
        type: boolean
      build_api_image:
        description: "Core API 불변 GHCR 이미지 빌드·발행 (상시 승인 범위)"
        required: false
        default: false
        type: boolean
      deploy_api_onpod:
        description: "서울 onpod Core API(toonstudio-api) 이미지 교체 (onpod_confirm 필수)"
        required: false
        default: false
        type: boolean
      sync_api_env_onpod:
        description: "서울 onpod Core API 런타임 환경변수 동기화 (DATABASE_URL 보존, onpod_confirm 필수)"
        required: false
        default: false
        type: boolean
      sync_worker_secrets:
        description: "정적 Worker 시크릿(CORE_ORIGIN_SECRET·NEIS_API_KEY) 동기화 (deploy_web 함께 선택 시)"
        required: false
        default: false
        type: boolean
      onpod_confirm:
        description: "상시 승인 범위 밖인 onpod 변경 승인 문구"
        required: false
        default: "NONE"
        type: choice
        options:
          - "NONE"
          - "CONFIRM-ONPOD-TOONSTUDIO-API"

permissions:
  contents: read

concurrency:
  group: cloud-production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-gate:
    name: Verify main SHA & required CI gates
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
      any_live_deploy: ${{ steps.gate.outputs.any_live_deploy }}
      resolved_mode: ${{ steps.gate.outputs.resolved_mode }}
      effective_deploy_web: ${{ steps.gate.outputs.effective_deploy_web }}
      effective_deploy_apex: ${{ steps.gate.outputs.effective_deploy_apex }}
      effective_build_api_image: ${{ steps.gate.outputs.effective_build_api_image }}
      effective_deploy_api_onpod: ${{ steps.gate.outputs.effective_deploy_api_onpod }}
      effective_sync_api_env_onpod: ${{ steps.gate.outputs.effective_sync_api_env_onpod }}
      effective_sync_worker_secrets: ${{ steps.gate.outputs.effective_sync_worker_secrets }}
      smart_noop: ${{ steps.gate.outputs.smart_noop }}
      scope_summary: ${{ steps.gate.outputs.scope_summary }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lock exact origin/main SHA and verify required CI checks
        id: gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_REF: ${{ inputs.ref }}
          DEPLOY_WEB: ${{ inputs.deploy_web }}
          DEPLOY_APEX: ${{ inputs.deploy_apex_redirect }}
          BUILD_API_IMAGE: ${{ inputs.build_api_image }}
          DEPLOY_API_ONPOD: ${{ inputs.deploy_api_onpod }}
          SYNC_API_ENV_ONPOD: ${{ inputs.sync_api_env_onpod }}
          SYNC_WORKER_SECRETS: ${{ inputs.sync_worker_secrets }}
          ONPOD_CONFIRM: ${{ inputs.onpod_confirm }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::클라우드 배포 워크플로는 main 브랜치에서만 실행할 수 있습니다 (현재: $GITHUB_REF)."
            exit 1
          fi

          git fetch --no-tags origin main
          ORIGIN_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          [[ "$ORIGIN_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]

          if [[ -n "$INPUT_REF" ]]; then
            if [[ ! "$INPUT_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::inputs.ref는 소문자 40자리 16진수 커밋 SHA여야 합니다."
              exit 1
            fi
            if [[ "$INPUT_REF" != "$ORIGIN_MAIN_SHA" ]]; then
              echo "::error::지정한 SHA($INPUT_REF)가 현재 origin/main 끝($ORIGIN_MAIN_SHA)과 일치하지 않습니다."
              exit 1
            fi
            RELEASE_SHA="$INPUT_REF"
          else
            RELEASE_SHA="$ORIGIN_MAIN_SHA"
          fi

          ANY_LIVE="$(
            RELEASE_SHA="$RELEASE_SHA" \
            node scripts/lib/deploy-manifest-briefing.mjs --resolve-workflow-plan
          )"

          node scripts/release-required-ci.mjs "$GITHUB_REPOSITORY" "$RELEASE_SHA" "$ANY_LIVE"

          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### 🔒 클라우드 배포 릴리스 게이트 통과"
            echo "- **고정된 origin/main SHA:** \`$RELEASE_SHA\`"
            echo "- **프리셋 모드(\`mode\`):** \`$INPUT_MODE\`"
            echo "- **실행 유형:** $([[ "$ANY_LIVE" == "true" ]] && echo "운영 반영(선택된 단위만)" || echo "안전 드라이런/무변경 건너뛰기(운영 미변경)")"
          } >> "$GITHUB_STEP_SUMMARY"

  cloudflare-web:
    name: Build & deploy Cloudflare static web + R2
    needs: verify-release-gate
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        inputs.deploy_web == true ||
        needs.verify-release-gate.outputs.effective_deploy_web == 'true' ||
        (needs.verify-release-gate.outputs.any_live_deploy == 'false' && needs.verify-release-gate.outputs.smart_noop != 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-deploy
    outputs:
      web_sha: ${{ steps.deploy_web.outputs.web_sha }}
      worker_version_id: ${{ steps.deploy_web.outputs.worker_version_id }}
      previous_worker_version_id: ${{ steps.deploy_web.outputs.previous_worker_version_id }}
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=12288
      RELEASE_SHA: ${{ needs.verify-release-gate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-release-gate.outputs.release_sha }}
          persist-credentials: false

      - name: 빌드 전 운영 웹 배포 인증 설정 확인
        if: ${{ inputs.deploy_web == true || needs.verify-release-gate.outputs.effective_deploy_web == 'true' }}
        env:
          HAS_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [[ "$HAS_ACCOUNT" != "true" || "$HAS_TOKEN" != "true" ]]; then
            echo "::error::production-deploy 환경의 CLOUDFLARE_ACCOUNT_ID 변수와 CLOUDFLARE_API_TOKEN 시크릿을 확인하세요. 로컬 Wrangler 배포 준비 상태는 pnpm run deploy:doctor에서 확인할 수 있습니다."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies (no secrets exposed)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify exact checkout SHA and offline build contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
          node scripts/deployment-preflight.mjs --profile onpod-current --sha "$RELEASE_SHA" --operation runtime-config --unit build

      - name: Compute typecheck-shards cache key
        id: typecheck-shards-key
        shell: bash
        run: |
          set -euo pipefail
          digest="$(node scripts/typecheck-shards.mjs --print-cache-key 2>/dev/null || true)"
          if [[ -n "$digest" ]]; then
            printf 'key=core-typecheck-shards-v1-%s-%s-%s\n' \
              "${RUNNER_OS}" "${RUNNER_ARCH}" "$digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore typecheck-shards checkpoint cache
        if: ${{ steps.typecheck-shards-key.outputs.key != '' }}
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.cache/typecheck-shards/report.json
          key: ${{ steps.typecheck-shards-key.outputs.key }}

      - name: Build verified web bundle & prepare Static Assets sidecars
        shell: bash
        env:
          VITE_CATALOG_SOURCE: ${{ vars.VITE_CATALOG_SOURCE || 'static' }}
          VITE_STUDIO_LIVE_ORIGIN: ${{ vars.VITE_STUDIO_LIVE_ORIGIN || 'https://www.toonstudio.cloud' }}
          VITE_STUDIO_REALTIME_ORIGIN: ${{ vars.VITE_STUDIO_REALTIME_ORIGIN || 'https://realtime.toonstudio.cloud' }}
          VITE_STUDIO_REALTIME_PROVIDER_ID: ${{ vars.VITE_STUDIO_REALTIME_PROVIDER_ID || 'cloudflare-realtime-v1' }}
          VITE_STUDIO_AUTOMERGE_OFFLINE_BRANCH: ${{ vars.VITE_STUDIO_AUTOMERGE_OFFLINE_BRANCH || 'true' }}
          VITE_KAKAO_JAVASCRIPT_KEY: ${{ secrets.VITE_KAKAO_JAVASCRIPT_KEY }}
        run: |
          set -euo pipefail
          pnpm run build
          pnpm run check:studio-bundle
          pnpm run check:product-tour-remotion-chunks
          pnpm run prepare:cloudflare-static-assets
          node scripts/verify-static-service-worker.mjs

      - name: Execute Cloudflare static web & R2 dry-run
        if: ${{ inputs.deploy_web == false && needs.verify-release-gate.outputs.effective_deploy_web != 'true' }}
        shell: bash
        env:
          CORE_API_ORIGIN: ${{ vars.CORE_API_ORIGIN || 'https://toonstudio-api.onpod.ai' }}
        run: node scripts/cloud-deploy-cloudflare.mjs --unit=static-web --dry-run

      - name: Deploy Cloudflare static web & R2 with live smoke verification
        id: deploy_web
        if: ${{ inputs.deploy_web == true || needs.verify-release-gate.outputs.effective_deploy_web == 'true' }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CORE_API_ORIGIN: ${{ vars.CORE_API_ORIGIN || 'https://toonstudio-api.onpod.ai' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CORE_ORIGIN_SECRET: ${{ secrets.CORE_ORIGIN_SECRET }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          SYNC_WORKER_SECRETS: ${{ needs.verify-release-gate.outputs.effective_sync_worker_secrets }}
        run: |
          set -euo pipefail
          extra_args=()
          if [[ "$SYNC_WORKER_SECRETS" == "true" ]]; then
            extra_args+=(--sync-worker-secrets)
          fi
          node scripts/cloud-deploy-cloudflare.mjs --unit=static-web "${extra_args[@]}"

      - uses: actions/upload-artifact@v7
        if: ${{ always() && (inputs.deploy_web == true || needs.verify-release-gate.outputs.effective_deploy_web == 'true') }}
        with:
          name: cloudflare-web-rollback-${{ needs.verify-release-gate.outputs.release_sha }}
          path: artifacts/cloud-deploy/cloudflare-rollback.json
          if-no-files-found: ignore
          retention-days: 14

  deploy-cloudflare-apex:
    name: Deploy Cloudflare apex redirect Worker
    needs: verify-release-gate
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.deploy_apex_redirect == true || needs.verify-release-gate.outputs.effective_deploy_apex == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-deploy
    env:
      CI: "1"
      RELEASE_SHA: ${{ needs.verify-release-gate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-release-gate.outputs.release_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies (no secrets exposed)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Deploy apex redirect Worker
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloud-deploy-cloudflare.mjs --unit=apex-redirect

  build-api-container:
    name: Build & publish immutable Core API GHCR image
    needs: verify-release-gate
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        inputs.build_api_image == true ||
        inputs.deploy_api_onpod == true ||
        needs.verify-release-gate.outputs.effective_build_api_image == 'true' ||
        needs.verify-release-gate.outputs.effective_deploy_api_onpod == 'true'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      api_image_sha: ${{ needs.verify-release-gate.outputs.release_sha }}
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      IMAGE_NAME: ghcr.io/blue45f/toonspectrum-core-api
      RELEASE_SHA: ${{ needs.verify-release-gate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-release-gate.outputs.release_sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing immutable GHCR image for release SHA
        id: check_existing
        shell: bash
        env:
          DEPLOY_API_ONPOD: ${{ needs.verify-release-gate.outputs.effective_deploy_api_onpod }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_SHA}" >/dev/null 2>&1; then
            if [[ "$DEPLOY_API_ONPOD" == "true" ]]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "이미 발행된 불변 이미지(${IMAGE_NAME}:${RELEASE_SHA})를 재사용합니다."
              exit 0
            fi
            echo "::error::불변 이미지 ${IMAGE_NAME}:${RELEASE_SHA}가 이미 GHCR에 존재합니다(중복 발행 차단)."
            exit 1
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: ${{ steps.check_existing.outputs.exists == 'false' }}
      - uses: actions/setup-node@v7
        if: ${{ steps.check_existing.outputs.exists == 'false' }}
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install and build verified API runtime
        if: ${{ steps.check_existing.outputs.exists == 'false' }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @webtoon-nest/api build
          test -s apps/api/dist/apps/api/src/main.js
          node --check apps/api/dist/apps/api/src/main.js

      - name: Assemble production-only image context
        if: ${{ steps.check_existing.outputs.exists == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          pnpm --filter @webtoon-nest/api deploy --legacy --prod .release/api-package
          mkdir -p .release/image/apps/api
          cp .release/api-package/package.json .release/image/apps/api/package.json
          mv .release/api-package/node_modules .release/image/apps/api/node_modules
          cp -a apps/api/dist .release/image/apps/api/dist
          cp -a apps/api/data .release/image/apps/api/data
          mkdir -p .release/image/deploy/trust
          cp deploy/trust/supabase-prod-ca-2021.crt .release/image/deploy/trust/supabase-prod-ca-2021.crt
          cat > .release/image/Dockerfile <<'DOCKERFILE'
          FROM node:24.16.0-bookworm-slim
          ENV NODE_ENV=production
          ENV NODE_EXTRA_CA_CERTS=/app/deploy/trust/supabase-prod-ca-2021.crt
          WORKDIR /app
          COPY --chown=node:node . /app
          USER node
          EXPOSE 3000
          CMD ["node", "apps/api/dist/apps/api/src/main.js"]
          DOCKERFILE
          printf '%s\n' "$RELEASE_SHA" > .release/image/RELEASE_SHA
          test -s .release/image/apps/api/dist/apps/api/src/main.js

      - name: Build and publish immutable API image
        if: ${{ steps.check_existing.outputs.exists == 'false' }}
        uses: docker/build-push-action@v7
        with:
          context: .release/image
          file: .release/image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/blue45f/toonstudio
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.title=ToonStudio Core API
          cache-from: type=gha,scope=toonspectrum-core-api
          cache-to: type=gha,mode=max,scope=toonspectrum-core-api

      - name: Verify anonymous image pull metadata
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_SHA}"

  deploy-onpod-api:
    name: Deploy Core API to Seoul onpod (toonstudio-api)
    needs:
      - verify-release-gate
      - build-api-container
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.verify-release-gate.result == 'success' &&
      (needs.build-api-container.result == 'success' || needs.build-api-container.result == 'skipped') &&
      (
        inputs.deploy_api_onpod == true ||
        inputs.sync_api_env_onpod == true ||
        needs.verify-release-gate.outputs.effective_deploy_api_onpod == 'true' ||
        needs.verify-release-gate.outputs.effective_sync_api_env_onpod == 'true'
      ) &&
      inputs.onpod_confirm == 'CONFIRM-ONPOD-TOONSTUDIO-API'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-deploy
    outputs:
      api_sha: ${{ steps.deploy_onpod.outputs.api_sha }}
      active_api_image: ${{ steps.deploy_onpod.outputs.active_api_image }}
      previous_api_image: ${{ steps.deploy_onpod.outputs.previous_api_image }}
    env:
      CI: "1"
      RELEASE_SHA: ${{ needs.verify-release-gate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-release-gate.outputs.release_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies and onpod CLI (no secrets exposed)
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          curl -fsSL https://onpod.ai/install.sh | sh
          for bin_dir in "$HOME/.local/bin" "$HOME/.onpod/bin"; do
            if [[ -d "$bin_dir" ]]; then
              echo "$bin_dir" >> "$GITHUB_PATH"
            fi
          done

      - name: Update onpod Core API image / runtime env & verify live origin readiness
        id: deploy_onpod
        shell: bash
        env:
          ONPOD_APP_NAME: ${{ vars.ONPOD_APP_NAME || 'toonstudio-api' }}
          CORE_API_ORIGIN: ${{ vars.CORE_API_ORIGIN || 'https://toonstudio-api.onpod.ai' }}
          ONPOD_CONFIRM: ${{ inputs.onpod_confirm }}
          DEPLOY_API_ONPOD: ${{ needs.verify-release-gate.outputs.effective_deploy_api_onpod }}
          SYNC_API_ENV_ONPOD: ${{ needs.verify-release-gate.outputs.effective_sync_api_env_onpod }}
          ONPOD_DEPLOY_TOKEN: ${{ secrets.ONPOD_DEPLOY_TOKEN }}
          ONPOD_API_ENV_JSON: ${{ secrets.ONPOD_API_ENV_JSON }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$SYNC_API_ENV_ONPOD" == "true" ]]; then
            args+=(--sync-env)
          fi
          if [[ "$DEPLOY_API_ONPOD" == "true" ]]; then
            args+=(--update-image)
          fi
          node scripts/cloud-deploy-onpod.mjs "${args[@]}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: onpod-api-rollback-${{ needs.verify-release-gate.outputs.release_sha }}
          path: |
            artifacts/cloud-deploy/onpod-rollback.json
            artifacts/cloud-deploy/onpod-verification.json
          if-no-files-found: ignore
          retention-days: 14

  release-summary:
    name: Post-deploy smoke & unified release summary
    needs:
      - verify-release-gate
      - cloudflare-web
      - deploy-cloudflare-apex
      - build-api-container
      - deploy-onpod-api
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.verify-release-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-release-gate.outputs.release_sha }}
          persist-credentials: false

      - name: Run combined post-deploy smoke verification
        id: post_smoke
        if: >-
          (needs.verify-release-gate.outputs.effective_deploy_web == 'true' && needs.cloudflare-web.result == 'success') ||
          (needs.verify-release-gate.outputs.effective_deploy_api_onpod == 'true' && needs.deploy-onpod-api.result == 'success')
        shell: bash
        env:
          PREV_WORKER_VERSION: ${{ needs.cloudflare-web.outputs.previous_worker_version_id }}
          PREV_API_IMAGE: ${{ needs.deploy-onpod-api.outputs.previous_api_image }}
        run: |
          set -euo pipefail
          smoke_args=(--retries 6 --retry-delay-ms 5000)
          if [[ -n "$PREV_WORKER_VERSION" && "$PREV_WORKER_VERSION" != 70517470* ]]; then
            smoke_args+=(--prev-worker-version "$PREV_WORKER_VERSION")
          fi
          prev_sha="${PREV_API_IMAGE##*:}"
          if [[ "$prev_sha" =~ ^[0-9a-f]{40}$ ]]; then
            smoke_args+=(--prev-api-sha "$prev_sha")
          fi
          node scripts/verify-production-post-deploy-smoke.mjs "${smoke_args[@]}"

      - name: Write unified cross-LLM release summary & safe rollback commands
        if: always()
        shell: bash
        env:
          RESOLVED_MODE: ${{ needs.verify-release-gate.outputs.resolved_mode }}
          RELEASE_SHA: ${{ needs.verify-release-gate.outputs.release_sha }}
          WEB_SHA: ${{ needs.cloudflare-web.outputs.web_sha }}
          API_SHA: ${{ needs.deploy-onpod-api.outputs.api_sha }}
          API_IMAGE_SHA: ${{ needs.build-api-container.outputs.api_image_sha }}
          WORKER_VERSION_ID: ${{ needs.cloudflare-web.outputs.worker_version_id }}
          PREVIOUS_WORKER_VERSION_ID: ${{ needs.cloudflare-web.outputs.previous_worker_version_id }}
          PREVIOUS_API_IMAGE: ${{ needs.deploy-onpod-api.outputs.previous_api_image }}
          SMOKE_STATUS: ${{ steps.post_smoke.outcome }}
          SMART_NOOP: ${{ needs.verify-release-gate.outputs.smart_noop }}
          SCOPE_SUMMARY: ${{ needs.verify-release-gate.outputs.scope_summary }}
        run: |
          set -euo pipefail
          node scripts/lib/deploy-manifest-briefing.mjs --write-step-summary
