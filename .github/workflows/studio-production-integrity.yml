name: Studio production integrity

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, release/salvage-integration-20260908]
    paths:
      - 'scripts/check-studio-bundle.mjs'
      - 'scripts/lib/studio-crdt-bundle-boundary*'
      - 'scripts/lib/repo-paths.mjs'
      - 'scripts/integration-test-runner-ci-policy.test.mjs'
      - 'scripts/verify-studio-menus.mts'
      - 'scripts/verify-studio-menus-ci.mjs'
      - 'scripts/verify-studio-menus.test.ts'
      - 'scripts/lib/studio-verify-render-settle*'
      - 'apps/web/src/domains/creator/offline-branch/**'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/studio-deferred-stroke-commit*'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/runtime/createStudioCrdtTransitionPublisher.ts'
      - 'apps/web/src/domains/creator/StudioBetaNoticeGate.tsx'
      - 'apps/web/src/domains/creator/studio-beta-notice-storage.ts'
      - 'apps/web/vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/web/src/domains/creator/studio-production/**'
      - 'apps/web/src/domains/creator/studio-router/studio-route-manifest*'
      - 'apps/web/src/domains/creator/studio-router/StudioRouteCollaborationGateway*'
      - 'apps/web/src/domains/creator/studio-router/studio-production-command-center-boundary*'
      - 'apps/web/src/domains/creator/studio-router/StudioRouteEntryContracts*'
      - 'apps/web/src/domains/creator/StudioInspector*'
      - 'apps/web/src/domains/creator/studio-batch-rename*'
      - '.github/workflows/ci.yml'
      - '.github/workflows/studio-production-integrity.yml'
      - 'scripts/ci-executed-gates.test.mjs'
      - 'scripts/ci-enospc-followup-policy.test.mjs'
  push:
    branches: ["main", "release/salvage-integration-20260908"]
    paths:
      - 'scripts/check-studio-bundle.mjs'
      - 'scripts/lib/studio-crdt-bundle-boundary*'
      - 'scripts/lib/repo-paths.mjs'
      - 'scripts/integration-test-runner-ci-policy.test.mjs'
      - 'scripts/verify-studio-menus.mts'
      - 'scripts/verify-studio-menus-ci.mjs'
      - 'scripts/verify-studio-menus.test.ts'
      - 'scripts/lib/studio-verify-render-settle*'
      - 'apps/web/src/domains/creator/offline-branch/**'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/studio-deferred-stroke-commit*'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/runtime/createStudioCrdtTransitionPublisher.ts'
      - 'apps/web/src/domains/creator/StudioBetaNoticeGate.tsx'
      - 'apps/web/src/domains/creator/studio-beta-notice-storage.ts'
      - 'apps/web/vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/web/src/domains/creator/studio-production/**'
      - 'apps/web/src/domains/creator/studio-router/studio-route-manifest*'
      - 'apps/web/src/domains/creator/studio-router/StudioRouteCollaborationGateway*'
      - 'apps/web/src/domains/creator/studio-router/studio-production-command-center-boundary*'
      - 'apps/web/src/domains/creator/studio-router/StudioRouteEntryContracts*'
      - 'apps/web/src/domains/creator/StudioInspector*'
      - 'apps/web/src/domains/creator/studio-batch-rename*'
      - '.github/workflows/ci.yml'
      - '.github/workflows/studio-production-integrity.yml'
      - 'scripts/ci-executed-gates.test.mjs'
      - 'scripts/ci-enospc-followup-policy.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

# main 푸시도 최신 커밋만 남긴다. 그룹을 SHA 로 묶으면 main 실행이 저마다 다른 그룹이 되어
# cancel-in-progress 가 취소할 대상을 갖지 못한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: 체크아웃 전 미사용 SDK 정리와 디스크 여유 확인
        shell: bash
        env:
          TOONSTUDIO_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TOONSTUDIO_CI_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux || "${ImageOS:-}" != ubuntu24 || "${TOONSTUDIO_CI_RUNNER_ENVIRONMENT:-}" != github-hosted || "${TOONSTUDIO_CI_RUNNER_OS:-}" != Linux ]] || [[ "$(uname -s)" != Linux ]]; then
            printf 'SDK 정리는 GitHub 호스팅 Ubuntu 24.04에서만 허용합니다.\n' >&2
            exit 1
          fi
          if [[ "${GITHUB_WORKSPACE:-}" != /* ]]; then
            printf '절대 작업공간 경로가 필요합니다.\n' >&2
            exit 1
          fi
          workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          for target in "$GITHUB_WORKSPACE" "$workspace" /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            component=$target
            while [[ "$component" != / ]]; do
              if test -L "$component"; then
                printf '심볼릭 링크 경로는 정리할 수 없습니다: %s\n' "$component" >&2
                exit 1
              fi
              component=${component%/*}
              component=${component:-/}
            done
          done
          for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            if [[ "$workspace" == / || "$workspace" == "$target" || "$workspace" == "$target/"* || "$target" == "$workspace/"* ]]; then
              printf '작업공간과 SDK 경로가 겹칩니다: %s\n' "$target" >&2
              exit 1
            fi
          done
          report_disk() {
            local disk_usage disk_row
            disk_usage=$(df -P -B1 "$workspace")
            printf '%s\n' "$disk_usage"
            df -Pi "$workspace"
            disk_row=${disk_usage#*$'\n'}
            if [[ "$disk_row" == "$disk_usage" ]]; then
              printf '디스크 여유 측정 행이 없습니다.\n' >&2
              exit 1
            fi
            read -r _ _ _ available_bytes _ <<< "$disk_row"
            if [[ ! "$available_bytes" =~ ^[0-9]{1,18}$ ]]; then
              printf '디스크 여유 바이트가 정수가 아닙니다.\n' >&2
              exit 1
            fi
            available_bytes=$((10#$available_bytes))
            for target in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
              if test -e "$target"; then
                du -s -B1 -- "$target"
              else
                printf 'SDK 경로 없음: %s\n' "$target"
              fi
            done
          }
          printf 'SDK 정리 전 디스크 상태\n'
          report_disk
          sudo rm -rf -- /usr/local/lib/android/sdk /usr/share/dotnet/sdk
          printf 'SDK 정리 후 디스크 상태\n'
          report_disk
          if (( available_bytes < 21474836480 )); then
            printf '전체 체크아웃과 빌드에 필요한 최소 20 GiB 여유가 없습니다: %s 바이트\n' "$available_bytes" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: 미사용 SDK 정리와 기존 검사 범위 계약 확인
        run: node --test scripts/ci-enospc-followup-policy.test.mjs
      - name: Verify real CI execution contract
        run: node --test scripts/ci-executed-gates.test.mjs
      - name: Verify actual production routes and Inspector integration
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-production/studio-production-scope.test.ts \
            apps/web/src/domains/creator/studio-production/StudioProductionHubPage.scope.test.tsx \
            apps/web/src/domains/creator/studio-router/studio-route-manifest.test.ts \
            apps/web/src/domains/creator/studio-router/StudioRouteCollaborationGateway.test.tsx \
            apps/web/src/domains/creator/studio-router/studio-production-command-center-boundary.test.ts \
            apps/web/src/domains/creator/studio-router/StudioRouteEntryContracts.test.tsx \
            apps/web/src/domains/creator/studio-batch-rename.test.ts \
            apps/web/src/domains/creator/StudioInspectorBatchRenameSection.test.tsx \
            apps/web/src/domains/creator/studio-inspector-multi-selection-boundary.test.ts \
            apps/web/src/domains/creator/StudioInspectorOrderAlignSection.test.tsx
      - name: Verify canonical resize and offline rejection contracts
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/offline-branch/studio-offline-branch-runtime.test.ts \
            apps/web/src/domains/creator/offline-branch/studio-offline-host-integration.test.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-deferred-stroke-commit.test.ts \
            scripts/verify-studio-menus.test.ts
      - name: Build production browser without repeating the core typecheck
        shell: bash
        run: |
          set +e
          pnpm run build:bundle
          build_status=$?
          set -e
          if (( build_status != 0 )); then
            echo "::group::Source-mapped Studio prerender diagnostic"
            rm -rf apps/web/.next
            pnpm --filter @toonstudio/web exec next build --webpack --no-lint --debug-prerender || true
            echo "::endgroup::"
            exit "$build_status"
          fi
          pnpm run check:studio-bundle
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Inspect actual production browser
        run: pnpm exec tsx scripts/verify-studio-menus-ci.mjs
