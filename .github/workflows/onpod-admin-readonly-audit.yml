name: Onpod admin read-only audit

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "진단 기준: 현재 origin/main 소문자 40자리 SHA (운영 변경 없음)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: onpod-admin-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/onpod-admin-readonly-audit.yml
            /scripts/run-onpod-admin-readonly-audit.mjs
            /scripts/run-onpod-admin-readonly-audit.test.mjs
            /scripts/onpod-admin-db-audit-payload.mjs
            /scripts/onpod-admin-db-audit-payload.test.mjs
            /scripts/production-database-migrations.manifest
            /apps/api/src/platform/database/migrations/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false

      - name: Verify exact current main SHA without production secrets
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::운영 읽기 전용 진단은 main의 수동 실행만 허용합니다."
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_sha는 소문자 40자리 SHA여야 합니다."
            exit 1
          fi
          git fetch --no-tags --depth=1 --filter=blob:none origin main
          if [[ "$RELEASE_SHA" != "$GITHUB_SHA" || "$RELEASE_SHA" != "$(git rev-parse HEAD)" || "$RELEASE_SHA" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "::error::진단 SHA가 실행 checkout 또는 현재 origin/main과 다릅니다. 최신 main SHA로 새 실행을 시작하세요."
            exit 1
          fi

      - name: Test read-only audit contracts without production secrets
        run: node --test scripts/onpod-admin-db-audit-payload.test.mjs scripts/run-onpod-admin-readonly-audit.test.mjs

      - name: Install pinned official onpod CLI without production secrets
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -s)" != "Linux" || "$(uname -m)" != "x86_64" ]]; then
            echo "::error::고정 Onpod CLI는 Linux x86_64에서만 설치할 수 있습니다. runner 플랫폼을 확인하세요."
            exit 1
          fi
          cli_dir="$RUNNER_TEMP/onpod-readonly-cli/bin"
          cli_download="$cli_dir/onpod.download"
          mkdir -p "$cli_dir"
          trap 'rm -f "$cli_download"' EXIT
          if ! curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 45 \
            --retry 1 --retry-delay 2 --retry-max-time 90 \
            --output "$cli_download" \
            'https://github.com/onpod/homebrew-onpod/releases/download/v0.7.159/onpod-linux-amd64'; then
            echo "::error::고정 Onpod CLI 다운로드에 실패했습니다. 공식 release 주소와 네트워크 연결을 확인하세요."
            exit 1
          fi
          if ! printf '%s  %s\n' '2467eadf9c7d7309a2cec9d4031c635a7b5261e5928e14282e11f7b3737e5153' "$cli_download" | sha256sum --check --status; then
            echo "::error::고정 Onpod CLI의 SHA-256이 일치하지 않습니다. v0.7.159 공식 release 자산을 확인하세요."
            exit 1
          fi
          chmod 0755 "$cli_download"
          mv "$cli_download" "$cli_dir/onpod"
          echo "$cli_dir" >> "$GITHUB_PATH"

      - name: Verify pinned CLI before production credentials
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          version="$(onpod --version)"
          [[ "$version" == "onpod 0.7.159" ]]
          onpod app status --help >/dev/null
          onpod exec --help >/dev/null

      - name: Read fixed app, migration ledger, and optional Worker metadata
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ONPOD_DEPLOY_TOKEN: ${{ secrets.ONPOD_DEPLOY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/run-onpod-admin-readonly-audit.mjs
