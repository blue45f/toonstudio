name: Studio menu viewport integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/domains/creator/StudioMainMenu*.tsx'
      - 'apps/web/src/domains/creator/studio-main-menu-viewport*.ts'
      - 'apps/web/src/domains/creator/scene3d/studio-main-menu-viewport*.ts'
      - '.github/workflows/studio-menu-viewport.yml'
  schedule:
    - cron: "37 20 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-menu-viewport-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  menu-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint the production menu and regression tests
        run: pnpm exec eslint --max-warnings=0 apps/web/src/domains/creator/StudioMainMenu.tsx apps/web/src/domains/creator/studio-main-menu-viewport.ts apps/web/src/domains/creator/scene3d/studio-main-menu-viewport.test.ts apps/web/src/domains/creator/StudioMainMenu.viewport.test.tsx
      - name: Run the existing menu contracts and new viewport tests
        run: pnpm exec vitest run apps/web/src/domains/creator/StudioMainMenu.test.tsx apps/web/src/domains/creator/scene3d/studio-main-menu-viewport.test.ts apps/web/src/domains/creator/StudioMainMenu.viewport.test.tsx
