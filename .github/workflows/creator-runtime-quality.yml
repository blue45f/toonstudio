name: Creator runtime quality
on:
  push:
    branches: ['feat/offline-inference-spatial-20260913']
    paths:
      - 'apps/web/public/offline-draw/**'
      - 'apps/web/public/offline-drawing/**'
      - 'apps/web/public/offline-drawing.html'
      - 'apps/web/public/spatial-reader/**'
      - 'apps/web/src/**'
      - 'apps/api/src/modules/studio-ai/**'
      - 'services/creator-inference/**'
      - 'tools/creator-runtime/**'
      - 'scripts/verify-typechecked-build-inputs.mjs'
      - 'scripts/verify-typechecked-build-inputs.test.mjs'
      - '.github/workflows/creator-runtime-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/public/offline-draw/**'
      - 'apps/web/public/offline-drawing/**'
      - 'apps/web/public/offline-drawing.html'
      - 'apps/web/public/spatial-reader/**'
      - 'apps/web/src/app/service-worker/**'
      - 'apps/web/src/shared/lib/studio-offline-protocol.ts'
      - 'apps/web/src/domains/creator/ai/CreatorInference*'
      - 'apps/api/src/modules/studio-ai/**'
      - 'services/creator-inference/**'
      - 'tools/creator-runtime/**'
      - 'scripts/verify-typechecked-build-inputs.mjs'
      - 'scripts/verify-typechecked-build-inputs.test.mjs'
      - '.github/workflows/creator-runtime-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: creator-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/web/public/offline-draw
            apps/web/public/offline-drawing
            apps/web/public/spatial-reader
            apps/web/src/app/service-worker
            apps/web/src/shared/lib
            services/creator-inference
            tools/creator-runtime
            .github/ci-tools/typescript
            .github/requirements
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install locked TypeScript toolchain
        run: |
          mkdir -p /tmp/creator-test
          cp .github/ci-tools/typescript/package.json .github/ci-tools/typescript/package-lock.json /tmp/creator-test/
          npm ci --prefix /tmp/creator-test --ignore-scripts --no-audit --no-fund
      - run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/creator-runtime-test.txt
      - name: 모델 의존성 해석 검증
        run: python services/creator-inference/check_model_resolution.py --report creator-model-resolution.json
      - run: python -m playwright install --with-deps chromium
      - name: Actual pure contracts and worker test bundle
        env:
          NODE_PATH: /tmp/creator-test/node_modules
        run: |
          node --test tools/creator-runtime/contracts.test.mjs
          node tools/creator-runtime/build-portable.mjs --check
          node tools/creator-runtime/compile-worker.mjs
      - name: CPU API validation (not real model generation)
        run: python -m pytest services/creator-inference/test_runtime.py -q --junitxml=creator-cpu-tests.xml
      - name: Chromium offline drawing and origin outage
        run: python tools/creator-runtime/offline-browser.py
      - name: Chromium spatial reader and unsupported XR fallback
        if: '!cancelled()'
        run: python tools/creator-runtime/spatial-browser.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: creator-runtime-evidence
          path: |
            creator-*-test-results.json
            creator-cpu-tests.xml
            creator-model-resolution.json
            creator-runtime-results/
          retention-days: 7
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 의존성 보안·라이선스 감사
        run: |
          set -euo pipefail
          pnpm run audit:security
          pnpm run audit:licenses
      - name: 전체 타입 검사와 빌드 입력 기록
        id: types
        run: |
          set -euo pipefail
          node --max-old-space-size=8192 scripts/verify-typechecked-build-inputs.mjs record "$RUNNER_TEMP/typechecked-build-inputs.json"
          pnpm typecheck
      - name: 타입 검사가 성공한 동일 입력으로 프로덕션 빌드
        if: ${{ success() && steps.types.outcome == 'success' }}
        env:
          TYPECHECK_OUTCOME: ${{ steps.types.outcome }}
        run: |
          set -euo pipefail
          pnpm run prebuild
          node --max-old-space-size=8192 scripts/verify-typechecked-build-inputs.mjs verify "$RUNNER_TEMP/typechecked-build-inputs.json"
          pnpm run build:bundle
          node --max-old-space-size=8192 scripts/verify-typechecked-build-inputs.mjs verify "$RUNNER_TEMP/typechecked-build-inputs.json"
