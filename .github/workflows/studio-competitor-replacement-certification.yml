name: Studio competitor replacement certification

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/studio-competitor-replacement-certification.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/desktop-sync/**"
      - "apps/web/src/domains/creator/**"
      - "apps/api/src/modules/creator/**"
      - "apps/api/src/modules/personal-cloud/**"
      - "apps/api/src/modules/production-collaboration/**"
      - "apps/api/src/modules/studio-project-graph/**"
      - "apps/api/src/platform/database/schema/studio-project-graph.schema.ts"
      - "packages/core/src/production/**"
      - "packages/studio-project-model/**"
      - "packages/studio-format-gateway/**"
      - "scripts/verify-studio-competitor-replacement*"
      - "scripts/verify-studio-reference-projects*"
      - "scripts/verify-studio-professional-validation*"
      - "scripts/verify-security-advisory-exceptions*"
      - "scripts/verify-studio-operational-validation*"
      - "scripts/verify-studio-publishing-lifecycle*"
      - "scripts/verify-studio-psd-original-quality*"
      - "scripts/verify-studio-publish-package-goldens*"
      - "scripts/studio-competitor-replacement-certification-workflow.test.mjs"
      - "scripts/*desktop-sync-release*"
      - ".github/workflows/desktop-sync-release.yml"
      - "docs/operations/toonstudio-desktop-folder-sync.md"
      - "docs/product/ALL_IN_ONE_IMPLEMENTATION_STATUS.md"
      - "docs/benchmarks/studio-competitor-registry.json"
      - "docs/benchmarks/studio-competitor-replacement-program.json"
      - "docs/benchmarks/studio-operational-validation-certification.json"
      - "docs/benchmarks/studio-publishing-lifecycle-certification.json"
      - "docs/benchmarks/studio-reference-project-certification.json"
      - "docs/validation/studio-professional-creator-validation*"
      - "tests/benchmarks/**"
      - "tests/fault-injection/**"
      - "tests/visual/recovery-package-cas-contract.test.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/studio-competitor-replacement-certification.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/desktop-sync/**"
      - "apps/web/src/domains/creator/**"
      - "apps/api/src/modules/creator/**"
      - "apps/api/src/modules/personal-cloud/**"
      - "apps/api/src/modules/production-collaboration/**"
      - "apps/api/src/modules/studio-project-graph/**"
      - "apps/api/src/platform/database/schema/studio-project-graph.schema.ts"
      - "packages/core/src/production/**"
      - "packages/studio-project-model/**"
      - "packages/studio-format-gateway/**"
      - "scripts/verify-studio-competitor-replacement*"
      - "scripts/verify-studio-reference-projects*"
      - "scripts/verify-studio-professional-validation*"
      - "scripts/verify-security-advisory-exceptions*"
      - "scripts/verify-studio-operational-validation*"
      - "scripts/verify-studio-publishing-lifecycle*"
      - "scripts/verify-studio-psd-original-quality*"
      - "scripts/verify-studio-publish-package-goldens*"
      - "scripts/studio-competitor-replacement-certification-workflow.test.mjs"
      - "scripts/*desktop-sync-release*"
      - ".github/workflows/desktop-sync-release.yml"
      - "docs/operations/toonstudio-desktop-folder-sync.md"
      - "docs/product/ALL_IN_ONE_IMPLEMENTATION_STATUS.md"
      - "docs/benchmarks/studio-competitor-registry.json"
      - "docs/benchmarks/studio-competitor-replacement-program.json"
      - "docs/benchmarks/studio-operational-validation-certification.json"
      - "docs/benchmarks/studio-publishing-lifecycle-certification.json"
      - "docs/benchmarks/studio-reference-project-certification.json"
      - "docs/validation/studio-professional-creator-validation*"
      - "tests/benchmarks/**"
      - "tests/fault-injection/**"
      - "tests/visual/recovery-package-cas-contract.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: sync, reference projects, and claim safety
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6 # NOSONAR S7637 trusted first-party action
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify replacement program evidence and claim policy
        run: pnpm run verify:studio-competitor-replacement:program
      - name: Verify desktop sync tests and types
        run: pnpm run verify:studio-competitor-replacement:desktop-sync
      - name: Verify professional validation kit and claim safety
        run: pnpm run verify:studio-professional-validation-kit
      - name: Verify desktop sync release packaging
        run: pnpm run test:desktop-sync-release
      - name: Verify certification workflow contract
        run: node --test scripts/studio-competitor-replacement-certification-workflow.test.mjs
      - name: Execute deterministic reference projects A-D
        run: node scripts/verify-studio-reference-projects.mjs --run --receipt qa-results/studio-reference-projects/receipt.json
      - name: Upload certification receipts
        if: always()
        uses: actions/upload-artifact@v6 # NOSONAR S7637 trusted first-party action
        with:
          name: studio-competitor-replacement-${{ github.run_id }}
          path: qa-results/studio-reference-projects
          if-no-files-found: warn
          retention-days: 30
