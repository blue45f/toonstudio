name: Multi-Cloud & Local Dynamic Matrix Plan (Offline Preview)

on:
  workflow_dispatch:
    inputs:
      workspaces:
        description: "쉼표로 구분된 빌드·검증 대상 (예: web,character-lab,brush-lab,api)"
        required: false
        default: "web,character-lab,brush-lab,api"
        type: string
      targets:
        description: "쉼표로 구분된 배포 계획 프리뷰 타겟 환경 (실제 원격 배포는 수행하지 않음)"
        required: false
        default: "local-docker-compose,cloudflare-edge-static,onpod-container-cloud,aws-ecs-cloudfront,gcp-cloud-run,self-hosted-k8s"
        type: string
  push:
    branches:
      - main
    paths:
      - "apps/web/src/domains/creator/bg3d/**"
      - "apps/character-lab/src/**"
      - "apps/brush-lab/src/**"
      - "scripts/multi-env-dynamic-deploy.mjs"
      - "scripts/verify-all-labs-production-release.mts"
      - "deploy/multi-env/**"
      - ".github/workflows/multi-cloud-local-dynamic-deploy.yml"

permissions:
  contents: read

concurrency:
  group: multi-cloud-local-dynamic-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-and-verify-matrix:
    name: "Stage 1 · Dynamic Matrix & Verify AI Gate"
    runs-on: ubuntu-latest
    outputs:
      workspace_matrix: ${{ steps.matrix.outputs.workspace }}
      target_matrix: ${{ steps.matrix.outputs.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute Dynamic Workspace & Multi-Cloud Matrix
        id: matrix
        env:
          INPUT_WORKSPACES: ${{ inputs.workspaces || 'web,character-lab,brush-lab,api' }}
          INPUT_TARGETS: ${{ inputs.targets || 'local-docker-compose,cloudflare-edge-static,onpod-container-cloud,aws-ecs-cloudfront,gcp-cloud-run,self-hosted-k8s' }}
        run: |
          MATRIX_JSON=$(node scripts/multi-env-dynamic-deploy.mjs \
            --workspace "$INPUT_WORKSPACES" \
            --target "$INPUT_TARGETS" \
            --sha "${GITHUB_SHA}" \
            --report /tmp/multi-env-deploy-plan.md \
            --json /tmp/multi-env-deploy-plan.json \
            --github-matrix)
          WORKSPACE_LIST=$(node -e 'const m = JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(m.workspace));' "$MATRIX_JSON")
          TARGET_LIST=$(node -e 'const m = JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(m.target));' "$MATRIX_JSON")
          echo "workspace=$WORKSPACE_LIST" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET_LIST" >> "$GITHUB_OUTPUT"
          cat /tmp/multi-env-deploy-plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run Architecture & All-Labs Verify AI Preflight Gates in Parallel
        run: |
          pnpm run validate:architecture
          pnpm exec tsx scripts/verify-blender-fresh-ideas-ai-gate.mts --report /tmp/blender-verify-ai-report.md
          pnpm exec tsx scripts/verify-all-labs-production-release.mts --report /tmp/all-labs-production-release.md
          cat /tmp/all-labs-production-release.md >> "$GITHUB_STEP_SUMMARY"
          ./node_modules/.bin/vitest run \
            apps/web/src/domains/creator/bg3d/studio-bg3d-fresh-ideas-verify-ai.test.ts \
            apps/web/src/domains/creator/bg3d/studio-bg3d-shot-continuity-linked-ink.test.ts \
            apps/web/src/domains/creator/bg3d/studio-bg3d-multipass-rights-remediation.test.ts \
            apps/web/src/domains/creator/bg3d/studio-bg3d-scroll-pacing-live-sync.test.ts \
            apps/web/src/domains/creator/bg3d/studio-cross-labs-production-bridge.test.ts \
            apps/character-lab/src/render/style/character-verify-ai-fresh-ideas.test.ts \
            apps/brush-lab/src/bench/metrics/webtoon-brush-verify-ai-remix.test.ts \
            scripts/multi-env-dynamic-deploy.test.mjs

      - name: Upload Dynamic Deploy Plan & Verify AI Reports
        uses: actions/upload-artifact@v7
        with:
          name: multi-env-deploy-plan-and-verify-ai
          path: |
            /tmp/multi-env-deploy-plan.md
            /tmp/multi-env-deploy-plan.json
            /tmp/blender-verify-ai-report.md
            /tmp/all-labs-production-release.md
          retention-days: 14

  verify-and-package-workspaces:
    name: "Stage 2 · Parallel Workspace Verify (${{ matrix.workspace.id }})"
    needs: plan-and-verify-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJson(needs.plan-and-verify-matrix.outputs.workspace_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Workspace Verify AI Gate (${{ matrix.workspace.id }})
        run: ${{ matrix.workspace.verifyCommand }}

  emit-multi-cloud-bundles:
    name: "Stage 3 · Offline Plan Bundle (${{ matrix.target.id }})"
    needs:
      - plan-and-verify-matrix
      - verify-and-package-workspaces
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan-and-verify-matrix.outputs.target_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate Offline Deployment Plan Preview Bundle (${{ matrix.target.id }})
        env:
          TARGET_ID: ${{ matrix.target.id }}
          TARGET_CATEGORY: ${{ matrix.target.category }}
          TARGET_CMD: ${{ matrix.target.commandPreview }}
        run: |
          mkdir -p /tmp/deploy-bundle-${TARGET_ID}
          cp deploy/multi-env/docker-compose.local.yml /tmp/deploy-bundle-${TARGET_ID}/
          cp deploy/multi-env/k8s-portable-stack.yaml /tmp/deploy-bundle-${TARGET_ID}/
          cat <<EOF > /tmp/deploy-bundle-${TARGET_ID}/deploy-plan-preview.json
          {
            "targetId": "${TARGET_ID}",
            "category": "${TARGET_CATEGORY}",
            "commitSha": "${GITHUB_SHA}",
            "commandPreview": "${TARGET_CMD}",
            "status": "offline-plan-only",
            "deployed": false,
            "deploymentAuthorized": false
          }
          EOF
          echo "### Target \`${TARGET_ID}\` (${TARGET_CATEGORY}) — Offline Plan Preview Only (Not Deployed)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Command preview: \`${TARGET_CMD}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Portable Environment Plan Bundle (${{ matrix.target.id }})
        uses: actions/upload-artifact@v7
        with:
          name: deploy-plan-bundle-${{ matrix.target.id }}
          path: /tmp/deploy-bundle-${{ matrix.target.id }}
          retention-days: 14
