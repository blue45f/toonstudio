name: WebGPU dab tile binning compute

on:
  pull_request:
    paths:
      - "apps/web/src/domains/creator/render/studio-webgpu-dab-tile-binning.ts"
      - "apps/web/src/domains/creator/render/studio-webgpu-dab-tile-binning.test.ts"
      - "apps/web/src/domains/creator/render/studio-webgpu-dab-tile-binning-compute.ts"
      - "apps/web/src/domains/creator/render/studio-webgpu-dab-tile-binning-compute.test.ts"
      - "apps/web/src/domains/creator/render/studio-webgpu-dab-tile-binning-wgsl-compat.test.ts"
      - "apps/web/src/domains/creator/render/studio-webgpu-sparse-brush-compute-runtime.ts"
      - "apps/web/src/domains/creator/render/studio-webgpu-sparse-brush-compute-runtime.test.ts"
      - "scripts/studio-webgpu-dab-tile-binning-compute-browser.ts"
      - "scripts/verify-studio-webgpu-dab-tile-binning-compute.mjs"
      - ".github/workflows/webgpu-dab-tile-binning-compute.yml"
  workflow_dispatch:
  schedule:
    - cron: "19 15 * * 3"

permissions:
  contents: read

concurrency:
  group: webgpu-dab-tile-binning-compute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-webgpu:
    name: real-webgpu
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.4.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused unit tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/render/studio-webgpu-dab-tile-binning.test.ts
          apps/web/src/domains/creator/render/studio-webgpu-dab-tile-binning-compute.test.ts
          apps/web/src/domains/creator/render/studio-webgpu-dab-tile-binning-wgsl-compat.test.ts
          apps/web/src/domains/creator/render/studio-webgpu-sparse-brush-compute-runtime.test.ts

      - name: Focused lint
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/web/src/domains/creator/render/studio-webgpu-dab-tile-binning-compute.ts
          apps/web/src/domains/creator/render/studio-webgpu-dab-tile-binning-compute.test.ts
          apps/web/src/domains/creator/render/studio-webgpu-dab-tile-binning-wgsl-compat.test.ts
          apps/web/src/domains/creator/render/studio-webgpu-sparse-brush-compute-runtime.ts
          apps/web/src/domains/creator/render/studio-webgpu-sparse-brush-compute-runtime.test.ts

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Restore Playwright Chromium cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Exact WebGPU count-scan-scatter proof
        env:
          TOONSPECTRUM_WEBGPU_HEADED: "1"
        run: >-
          xvfb-run -a --server-args="-screen 0 1920x1200x24"
          pnpm exec node scripts/verify-studio-webgpu-dab-tile-binning-compute.mjs
