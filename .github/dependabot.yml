# Dependabot 버전 업데이트 설정 (2026-10-13 보안 점검에서 도입, 이 파일이 정본)
# 목적: 의존성 업데이트가 자동으로 PR까지 이어지게 한다.
# 이 파일은 레포의 .github/dependabot.yml 에 실제로 존재하며, 아래 updates가
# Dependabot 버전 업데이트의 대상과 주기를 정한다.
# (취약점 알림 자체는 Settings > Security에서 Dependabot alerts를 켜야 하며,
#  활성화 여부는 소유자 확인 대상이다 — 이 파일만으로 알림이 켜지지는 않는다)
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/crates/studio-engine-vello"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  - package-ecosystem: "cargo"
    directory: "/apps/brush-lab/wasm/sumi-kernel"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  - package-ecosystem: "cargo"
    directory: "/packages/studio-hokusai-wasm"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  # crates/vendor/wgpu-toon 은 벤더링된 포크라 Dependabot 대상에서 제외한다.
  # (벤더 코드의 의존성은 업스트림 동기화 때 함께 갱신하는 것이 안전)

  - package-ecosystem: "pip"
    directory: "/services/creator-inference"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
