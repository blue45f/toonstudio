<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860" role="img" aria-label="시안 B·C·D·O — 단일 44px 바 2D 에디터, 3D Live Ink 에셋 선반, 출고 프리플라이트">
  <defs>
    <linearGradient id="aurora2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bakeCta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="860" fill="#0c0d18"/>

  <!-- TOP: 2D EDITOR SINGLE 44PX STAGE PILL BAR (68rem unclipped + autosave dot) -->
  <text x="36" y="34" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="800">시안 B · D — 2D 웹툰 에디터 단일 44px 5공정 스냅 바 (클리핑 해제 68rem + 실시간 OPFS 자동저장 배지 + Rights BOM 프리플라이트)</text>
  <rect x="36" y="48" width="1368" height="364" rx="22" fill="#131526" stroke="#31365c" stroke-width="1.5"/>
  <rect x="36" y="48" width="1368" height="3" fill="url(#aurora2)"/>

  <!-- 44px Chrome Bar -->
  <rect x="36" y="51" width="1368" height="52" fill="#181b31"/>
  <line x1="36" y1="103" x2="1404" y2="103" stroke="#2d3257"/>
  <text x="60" y="82" fill="#f5f6ff" font-family="system-ui,sans-serif" font-size="13" font-weight="800">← 심야의 별빛 공방 · 12화 원고</text>
  <rect x="272" y="63" width="144" height="28" rx="14" fill="#13382d" stroke="#34d399"/>
  <text x="344" y="81" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="11" font-weight="700">● OPFS 자동저장됨</text>

  <!-- 5-Stage Snap Pill Switcher -->
  <rect x="444" y="59" width="560" height="36" rx="18" fill="#111324" stroke="#373d69"/>
  <text x="498" y="81" text-anchor="middle" fill="#9ea6cc" font-family="system-ui,sans-serif" font-size="11" font-weight="700">1. 콘티</text>
  <text x="598" y="81" text-anchor="middle" fill="#9ea6cc" font-family="system-ui,sans-serif" font-size="11" font-weight="700">2. 3D·배경</text>
  <rect x="654" y="63" width="118" height="28" rx="14" fill="#7c5cff"/>
  <text x="713" y="81" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="11" font-weight="800">3. 작화·채색</text>
  <text x="822" y="81" text-anchor="middle" fill="#9ea6cc" font-family="system-ui,sans-serif" font-size="11" font-weight="700">4. 식자</text>
  <text x="928" y="81" text-anchor="middle" fill="#9ea6cc" font-family="system-ui,sans-serif" font-size="11" font-weight="700">5. 검수·출고</text>

  <rect x="1028" y="59" width="176" height="36" rx="18" fill="#222645" stroke="#474f82"/>
  <text x="1116" y="81" text-anchor="middle" fill="#d8def8" font-family="system-ui,sans-serif" font-size="11" font-weight="700">고급 도구 펼치기</text>
  <rect x="1218" y="59" width="162" height="36" rx="18" fill="url(#bakeCta)"/>
  <text x="1299" y="81" text-anchor="middle" fill="#0b0d18" font-family="system-ui,sans-serif" font-size="11" font-weight="800">출고 · 프리플라이트</text>

