<!doctype html><meta charset="utf-8"><title>Isolated candidate WASM receipt</title>
<script type="module">
import * as ort from '/ort/ort.wasm.min.mjs';
window.runCandidate=async()=>{
  ort.env.wasm.numThreads=1;ort.env.wasm.wasmPaths='/ort/';
  const loadStart=performance.now();const session=await ort.InferenceSession.create('/light-paprika-512-evaluation.onnx',{executionProviders:['wasm']});
  const loadMs=performance.now()-loadStart;
  const name='usgs-mountain-lake-original.jpg';
  const input=new Float32Array(await(await fetch('/inputs/'+name+'.f32')).arrayBuffer());
  const reference=new Float32Array(await(await fetch('/'+name+'.cpu-output.f32')).arrayBuffer());
  const tensor=new ort.Tensor('float32',input,[1,3,512,512]);const receipts=[];
  for(let trial=0;trial<3;trial++){
    const start=performance.now();const output=await session.run({image:tensor});const ms=performance.now()-start;
    const result=output.anime;let maxError=0,sumError=0,nonfinite=0;
    for(let i=0;i<result.data.length;i++){const d=Math.abs(result.data[i]-reference[i]);maxError=Math.max(maxError,d);sumError+=d;if(!Number.isFinite(result.data[i]))nonfinite++;}
    receipts.push({ms,shape:result.dims,maxAbsoluteErrorVsCpu:maxError,meanAbsoluteErrorVsCpu:sumError/result.data.length,nonfinite});
  }
  await session.release();
  return{runtime:'onnxruntime-web 1.30.0',provider:'wasm',numThreads:1,userAgent:navigator.userAgent,loadMs,receipts,warning:'Single photo smoke and three calls; no product integration or quality acceptance.'};
};
</script>
