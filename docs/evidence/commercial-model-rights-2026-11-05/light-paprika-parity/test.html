<!doctype html><meta charset="utf-8"><title>Isolated light Paprika numerical parity followup</title>
<script type="module">
import * as ort from '/ort/ort.wasm.min.mjs';
const sha=async(data)=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data)),x=>x.toString(16).padStart(2,'0')).join('');
const fetchBytes=async(path)=>{const r=await fetch(path);if(!r.ok)throw new Error(path+':'+r.status);return r.arrayBuffer()};
const compare=(out,ref)=>{let max=0,sum=0;for(let i=0;i<out.length;i++){const d=Math.abs(out[i]-ref[i]);max=Math.max(max,d);sum+=d;}return{max_absolute_error:max,mean_absolute_error:sum/out.length,threshold:2/255,passed_strict_less_than:max<2/255};};
window.runCandidate=async()=>{
 ort.env.wasm.numThreads=1;ort.env.wasm.wasmPaths='/ort/';
 const model=await fetchBytes('/model.onnx');const model_sha256=await sha(model);
 if(model_sha256!=='431f2b1c7a3ab31fbee32fcae193e4e65b2304484e0a646a481d1a61351a17a8')throw new Error('Model hash mismatch');
 const start=performance.now();const session=await ort.InferenceSession.create(model,{executionProviders:['wasm']});const load_ms=performance.now()-start;const cases=[];
 for(const name of ['usgs-mountain-lake-original.jpg','synthetic-city.png']){
  const bytes=await fetchBytes('/inputs/'+name+'.f32');const input=new Float32Array(bytes);const input_sha256=await sha(bytes);
  const cpu120=new Float32Array(await fetchBytes('/cpu120/'+name+'.f32'));const cpu130=new Float32Array(await fetchBytes('/cpu130/'+name+'.f32'));
  const tensor=new ort.Tensor('float32',input,[1,3,512,512]);const trials=[];let finalOutput;
  for(let trial=0;trial<3;trial++){
   const start=performance.now();const outputs=await session.run({image:tensor});const run_ms=performance.now()-start;const output=outputs.anime;
   if(output.type!=='float32')throw new Error('Unexpected output type');let nonfinite=0;for(const x of output.data)if(!Number.isFinite(x))nonfinite++;
   const data=new Uint8Array(output.data.buffer,output.data.byteOffset,output.data.byteLength);const hash=await sha(data);
   trials.push({run_ms,shape:output.dims,dtype:output.type,nonfinite,output_sha256:hash,error_vs_cpu1201:compare(output.data,cpu120),error_vs_cpu1300:compare(output.data,cpu130)});finalOutput=data;
  }
  const saved=await fetch('/output/'+name+'.browser130-output.f32',{method:'POST',body:finalOutput});if(!saved.ok)throw new Error('Output save failed');
  cases.push({image:name,input_sha256,trials,bitwise_deterministic:new Set(trials.map(x=>x.output_sha256)).size===1});
 }
 await session.release();return{runtime:'onnxruntime-web 1.30.0',runtime_versions:ort.env.versions,provider:'wasm',num_threads:1,user_agent:navigator.userAgent,model_sha256,load_ms,cases,limitation:'Numerical parity only; visual quality acceptance and product integration were not performed.'};
};
</script>
