<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>6패스 LT 실제 그림자 픽셀 검증</title>
<style>body{font:16px system-ui;background:#eeeeee;color:#222;padding:20px}section{display:flex;gap:16px;flex-wrap:wrap}canvas{width:256px;height:256px;border:1px solid #aaa;background:white;image-rendering:pixelated}pre{white-space:pre-wrap}h2{font-size:16px}</style>
<h1>6패스 LT 실제 그림자 픽셀 검증</h1>
<p>동일한 장면에서 상자의 그림자 투사만 끕니다. 밑색은 유지되고 별도 그림자 가림률만 사라져야 합니다.</p>
<section id="images"></section><pre id="receipt">실제 GPU 캡처 진행 중</pre>
<script type="module">
import * as THREE from "three";
import {createStudioBg3dThreeWebglCaptureAdapter} from "../../src/domains/creator/bg3d/studio-bg3d-three-webgl-capture.ts";
import {captureStudioBg3dRaster} from "../../src/domains/creator/bg3d/studio-bg3d-capture-adapter.ts";
const output = document.querySelector('#receipt');
const renderer = new THREE.WebGLRenderer({antialias:false,alpha:true});
renderer.setSize(128,128); renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.3;
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-3,3,3,-3,0.1,30);
camera.position.set(5,6,7);camera.lookAt(0,0,0);camera.updateMatrixWorld();
const floor=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshStandardMaterial({color:'#d0a060'}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const box=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,1),new THREE.MeshStandardMaterial({color:'#45a0b0'}));
box.position.set(-.4,.75,0);box.castShadow=true;box.receiveShadow=false;scene.add(box);
const light=new THREE.DirectionalLight('white',3);light.position.set(3,6,2);light.castShadow=true;
light.shadow.mapSize.set(512,512);light.shadow.camera.left=-4;light.shadow.camera.right=4;
light.shadow.camera.top=4;light.shadow.camera.bottom=-4;light.shadow.camera.near=.1;light.shadow.camera.far=20;
light.shadow.bias=-.0005;scene.add(light);scene.add(new THREE.AmbientLight('white',.5));
const request={width:128,height:128,background:{color:'#ffffff',alpha:0},includeDepth:true,includeSixPass:true};
const adapter=createStudioBg3dThreeWebglCaptureAdapter({renderer,scene,camera});
function image(label,pixels){const frame=document.createElement('div');const h=document.createElement('h2');h.textContent=label;const c=document.createElement('canvas');c.width=128;c.height=128;c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(pixels),128,128),0,0);frame.append(h,c);document.querySelector('#images').append(frame);}
function alphaSummary(bytes){let count=0,sum=0,max=0;for(let i=3;i<bytes.length;i+=4){if(bytes[i]>4)count++;sum+=bytes[i];max=Math.max(max,bytes[i]);}return {count,sum,max};}
try{
 const withShadow=await captureStudioBg3dRaster(adapter,request);
 box.castShadow=false;
 const noShadow=await captureStudioBg3dRaster(adapter,request);
 const visible=alphaSummary(withShadow.shadowRgba),disabled=alphaSummary(noShadow.shadowRgba);
 const sameAlbedo=withShadow.flatColorRgba.every((v,i)=>v===noShadow.flatColorRgba[i]);
 let occluderLeakPixels=0;
 for(let i=0;i<withShadow.flatColorRgba.length;i+=4){const albedo=withShadow.flatColorRgba;
  if(Math.abs(albedo[i]-69)<2&&Math.abs(albedo[i+1]-160)<2&&Math.abs(albedo[i+2]-176)<2&&withShadow.shadowRgba[i+3]>4)occluderLeakPixels++;}
 const originalsRestored=box.material.isMeshStandardMaterial&&floor.material.isMeshStandardMaterial&&scene.overrideMaterial===null&&renderer.toneMapping===THREE.ACESFilmicToneMapping&&renderer.toneMappingExposure===1.3;
 image('빛과 실제 그림자가 포함된 장면',withShadow.rgba);image('조명 없는 밑색',withShadow.flatColorRgba);
 image('실제 그림자 가림률',withShadow.shadowRgba);image('투사 끈 뒤 그림자 가림률',noShadow.shadowRgba);
 floor.visible=false;box.visible=false;
 const empty=await captureStudioBg3dRaster(adapter,request);
 const emptyShadow=alphaSummary(empty.shadowRgba),emptyAlbedo=alphaSummary(empty.flatColorRgba);
 const summary={withShadow:visible,withoutShadow:disabled,sameAlbedo,originalsRestored,occluderLeakPixels,emptyShadow,emptyAlbedo,
  linearDepthNearMeters:withShadow.linearDepthNearMeters,linearDepthFarMeters:withShadow.linearDepthFarMeters,
  linearDepthRange:[Math.min(...withShadow.linearDepth),Math.max(...withShadow.linearDepth)],
  success:visible.count>30&&disabled.count===0&&sameAlbedo&&originalsRestored&&occluderLeakPixels===0&&emptyShadow.count===0&&emptyAlbedo.count===0};
 output.textContent=JSON.stringify(summary,null,2);output.dataset.complete='true';output.dataset.success=String(summary.success);
}catch(error){output.textContent=error.stack??String(error);output.dataset.complete='true';output.dataset.success='false';}
finally{renderer.dispose();floor.geometry.dispose();floor.material.dispose();box.geometry.dispose();box.material.dispose();light.dispose();}
</script>
</html>
