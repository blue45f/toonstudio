<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="opfsTitle opfsDesc">
  <title id="opfsTitle">SQLite WASM · OPFS 로컬 정본 스토리지 배지</title>
  <desc id="opfsDesc">오프라인 우선 실린더 볼트와 무손실 트랜잭션 체크 인장을 결합한 SQLite WASM + OPFS 로컬 권위 배지</desc>
  <defs>
    <linearGradient id="opBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0BF7A"/>
      <stop offset="100%" stop-color="#946927"/>
    </linearGradient>
    <linearGradient id="opForest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#234939"/>
      <stop offset="100%" stop-color="#142920"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#FAF8F3" stroke="#D5CCB8" stroke-width="2"/>
  <rect x="14" y="14" width="100" height="100" rx="22" fill="url(#opForest)" stroke="url(#opBrass)" stroke-width="3"/>
  <!-- 3-Tiered OPFS Local Storage Platter Stack -->
  <path d="M36 44 C36 37.5 92 37.5 92 44 L92 80 C92 86.5 36 86.5 36 80 Z" fill="#F3F0E8" stroke="#B9893E" stroke-width="2"/>
  <ellipse cx="64" cy="44" rx="28" ry="8" fill="#FAF8F3" stroke="#B9893E" stroke-width="2"/>
  <path d="M36 56 C36 62.5 92 62.5 92 56" fill="none" stroke="#C89B4F" stroke-width="2"/>
  <path d="M36 68 C36 74.5 92 74.5 92 68" fill="none" stroke="#C89B4F" stroke-width="2"/>
  <!-- Status Indicator Pip Lights (Warm Amber / Botanical Green) -->
  <circle cx="46" cy="54" r="2.2" fill="#1F4435"/>
  <circle cx="46" cy="66" r="2.2" fill="#1F4435"/>
  <circle cx="46" cy="78" r="2.2" fill="#B85A3A"/>
  <!-- Local Authority Seal Shield + ACID Commit Check -->
  <path d="M78 64 L98 70 L98 84 C98 93 88 99 78 102 C68 99 58 93 58 84 L58 70 Z" fill="#1F4435" stroke="#E0BF7A" stroke-width="2.2" stroke-linejoin="round"/>
  <polyline points="69,82 76,89 88,75" fill="none" stroke="#FAF8F3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
