<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="a11yTitle a11yDesc">
  <title id="a11yTitle">WCAG 고대비 · 44px 촉각 접근성 배지</title>
  <desc id="a11yDesc">명암비 광학 분할 디스크와 44x44px 터치 타깃 가이드, 포커스 링을 결합한 접근성 표준 배지</desc>
  <defs>
    <linearGradient id="acBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4C482"/>
      <stop offset="100%" stop-color="#966B28"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#FAF8F3" stroke="#D5CCB8" stroke-width="2"/>
  <rect x="14" y="14" width="100" height="100" rx="22" fill="#1F4435" stroke="url(#acBrass)" stroke-width="3"/>
  <!-- 44x44px Tactile Hit-Target Focus Ring Frame -->
  <rect x="30" y="30" width="68" height="68" rx="16" fill="none" stroke="#E4C482" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- High-Contrast Optical Luminance Contrast Disc (>= 7:1 AAA Ratio Symbol) -->
  <circle cx="64" cy="64" r="23" fill="#FAF8F3" stroke="#FAF8F3" stroke-width="2"/>
  <path d="M64 41 A23 23 0 0 1 64 87 Z" fill="#142920"/>
  <!-- Counter-Balanced Inner Optical Pupils -->
  <circle cx="55" cy="64" r="5" fill="#142920"/>
  <circle cx="73" cy="64" r="5" fill="#FAF8F3"/>
  <!-- Corner Tactile Focus Brackets -->
  <g stroke="#FAF8F3" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M24 34 L24 24 L34 24"/>
    <path d="M94 24 L104 24 L104 34"/>
    <path d="M24 94 L24 104 L34 104"/>
    <path d="M94 104 L104 104 L104 94"/>
  </g>
</svg>
