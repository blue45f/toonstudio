<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="wgpuTitle wgpuDesc">
  <title id="wgpuTitle">WebGPU 컴퓨트 · 3D NPR 공간 파이프라인 배지</title>
  <desc id="wgpuDesc">아이소메트릭 3D 절두체와 워크그룹 타일 격자, 셀 림라이트를 형상화한 WebGPU 컴퓨트 기술 배지</desc>
  <defs>
    <linearGradient id="wgBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5C687"/>
      <stop offset="100%" stop-color="#9A6F2B"/>
    </linearGradient>
    <linearGradient id="wgSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2D33"/>
      <stop offset="100%" stop-color="#121C20"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#FAF8F3" stroke="#D5CCB8" stroke-width="2"/>
  <rect x="14" y="14" width="100" height="100" rx="22" fill="url(#wgSlate)" stroke="url(#wgBrass)" stroke-width="3"/>
  <!-- Compute Workgroup Tile Matrix Backdrop -->
  <g stroke="#2E4A52" stroke-width="1" opacity="0.75">
    <line x1="28" y1="44" x2="100" y2="44"/>
    <line x1="28" y1="64" x2="100" y2="64"/>
    <line x1="28" y1="84" x2="100" y2="84"/>
    <line x1="44" y1="28" x2="44" y2="100"/>
    <line x1="64" y1="28" x2="64" y2="100"/>
    <line x1="84" y1="28" x2="84" y2="100"/>
  </g>
  <!-- Isometric Cel-Shaded 3D Spatial Cube -->
  <!-- Top Lit Face (Warm Sunlight Alabaster-Gold) -->
  <polygon points="64,32 92,48 64,64 36,48" fill="#F2DFB6" stroke="#121C20" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left Midtone Cel Face (Mineral Teal) -->
  <polygon points="36,48 64,64 64,96 36,80" fill="#2F7D75" stroke="#121C20" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right Core Shadow Cel Face (Botanical Forest Slate) -->
  <polygon points="64,64 92,48 92,80 64,96" fill="#1F4435" stroke="#121C20" stroke-width="2" stroke-linejoin="round"/>
  <!-- Crisp Rim-Light Edge Highlight -->
  <polyline points="36,48 64,32 92,48" fill="none" stroke="#FFF9EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Camera Frustum Ray Nodes -->
  <circle cx="64" cy="32" r="3.2" fill="#E5C687"/>
  <circle cx="36" cy="48" r="2.8" fill="#E5C687"/>
  <circle cx="92" cy="48" r="2.8" fill="#E5C687"/>
  <circle cx="64" cy="96" r="3.2" fill="#E5C687"/>
</svg>
