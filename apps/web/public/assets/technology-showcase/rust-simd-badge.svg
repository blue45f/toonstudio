<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="rustSimdTitle rustSimdDesc">
  <title id="rustSimdTitle">Rust WASM64 · SIMD 벡터 연산 엔진 배지</title>
  <desc id="rustSimdDesc">4레인 SIMD 병렬 레지스터와 정밀 기어 베젤, 브러시 펜촉을 결합한 ToonStudio Rust WASM64 코어 기술 배지</desc>
  <defs>
    <linearGradient id="rsBrassRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2C17E"/>
      <stop offset="52%" stop-color="#B9893E"/>
      <stop offset="100%" stop-color="#8A6124"/>
    </linearGradient>
    <linearGradient id="rsEnamel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21382F"/>
      <stop offset="100%" stop-color="#13221C"/>
    </linearGradient>
  </defs>
  <!-- Outer Warm Atelier Medallion Plate -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#FAF8F3" stroke="#D5CCB8" stroke-width="2"/>
  <rect x="14" y="14" width="100" height="100" rx="22" fill="url(#rsEnamel)" stroke="url(#rsBrassRim)" stroke-width="3"/>
  <!-- Precision Gear Notch Ring -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#C89B4F" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.72"/>
  <circle cx="64" cy="64" r="34" fill="#182B24" stroke="#35594B" stroke-width="1.5"/>
  <!-- 4-Lane 128-bit SIMD Parallel Register Tracks -->
  <g stroke-linecap="round">
    <rect x="36" y="42" width="32" height="6" rx="3" fill="#E2C17E"/>
    <rect x="36" y="53" width="40" height="6" rx="3" fill="#C97046"/>
    <rect x="36" y="64" width="28" height="6" rx="3" fill="#6BB39B"/>
    <rect x="36" y="75" width="36" height="6" rx="3" fill="#E2C17E"/>
  </g>
  <!-- Sculpted Precision Nib + 64-bit Vector Arrowhead -->
  <path d="M72 38 L94 64 L72 90 L77 64 Z" fill="#FAF8F3" stroke="#B9893E" stroke-width="1.75" stroke-linejoin="round"/>
  <circle cx="81" cy="64" r="3" fill="#1F4435"/>
  <line x1="84" y1="64" x2="94" y2="64" stroke="#1F4435" stroke-width="1.75"/>
  <!-- Corner Calibration Rivets -->
  <circle cx="24" cy="24" r="2.2" fill="#C89B4F"/>
  <circle cx="104" cy="24" r="2.2" fill="#C89B4F"/>
  <circle cx="24" cy="104" r="2.2" fill="#C89B4F"/>
  <circle cx="104" cy="104" r="2.2" fill="#C89B4F"/>
</svg>
