<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="crdtTitle crdtDesc">
  <title id="crdtTitle">Yjs CRDT · 제로트러스트 P2P 협업 배지</title>
  <desc id="crdtDesc">무충돌 분기·병합 다이아몬드 그래프와 종단간 암호화 키스톤을 형상화한 P2P 동시 작업 배지</desc>
  <defs>
    <linearGradient id="cpBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4C482"/>
      <stop offset="100%" stop-color="#966B28"/>
    </linearGradient>
    <linearGradient id="cpCharcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252A27"/>
      <stop offset="100%" stop-color="#161A18"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#FAF8F3" stroke="#D5CCB8" stroke-width="2"/>
  <rect x="14" y="14" width="100" height="100" rx="22" fill="url(#cpCharcoal)" stroke="url(#cpBrass)" stroke-width="3"/>
  <!-- Outer Convergence Orbit -->
  <circle cx="64" cy="64" r="35" fill="none" stroke="#45564E" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Symmetrical CRDT Fork & Deterministic Merge Graph -->
  <path d="M64 30 C44 38 38 50 38 64 C38 78 44 90 64 98" fill="none" stroke="#E4C482" stroke-width="3" stroke-linecap="round"/>
  <path d="M64 30 C84 38 90 50 90 64 C90 78 84 90 64 98" fill="none" stroke="#6BB39B" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="64" x2="90" y2="64" stroke="#FAF8F3" stroke-width="2" stroke-dasharray="3 3" opacity="0.8"/>
  <!-- Central Zero-Trust Keystone Diamond -->
  <polygon points="64,50 78,64 64,78 50,64" fill="#1F4435" stroke="#E4C482" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="64" cy="64" r="4" fill="#FAF8F3"/>
  <!-- Peer & Snapshot State Nodes -->
  <circle cx="64" cy="30" r="6" fill="#FAF8F3" stroke="#B9893E" stroke-width="2.2"/>
  <circle cx="38" cy="64" r="6" fill="#E4C482" stroke="#161A18" stroke-width="2"/>
  <circle cx="90" cy="64" r="6" fill="#6BB39B" stroke="#161A18" stroke-width="2"/>
  <circle cx="64" cy="98" r="6" fill="#FAF8F3" stroke="#1F4435" stroke-width="2.5"/>
</svg>
