<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181917" media="(prefers-color-scheme: dark)">
  <meta name="application-name" content="툰스튜디오 드로잉">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="툰드로잉">
  <title>ToonStudio Draw 설치</title>
  <link rel="manifest" href="/draw-app/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/brand/spectrum-ribbon-v2/apple-touch-icon.png">
  <link rel="stylesheet" href="/draw-app/install.css">
</head>
<body>
  <main class="install-shell">
    <a class="install-brand" href="/studio"><img src="/brand/spectrum-ribbon-v2/favicon.svg" alt="">ToonStudio</a>
    <section class="install-card" aria-labelledby="draw-app-title">
      <h1 id="draw-app-title">툰스튜디오 드로잉 설치</h1>
      <p class="install-lead">홈 화면에서 작품 보관함을 바로 여세요. 웹과 설치 앱에서 같은 드로잉 도구를 사용합니다.</p>
      <button id="install-app" type="button" disabled>드로잉 앱 설치 준비 중…</button>
      <p id="install-status" role="status" aria-live="polite">브라우저 설치 가능 여부를 확인하고 있습니다.</p>
      <p id="install-help" hidden></p>
      <p id="offline-status" role="status" hidden></p>
      <div class="install-links">
        <a href="/studio">브라우저에서 작품 보관함 열기</a>
      </div>
    </section>
  </main>
  <script src="/draw-app/install.js"></script>
</body>
</html>
