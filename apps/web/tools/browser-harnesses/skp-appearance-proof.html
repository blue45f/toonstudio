<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SKP appearance 수동 브라우저 회귀</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.6 system-ui, sans-serif; }
      body { margin: 0 auto; max-width: 72rem; padding: 1.25rem; }
      button { min-height: 44px; padding: .5rem 1rem; font: inherit; }
      button:focus-visible { outline: 3px solid Highlight; outline-offset: 3px; }
      .actions { display: flex; flex-wrap: wrap; gap: .75rem; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <h1>SKP appearance 수동 브라우저 회귀</h1>
    <p>버튼 또는 QA 함수를 호출할 때만 자체 생성 파일 5개를 실제 변환합니다. 제품 기본 Worker,
      최종 GLB 로더와 브라우저 이미지 디코딩을 검사하며 WebGL·GPU 렌더 검증은 수행하지 않습니다.</p>
    <p>이 소스는 타입 검사·빌드·실행 전 후보입니다. 성공 결과는 실제 실행 뒤에만 표시됩니다.</p>
    <div class="actions">
      <button id="run" type="button">수동 회귀 실행</button>
      <button id="cancel" type="button" disabled>실행 취소</button>
    </div>
    <p id="status" role="status" aria-live="polite">대기 중</p>
    <pre id="output" aria-label="회귀 결과" data-state="idle"></pre>
    <script type="module" src="./skp-appearance-proof.ts"></script>
  </body>
</html>
