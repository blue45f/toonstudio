<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구매 번들 렌더 실물 검증</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; }
      .bundle-runtime-harness { width: min(100%, 1280px); margin: 0 auto; padding: 20px; color: var(--color-fg); }
      .bundle-runtime-harness h1 { margin: 0 0 12px; font-size: clamp(22px, 4vw, 32px); font-weight: 750; }
      .bundle-runtime-harness h2 { margin: 0 0 12px; font-size: 18px; font-weight: 700; }
      .bundle-runtime-harness p { margin: 8px 0; line-height: 1.65; }
      .bundle-runtime-harness header { margin-bottom: 20px; }
      .bundle-runtime-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; gap: 20px; }
      .bundle-runtime-grid > *, .bundle-runtime-section { min-width: 0; }
      .bundle-runtime-section { margin-bottom: 20px; padding: 16px; border: 1px solid var(--color-line); border-radius: 14px; background: var(--color-panel); }
      .bundle-runtime-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      .bundle-runtime-controls button { min-height: 44px; padding: 8px 14px; border: 1px solid var(--color-line-strong); border-radius: 8px; background: var(--color-card); font-weight: 650; }
      .bundle-runtime-controls button:disabled { opacity: .55; cursor: not-allowed; }
      .bundle-runtime-controls button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; }
      .bundle-runtime-harness dl { display: grid; grid-template-columns: minmax(70px, .3fr) minmax(0, 1fr); gap: 8px 12px; margin-top: 14px; font-size: 13px; }
      .bundle-runtime-harness dt { color: var(--color-fg-3); }
      .bundle-runtime-harness dd { margin: 0; overflow-wrap: anywhere; }
      .bundle-runtime-harness canvas { display: block; width: 100%; height: auto; max-width: 100%; border: 1px solid var(--color-line); border-radius: 10px; background-color: #ece9e3; background-image: linear-gradient(45deg, #d4d0c8 25%, transparent 25%), linear-gradient(-45deg, #d4d0c8 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #d4d0c8 75%), linear-gradient(-45deg, transparent 75%, #d4d0c8 75%); background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0; }
      .bundle-runtime-harness progress { display: block; width: 100%; height: 16px; accent-color: var(--color-accent); }
      .bundle-runtime-harness [role="alert"] { color: var(--color-bad); overflow-wrap: anywhere; }
      .bundle-runtime-harness ul { padding-left: 20px; overflow-wrap: anywhere; }
      @media (max-width: 760px) {
        .bundle-runtime-harness { padding: 12px; }
        .bundle-runtime-grid { grid-template-columns: minmax(0, 1fr); gap: 0; }
        .bundle-runtime-section { padding: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="bundle-renders-runtime-root"></div>
    <script type="module" src="./bundle-renders-runtime.tsx"></script>
  </body>
</html>
