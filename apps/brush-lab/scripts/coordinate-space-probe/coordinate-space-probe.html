<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>brush-lab coordinate space probe</title>
    <link rel="icon" href="data:," />
  </head>
  <body style="margin:0;padding:0;background:#f4f4f6;">
    <!-- scripts/coordinate-space-probe/coordinate-space-probe.mjs가 Vite dev 서버로 이 페이지를 열고 window.__brushLabCoordinateProbe를 호출한다. -->
    <div id="coord-scroll-host" style="position:relative;overflow:auto;width:100vw;height:100vh;box-sizing:border-box;">
      <div id="coord-spacer" style="position:relative;min-width:2400px;min-height:2000px;box-sizing:border-box;">
        <div id="coord-transform-host" style="position:relative;transform-origin:top left;display:inline-block;">
          <div
            id="coord-stage"
            style="position:relative;width:256px;height:256px;touch-action:none;user-select:none;background:#ffffff;"
          >
            <canvas
              id="coord-present"
              width="256"
              height="256"
              style="position:absolute;inset:0;width:100%;height:100%;display:block;"
            ></canvas>
            <canvas
              id="coord-preview"
              width="256"
              height="256"
              style="position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;"
            ></canvas>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./coordinate-space-probe-page.mjs"></script>
  </body>
</html>
