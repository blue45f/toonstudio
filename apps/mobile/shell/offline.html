<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10182d" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; navigate-to https://www.toonstudio.cloud" />
    <title>연결을 확인해 주세요 · 툰스튜디오</title>
    <link rel="stylesheet" href="mobile.css" />
    <script src="offline.js" defer></script>
  </head>
  <body>
    <main aria-labelledby="title">
      <div class="top-badge-row">
        <span class="safety-pill">로컬 원고 보호 중 · 데이터 삭제 없음</span>
      </div>
      <img class="logo" src="icon-192.png" width="80" height="80" alt="" />
      <p class="eyebrow">Connection Paused</p>
      <h1 id="title">툰스튜디오에 연결할 수 없어요</h1>
      <p>네트워크 연결을 확인한 뒤 다시 시도해 주세요. 기기에 저장된 원고와 임시본은 안전하게 유지됩니다.</p>
      <div class="skeleton-stage" aria-hidden="true" data-mobile-skeleton="offline">
        <div class="skeleton-bar"></div>
        <div class="skeleton-bar short"></div>
      </div>
      <div class="actions">
        <button id="retry" class="primary" type="button">다시 연결</button>
        <a class="button secondary" href="https://www.toonstudio.cloud/studio">스튜디오 열기</a>
      </div>
      <p id="status" class="status" role="status"></p>
    </main>
  </body>
</html>
