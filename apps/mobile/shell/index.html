<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10182d" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; navigate-to https://www.toonstudio.cloud" />
    <title>툰스튜디오</title>
    <link rel="stylesheet" href="mobile.css" />
    <script src="launch.js" defer></script>
  </head>
  <body>
    <main aria-labelledby="title">
      <div class="top-badge-row">
        <span class="safety-pill">오프라인 로컬 원고 보호 지원</span>
      </div>
      <img class="logo" src="icon-192.png" width="80" height="80" alt="" />
      <p class="eyebrow">ToonStudio Mobile</p>
      <h1 id="title">툰스튜디오를 여는 중</h1>
      <p>웹툰 제작 스튜디오와 최근 작업공간을 안전하게 연결하고 있습니다.</p>
      <div class="skeleton-stage" aria-hidden="true" data-mobile-skeleton="true">
        <div class="skeleton-card"></div>
        <div class="skeleton-bar"></div>
        <div class="skeleton-bar short"></div>
      </div>
      <p class="status" role="status">작업공간 골격 준비 중…</p>
    </main>
  </body>
</html>
